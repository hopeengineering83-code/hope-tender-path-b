name: Worker Exact-Head Validation

# Fail-closed, exact-head CI for application-worker PRs (including drafts) whose
# base is integration/controlled-recovery. Closes the gap where worker PRs
# received no CI at all.
#
# This workflow is VALIDATION ONLY. It never merges, approves, marks ready,
# deploys, or runs a production migration. A green result is NOT approval — the
# Repair Coordinator may at most move the PR to `awaiting-independent-audit`, and
# integration still requires an authorized independent CONTROL_TOWER_AUDIT tied
# to the exact head (see integration-controller.yml).
#
# Privilege separation (untrusted execution vs. trusted evidence):
#   - `resolve-head` and `execute` never hold checks:write. `execute` runs the
#     worker's own code (npm ci lifecycle scripts, tests, build) with
#     contents:read ONLY, so a compromised worker commit or package script cannot
#     forge or manipulate validation evidence.
#   - `publish-evidence` holds checks:write but performs NO checkout and runs NO
#     worker code — it only publishes the named exact-head check run, and only
#     after the untrusted `execute` job succeeded and the head has not moved.
#   - `pull_request` trigger (never pull_request_target): repository secrets are
#     not exposed to PR code, and forked heads are rejected outright.
#   - Missing DB config => NOT_CONFIGURED; any skipped required test =>
#     SKIPPED_BLOCKER; a required suite that does not EXECUTED_PASS blocks.
#     Required suites come from .github/release-control/required-suites.json.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - integration/controlled-recovery
  workflow_dispatch:
    inputs:
      pr_number:
        description: Worker PR number to validate at its exact current head
        required: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: worker-validation-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  resolve-head:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      head_sha: ${{ steps.resolve.outputs.head_sha }}
      pr_number: ${{ steps.resolve.outputs.pr_number }}
      lane: ${{ steps.resolve.outputs.lane }}
      harness_sha: ${{ steps.resolve.outputs.harness_sha }}
    steps:
      - name: Resolve exact worker head and reject ineligible PRs (fail closed)
        id: resolve
        uses: actions/github-script@v7
        env:
          INPUT_PR: ${{ inputs.pr_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.eventName === 'workflow_dispatch'
              ? Number(process.env.INPUT_PR)
              : context.payload.pull_request.number;
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.state !== 'open') { core.setFailed('NOT_CONFIGURED: PR is not open.'); return; }
            if (pr.base.ref !== 'integration/controlled-recovery') {
              core.setFailed('NOT_CONFIGURED: worker validation only runs for base integration/controlled-recovery.');
              return;
            }
            if (pr.head.repo.full_name !== `${owner}/${repo}`) {
              core.setFailed('NOT_CONFIGURED: fork heads are not eligible; workers must use an in-repository branch.');
              return;
            }
            // Pin ONE trusted-harness SHA (the default branch's current commit) and
            // use it for the lane mapping + registry here AND for the runner/manifest/
            // policy in the execute job, so a moving default branch cannot swap the
            // harness mid-run. The pinned harness SHA is published beside the worker SHA.
            const defBranch = context.payload.repository?.default_branch || 'main';
            let harnessSha, laneMap, manifestLanes = [];
            try {
              const { data: br } = await github.rest.repos.getBranch({ owner, repo, branch: defBranch });
              harnessSha = br.commit.sha;
              const readJson = async (path) => {
                const { data } = await github.rest.repos.getContent({ owner, repo, path, ref: harnessSha });
                return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              };
              laneMap = await readJson('.github/release-control/lane-mapping.json');
              manifestLanes = Object.keys((await readJson('.github/release-control/required-suites.json')).lanes || {});
            } catch (e) {
              core.setFailed('NOT_CONFIGURED: the trusted lane mapping/registry could not be read from the pinned default-branch harness.');
              return;
            }
            // Derive the lane from the immutable ISSUE + exact BRANCH authority FIRST;
            // a worker cannot select any recognized label. The PR's head branch must
            // map to exactly one lane; if the body declares Closes #N it must equal that
            // lane's issue; then the single lane:<NAME> label must equal the derived lane.
            const lanes = laneMap.lanes || {};
            const derived = Object.entries(lanes).filter(([, def]) => def.branch && def.branch === pr.head.ref);
            if (derived.length !== 1) {
              core.setFailed(`NOT_CONFIGURED: worker head branch '${pr.head.ref}' is not mapped to exactly one lane in the immutable lane mapping (found ${derived.length}). Read-only/dependency work has no mapped branch and cannot be validated as a coding lane.`);
              return;
            }
            const [derivedLane, derivedDef] = derived[0];
            if (derivedDef.requires_start_authorization) {
              core.setFailed(`NOT_CONFIGURED: lane '${derivedLane}' is read-only until an exact-SHA START_AUTHORIZATION and cannot be validated as a coding lane.`);
              return;
            }
            if (!manifestLanes.includes(derivedLane)) {
              core.setFailed(`NOT_CONFIGURED: derived lane '${derivedLane}' has no focused required suite in the trusted manifest.`);
              return;
            }
            const closes = (pr.body || '').match(/closes\s+#(\d+)/i);
            if (closes && derivedDef.issue && Number(closes[1]) !== Number(derivedDef.issue)) {
              core.setFailed(`NOT_CONFIGURED: PR declares Closes #${closes[1]} but branch '${pr.head.ref}' maps to lane '${derivedLane}' (issue #${derivedDef.issue}).`);
              return;
            }
            const laneLabels = (pr.labels || []).map(l => l.name).filter(n => n.startsWith('lane:')).map(n => n.slice('lane:'.length));
            if (laneLabels.length !== 1 || laneLabels[0] !== derivedLane) {
              core.setFailed(`NOT_CONFIGURED: the worker PR must carry exactly one lane label matching its derived lane '${derivedLane}'; found [${laneLabels.join(', ') || 'none'}].`);
              return;
            }
            core.setOutput('lane', derivedLane);
            core.setOutput('harness_sha', harnessSha);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr_number', String(prNumber));

  execute:
    # UNTRUSTED: runs the worker's own code with a read-only token (contents:read
    # only; no check-write and no pull-request-write scope). A failure here blocks
    # integration because publish-evidence will not run.
    needs: resolve-head
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_ci
          POSTGRES_DB: hope_tender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_ci -d hope_tender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Disposable PostgreSQL service on localhost ONLY. No production database
      # URL or secret is referenced anywhere in this workflow.
      DATABASE_URL: "postgresql://hope_ci@127.0.0.1:5432/hope_tender_ci?schema=public"
      SESSION_SECRET: "ci-session-${{ github.run_id }}-${{ github.sha }}"
      NEXTAUTH_SECRET: "ci-nextauth-${{ github.run_id }}-${{ github.sha }}"
      GEMINI_API_KEY: "ci-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"
      # Authenticated Playwright: deterministic disposable-DB seeding with CI-only
      # credentials derived from the run id. No production secret is referenced.
      E2E_FULL_AUTH: "true"
      E2E_SEED_ALLOWED: "true"
      E2E_TEST_EMAIL: "e2e-primary@worker-validation.test"
      E2E_TEST_PASSWORD: "WvPrimary-${{ github.run_id }}-A9!secure"
      E2E_SECOND_EMAIL: "e2e-secondary@worker-validation.test"
      E2E_SECOND_PASSWORD: "WvSecondary-${{ github.run_id }}-B8!secure"
      WORKER_HEAD_SHA: ${{ needs.resolve-head.outputs.head_sha }}
      WORKER_LANE: ${{ needs.resolve-head.outputs.lane }}
    steps:
      - name: Checkout the exact worker head
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve-head.outputs.head_sha }}
          fetch-depth: 0

      - name: Confirm checkout is the exact PR head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${WORKER_HEAD_SHA}" \
            || { echo "NOT_CONFIGURED: checkout head does not match the resolved PR head."; exit 1; }

      - name: Fail closed on missing database configuration (NOT_CONFIGURED)
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}" || { echo "NOT_CONFIGURED: DATABASE_URL is empty."; exit 1; }
          case "${DATABASE_URL}" in
            postgres://*|postgresql://*) : ;;
            *) echo "NOT_CONFIGURED: DATABASE_URL is not a PostgreSQL URL."; exit 1 ;;
          esac
          test "${RUN_DB_INTEGRATION}" = "true" \
            || { echo "SKIPPED_BLOCKER: RUN_DB_INTEGRATION must be true so database suites are not skipped."; exit 1; }
          for _ in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U hope_ci -d hope_tender_ci >/dev/null 2>&1; then
              echo "Disposable PostgreSQL reachable."
              exit 0
            fi
            sleep 2
          done
          echo "NOT_CONFIGURED: disposable PostgreSQL service is not reachable."
          exit 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject install-time source mutation
        run: git diff --exit-code

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare the disposable database schema
        shell: bash
        run: |
          set -euo pipefail
          # Disposable service only (127.0.0.1). This is never a production
          # migration — no production DATABASE_URL/secret is used here.
          npx prisma migrate deploy

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Install browser for required end-to-end suite
        run: npx playwright install --with-deps chromium

      - name: Checkout the trusted validation harness (pinned harness SHA)
        uses: actions/checkout@v4
        with:
          # Pinned to the exact harness SHA resolved once in resolve-head, so the
          # registry, runner, manifest, and required-check policy all come from a
          # single immutable trusted commit even if the default branch moves.
          ref: ${{ needs.resolve-head.outputs.harness_sha }}
          path: _trusted
          sparse-checkout: |
            .github/release-control
          sparse-checkout-cone-mode: false

      - name: Verify the trusted harness is present (fail closed)
        shell: bash
        run: |
          set -euo pipefail
          # The runner and manifest are executed from the TRUSTED default-branch
          # checkout, never from the worker's checkout, so a worker PR cannot alter
          # the validation logic or the required-suite set to fake a pass.
          test -f _trusted/.github/release-control/run-required-suites.sh \
            || { echo "NOT_CONFIGURED: trusted required-suite runner is not present on the default branch."; exit 1; }
          test -f _trusted/.github/release-control/required-suites.json \
            || { echo "NOT_CONFIGURED: trusted required-suite manifest is not present on the default branch."; exit 1; }

      - name: Seed disposable E2E users (CI-only credentials; no production secrets)
        shell: bash
        run: node scripts/seed-e2e-user.mjs

      - name: Run required suites (TRUSTED harness; fail closed on missing/skipped/failed)
        shell: bash
        run: |
          set -euo pipefail
          # Runner + manifest come from the trusted checkout; the suites they run
          # exercise the worker's app code in the repository-root working directory.
          bash _trusted/.github/release-control/run-required-suites.sh \
            _trusted/.github/release-control/required-suites.json \
            worker-validation-results \
            "${WORKER_LANE}"

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          npm run build

      - name: Upload execution diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worker-validation-${{ needs.resolve-head.outputs.head_sha }}
          path: worker-validation-results/
          if-no-files-found: ignore
          retention-days: 7

  publish-evidence:
    # TRUSTED: no checkout, no worker code. Publishes the named exact-head check
    # run ONLY after the untrusted execute job succeeded and the head is unchanged.
    needs: [resolve-head, execute]
    if: ${{ needs.execute.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      checks: write
    steps:
      - name: Confirm the PR head did not move (invalidate stale evidence)
        uses: actions/github-script@v7
        env:
          WORKER_HEAD_SHA: ${{ needs.resolve-head.outputs.head_sha }}
          WORKER_PR_NUMBER: ${{ needs.resolve-head.outputs.pr_number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: Number(process.env.WORKER_PR_NUMBER),
            });
            if (pr.head.sha !== process.env.WORKER_HEAD_SHA) {
              core.setFailed(`Worker head moved during validation (${process.env.WORKER_HEAD_SHA} -> ${pr.head.sha}); this validation evidence is invalid.`);
            }

      - name: Publish exact-head validation evidence
        uses: actions/github-script@v7
        env:
          WORKER_HEAD_SHA: ${{ needs.resolve-head.outputs.head_sha }}
          WORKER_LANE: ${{ needs.resolve-head.outputs.lane }}
          HARNESS_SHA: ${{ needs.resolve-head.outputs.harness_sha }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'worker-exact-head-validation',
              head_sha: process.env.WORKER_HEAD_SHA,
              status: 'completed',
              conclusion: 'success',
              external_id: `harness:${process.env.HARNESS_SHA};run:${process.env.RUN_ID}`,
              output: {
                title: 'Worker exact-head validation passed',
                summary: [
                  `Exact head: ${process.env.WORKER_HEAD_SHA}`,
                  `Trusted harness SHA: ${process.env.HARNESS_SHA}`,
                  `Lane: ${process.env.WORKER_LANE}`,
                  `Run ID: ${process.env.RUN_ID}`,
                  'Untrusted job (contents:read only) ran npm ci, prisma validate/generate,',
                  'disposable PostgreSQL migrate, typecheck, lint, the trusted required-suite',
                  'manifest (default + lane-specific suites, seeded authenticated e2e; zero skips), and build.',
                  'This trusted publisher executed no worker code. Validation only —',
                  'not approval, acceptance, merge, or deployment.',
                ].join('\n'),
              },
            });
