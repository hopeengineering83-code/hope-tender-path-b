name: Apply AI proposal ownership before job creation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/ai-proposal-owner-before-job-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Insert ownership guard before AiJob creation
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/api/tenders/[id]/ai-proposal/route.ts')
          source = path.read_text()

          import_anchor = 'import { withTransactionalGenerationGate } from "../../../../../lib/engine/transactional-generation-gate";\n'
          import_line = 'import { userOwnsTenderForProposalJob } from "../../../../../lib/engine/ai-proposal-job-ownership";\n'
          if import_line not in source:
              if import_anchor not in source:
                  raise SystemExit('ownership import anchor not found')
              source = source.replace(import_anchor, import_anchor + import_line, 1)

          guard_anchor = '  const tenderId = id as string;\n  const uid = userId as string;\n'
          guard = '''  const tenderId = id as string;
          const uid = userId as string;

          // Resolve ownership before creating or resuming any proposal job. A
          // foreign or missing tender ID must return the same 404 and create
          // zero AiJob rows.
          const ownsTenderForProposalJob = await userOwnsTenderForProposalJob(
            prisma,
            tenderId,
            uid,
          );
          if (!ownsTenderForProposalJob) {
            return NextResponse.json({ error: "Tender not found" }, { status: 404 });
          }
'''
          if 'userOwnsTenderForProposalJob(' not in source:
              if guard_anchor not in source:
                  raise SystemExit('ownership guard anchor not found')
              source = source.replace(guard_anchor, guard, 1)

          ownership_pos = source.index('userOwnsTenderForProposalJob(')
          create_pos = source.index('prisma.aiJob.create({')
          if ownership_pos < 0 or create_pos < 0 or ownership_pos >= create_pos:
              raise SystemExit('ownership check is not before AiJob.create')

          path.write_text(source)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/tenders/[id]/ai-proposal/route.ts
          git commit -m "fix: verify tender ownership before proposal job creation"
          git push origin HEAD:${{ github.head_ref }}
