name: Controlled branch policy

on:
  pull_request:
    branches:
      - main
      - integration/production-engine-2026-06
      - release/production-engine-2026-06

permissions:
  contents: read

jobs:
  validate-route:
    name: Validate controlled PR route
    runs-on: ubuntu-latest
    steps:
      - name: Check source and target branches
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Validating ${HEAD_BRANCH} -> ${BASE_BRANCH}"

          case "${BASE_BRANCH}" in
            main)
              if [[ "${HEAD_BRANCH}" != "release/production-engine-2026-06" && "${HEAD_BRANCH}" != "release/main-safe-cherrypick-security-integrity" && "${HEAD_BRANCH}" != hotfix/* && "${HEAD_BRANCH}" != jules/* && "${HEAD_BRANCH}" != claude/* && "${HEAD_BRANCH}" != fix/* && "${HEAD_BRANCH}" != codex/* && "${HEAD_BRANCH}" != *smoke-tests* ]]; then
                echo "Only the controlled release branch, cherry-pick branch, hotfix, jules, claude, fix, codex, or smoke-test branch may target main."
                exit 1
              fi
              ;;
            integration/production-engine-2026-06)
              if [[ "${HEAD_BRANCH}" != feature/* && "${HEAD_BRANCH}" != fix/integration-* ]]; then
                echo "Only isolated feature branches or integration-fix branches may target integration."
                exit 1
              fi
              ;;
            release/production-engine-2026-06)
              if [[ "${HEAD_BRANCH}" != fix/release-* && "${HEAD_BRANCH}" != integration/production-engine-2026-06 ]]; then
                echo "Only the approved integration branch or a release-fix branch may target release."
                exit 1
              fi
              ;;
            *)
              echo "Unexpected protected target branch: ${BASE_BRANCH}"
              exit 1
              ;;
          esac

          echo "Controlled PR route accepted."
