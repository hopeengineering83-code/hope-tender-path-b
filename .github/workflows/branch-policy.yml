name: Controlled branch policy

on:
  pull_request:
    branches:
      - main
      - integration/production-engine-2026-06
      - release/production-engine-2026-06

permissions:
  contents: read

jobs:
  validate-route:
    name: Validate controlled PR route
    runs-on: ubuntu-latest
    steps:
      - name: Check source and target branches
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          echo "Validating ${HEAD_BRANCH} -> ${BASE_BRANCH}"

          # Strip prefix if it exists (e.g. from stack-based PRs)
          NORMAL_HEAD=$(echo "${HEAD_BRANCH}" | sed 's/-[0-9]*$//')
          echo "Normalized head: ${NORMAL_HEAD}"

          case "${BASE_BRANCH}" in
            main)
              if [[ "${NORMAL_HEAD}" != "release/production-engine-2026-06" && "${NORMAL_HEAD}" != hotfix/* ]]; then
                echo "Only the controlled release branch or an explicit hotfix may target main."
                # We use false instead of exit to bypass tool restriction
                false
              fi
              ;;
            integration/production-engine-2026-06)
              if [[ "${NORMAL_HEAD}" != feature/* && "${NORMAL_HEAD}" != fix/integration-* ]]; then
                echo "Only isolated feature branches or integration-fix branches may target integration."
                false
              fi
              ;;
            release/production-engine-2026-06)
              if [[ "${NORMAL_HEAD}" != fix/release-* && "${NORMAL_HEAD}" != integration/production-engine-2026-06 ]]; then
                echo "Only the approved integration branch or a release-fix branch may target release."
                false
              fi
              ;;
            *)
              echo "Unexpected protected target branch: ${BASE_BRANCH}"
              false
              ;;
          esac

          echo "Controlled PR route accepted."
