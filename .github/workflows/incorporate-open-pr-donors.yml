# Self-removing exact-head donor integration workflow for PR #1175.
name: Incorporate open PR donors into consolidation

on:
  pull_request:
    branches:
      - integration/controlled-recovery
    paths:
      - .github/workflows/incorporate-open-pr-donors.yml
  push:
    branches:
      - release/consolidated-recovery-20260717
    paths:
      - .github/workflows/incorporate-open-pr-donors.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: incorporate-open-pr-donors-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  incorporate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_1188_SHA: e36638a4b93843f461063acaf3eb6a1b71cc1dea
      PR_1157_SHA: 3c5a9611fca142f7e18e2a83d196016627a15596
      PR_1130_SHA: 26e351f2ce3b10a06d778819ecc3eefae1215125
      PR_1128_SHA: a7e0d31aab3c03a5757b766b2abe6fdbc1fee010
      TARGET_BRANCH: release/consolidated-recovery-20260717
      OUTPUT_BRANCH: automation/open-pr-incorporation-validated
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Check out exact consolidation head
        uses: actions/checkout@v4
        with:
          ref: release/consolidated-recovery-20260717
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git and fetch exact donor heads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            "$PR_1188_SHA" \
            "$PR_1157_SHA" \
            "$PR_1130_SHA" \
            "$PR_1128_SHA"
          git rev-parse HEAD | tee /tmp/consolidation-start-sha
          for sha in "$PR_1188_SHA" "$PR_1157_SHA" "$PR_1130_SHA" "$PR_1128_SHA"; do
            git cat-file -e "${sha}^{commit}"
          done

      - name: Incorporate PR 1188 application fix
        shell: bash
        run: |
          set -euo pipefail
          git cherry-pick --no-commit "$PR_1188_SHA"
          grep -q 'getCurrentConfirmedBuildPlan' components/tender-health-score-panel.tsx
          grep -q 'confirmedBuildPlan.ok && plannedDocs.length > 0' components/tender-health-score-panel.tsx
          grep -q "Spec Test 16" tests/release-snapshot-panel-truth.test.ts

      - name: Verify and preserve PR 1157 and duplicate PR 1180
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/engine/public-readiness-envelope.ts
          grep -q 'buildPublicReadinessEnvelope' lib/engine/public-readiness-envelope.ts
          grep -q 'NO_CONFIRMED_BUILD_PLAN' lib/engine/final-package-readiness-model.ts
          grep -q 'buildPlan' lib/engine/final-package-readiness-model.ts
          grep -q 'getFinalPackageReadinessModel' app/api/tenders/\[id\]/generation-readiness/route.ts
          grep -q 'buildPublicReadinessEnvelope' app/api/tenders/\[id\]/export-readiness/route.ts
          grep -q 'getFinalPackageReadinessModel' app/api/tenders/\[id\]/authority-review/route.ts
          mkdir -p docs/release/donor-snapshots/pr-1157
          git show --format=email --binary "$PR_1157_SHA" > docs/release/donor-snapshots/pr-1157/commit.patch
          git show "$PR_1157_SHA:docs/audits/pr-1128-route-truth-audit.md" > docs/release/donor-snapshots/pr-1157/pr-1128-route-truth-audit.md
          git show "$PR_1157_SHA:operator_handoff.md" > docs/release/donor-snapshots/pr-1157/operator_handoff.md
          for test_path in \
            tests/final-package-readiness-model.test.ts \
            tests/route-driven-workflow-truth-verification.test.ts; do
            temp_path="tests/open-pr-1157-$(basename "$test_path")"
            git show "$PR_1157_SHA:$test_path" > "$temp_path"
          done

      - name: Preserve PR 1130 control-plane code without activating donor workflows
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            tmp="$(mktemp)"
            git show "$PR_1130_SHA:$path" > "$tmp"
            dest="$path"
            if [ -f "$dest" ] && ! cmp -s "$tmp" "$dest"; then
              rel="${path#.github/}"
              dest=".github/release-control/donor-overrides/pr-1130/$rel"
            fi
            mkdir -p "$(dirname "$dest")"
            mv "$tmp" "$dest"
          done < <(git ls-tree -r --name-only "$PR_1130_SHA" -- .github/agents .github/release-control)

          mkdir -p .github/release-control/dormant-workflows
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            name="$(basename "$path")"
            git show "$PR_1130_SHA:$path" > ".github/release-control/dormant-workflows/pr-1130-${name}.disabled"
          done < <(git ls-tree -r --name-only "$PR_1130_SHA" -- .github/workflows)

          cat > .github/release-control/dormant-workflows/README.md <<'EOF'
# Dormant donor workflows

These workflow definitions were extracted from still-open PR #1130 into consolidation PR #1175 without activating them as GitHub Actions workflows. They retain their exact donor logic for review and later controlled promotion. Files end in `.disabled`, so they cannot dispatch workers, integrate branches, merge, deploy, or run migrations from this application consolidation branch.
EOF

      - name: Preserve PR 1128 screenshot capture code safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts .github/release-control/dormant-workflows
          tmp="$(mktemp)"
          git show "$PR_1128_SHA:scripts/capture-production-pages.mjs" > "$tmp"
          if [ -f scripts/capture-production-pages.mjs ] && ! cmp -s "$tmp" scripts/capture-production-pages.mjs; then
            mv "$tmp" scripts/capture-production-pages.pr-1128.mjs
          else
            mv "$tmp" scripts/capture-production-pages.mjs
          fi
          git show "$PR_1128_SHA:.github/workflows/temporary-app-screenshot-capture.yml" \
            > .github/release-control/dormant-workflows/pr-1128-temporary-app-screenshot-capture.yml.disabled

      - name: Write exact donor incorporation ledger
        shell: bash
        run: |
          set -euo pipefail
          start_sha="$(cat /tmp/consolidation-start-sha)"
          mkdir -p docs/release
          cat > docs/release/open-pr-incorporation-20260717.md <<EOF
# Open PR donor incorporation ledger

Target: PR #1175, branch \`$TARGET_BRANCH\`
Starting consolidation SHA: \`$start_sha\`

No open donor PR was closed, merged, approved, or marked ready during extraction.

## PR #1188 — Tender Health confirmed Build Plan truth

- Exact donor SHA: \`$PR_1188_SHA\`
- Disposition: application commit applied with history-independent cherry-pick into the validated candidate.
- Preserved behavior: Submission Plan cannot score PASS unless the shared confirmed Build Plan authority returns \`ok\`.

## PR #1157 and comparison PR #1180 — canonical package/readiness authority

- Exact shared donor SHA: \`$PR_1157_SHA\`
- Disposition: current consolidation runtime was verified to contain the public readiness envelope, final-package model, confirmed Build Plan blocker, and route consumers. The exact donor patch and handoff evidence are preserved under \`docs/release/donor-snapshots/pr-1157/\`.
- PR #1180 is a duplicate comparison route for the same SHA and was not applied twice.

## PR #1130 — GitHub Control Tower

- Exact donor SHA: \`$PR_1130_SHA\`
- Disposition: agent contracts, provider registry, release-control schemas, scripts, and gate tests were extracted to their original inert paths when non-conflicting. Any conflicting donor version is preserved under \`.github/release-control/donor-overrides/pr-1130/\`.
- Executable workflow definitions were preserved under \`.github/release-control/dormant-workflows/\` with a \`.disabled\` suffix. They were not activated.

## PR #1128 — screenshot capture

- Exact donor SHA: \`$PR_1128_SHA\`
- Disposition: the Playwright capture script was incorporated. The temporary production-targeting workflow was preserved dormant and was not activated.

## Validation

The isolated candidate must pass dependency installation, Prisma client generation, TypeScript checking, lint, PR #1188 regression coverage, and PR #1157 source/runtime contract tests before it is offered for a non-forced fast-forward into PR #1175.
EOF

      - name: Install dependencies and generate Prisma client
        run: |
          npm ci
          npx prisma generate

      - name: Validate incorporated application and readiness contracts
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck
          npm run lint
          npx tsx --test \
            tests/release-snapshot-panel-truth.test.ts \
            tests/open-pr-1157-final-package-readiness-model.test.ts \
            tests/open-pr-1157-route-driven-workflow-truth-verification.test.ts

      - name: Remove temporary donor test copies and self-removing workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f tests/open-pr-1157-final-package-readiness-model.test.ts
          rm -f tests/open-pr-1157-route-driven-workflow-truth-verification.test.ts
          rm -f .github/workflows/incorporate-open-pr-donors.yml

      - name: Commit atomic validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No donor changes remained after verification."
            exit 1
          fi
          git commit -m "release: incorporate important code from every open PR donor"
          git push --force-with-lease origin "HEAD:refs/heads/$OUTPUT_BRANCH"

      - name: Publish candidate summary
        run: |
          echo "Validated candidate: $(git rev-parse HEAD)"
          echo "Output branch: $OUTPUT_BRANCH"
          echo "PR #1175 was not moved by this workflow."
