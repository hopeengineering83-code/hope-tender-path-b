name: PR 1175 final-gap repair

on:
  push:
    branches:
      - agent/pr1175-final-gap-repair
  pull_request:
    branches:
      - release/consolidated-recovery-20260717

permissions:
  contents: write

concurrency:
  group: pr1175-final-gap-repair
  cancel-in-progress: false

jobs:
  repair-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_repair
          POSTGRES_DB: hope_repair
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_repair -d hope_repair"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: postgresql://hope_repair@127.0.0.1:5432/hope_repair?schema=public
      SESSION_SECRET: repair-session-secret-2026-at-least-thirty-two-characters
      NEXTAUTH_SECRET: repair-nextauth-secret-2026-at-least-thirty-two-characters
      GEMINI_API_KEY: repair-provider-placeholder
      RUN_DB_INTEGRATION: "true"
      CSRF_MODE: "off"
    steps:
      - name: Checkout isolated repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/pr1175-final-gap-repair
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize repair script and matching fixtures
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts
          set -o pipefail
          python3 scripts/repair-pr1175-preflight.py 2>&1 | tee artifacts/pr1175-preflight.log

      - name: Upload preflight diagnostics
        if: steps.preflight.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr1175-preflight-diagnostics-${{ github.sha }}
          path: |
            artifacts/pr1175-preflight.log
            scripts/repair-pr1175-preflight.py
            tests/matching-relevance-gates.test.ts
            tests/matching-strict-domain.test.ts
          if-no-files-found: error
          retention-days: 7

      - name: Stop on preflight failure
        if: steps.preflight.outcome == 'failure'
        run: exit 1

      - name: Apply assertion-checked repair
        id: repair
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/repair-pr1175-final-gaps.py 2>&1 | tee artifacts/pr1175-repair.log

      - name: Upload repair diagnostics
        if: steps.repair.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr1175-repair-diagnostics-${{ github.sha }}
          path: |
            artifacts/pr1175-repair.log
            scripts/repair-pr1175-final-gaps.py
            scripts/repair-pr1175-preflight.py
          if-no-files-found: error
          retention-days: 7

      - name: Stop on repair assertion failure
        if: steps.repair.outcome == 'failure'
        run: exit 1

      - name: Validate database and schema
        run: |
          npx prisma validate
          npx prisma generate
          npx prisma migrate deploy
          npm run db:check-critical-schema

      - name: Run focused regressions
        id: focused
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npx tsx --test \
            tests/pr1175-final-gap-repair.test.ts \
            tests/matching-fail-closed-negative-tests.test.ts \
            tests/matching-relevance-gates.test.ts \
            tests/matching-strict-domain.test.ts \
            tests/vault-review-provenance.test.ts \
            tests/vault-review-contract.test.ts \
            tests/vault-review-route-postgres.test.ts \
            2>&1 | tee artifacts/pr1175-focused-tests.log

      - name: Upload focused regression diagnostics
        if: steps.focused.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr1175-focused-test-diagnostics-${{ github.sha }}
          path: |
            artifacts/pr1175-focused-tests.log
            tests/pr1175-final-gap-repair.test.ts
            tests/matching-fail-closed-negative-tests.test.ts
            tests/matching-relevance-gates.test.ts
            tests/matching-strict-domain.test.ts
            tests/vault-review-route-postgres.test.ts
            app/api/company/experts/[id]/route.ts
            app/api/company/projects/[id]/route.ts
            app/api/tenders/[id]/ai-rematch/route.ts
            lib/engine/matching-eligibility.ts
            lib/engine/matching.ts
          if-no-files-found: error
          retention-days: 7

      - name: Stop on focused regression failure
        if: steps.focused.outcome == 'failure'
        run: exit 1

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Full test suite
        id: full
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee artifacts/pr1175-full-tests.log

      - name: Upload full-suite diagnostics
        if: steps.full.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr1175-full-test-diagnostics-${{ github.sha }}
          path: |
            artifacts/pr1175-full-tests.log
            tests/
            app/api/company/experts/[id]/route.ts
            app/api/company/projects/[id]/route.ts
            app/api/tenders/[id]/ai-rematch/route.ts
            lib/engine/matching-eligibility.ts
            lib/engine/matching.ts
            lib/engine/run-tender-engine.ts
          if-no-files-found: error
          retention-days: 7

      - name: Stop on full-suite failure
        if: steps.full.outcome == 'failure'
        run: exit 1

      - name: Production build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee artifacts/pr1175-build.log

      - name: Upload build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pr1175-build-diagnostics-${{ github.sha }}
          path: |
            artifacts/pr1175-build.log
            app/
            lib/
            prisma/schema.prisma
          if-no-files-found: error
          retention-days: 7

      - name: Stop on build failure
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Verify patch hygiene
        run: |
          git diff --check
          test -f tests/pr1175-final-gap-repair.test.ts
          grep -Fq 'AI_REMATCH_PERSISTENCE_FAILED' 'app/api/tenders/[id]/ai-rematch/route.ts'
          grep -Fq 'canUseVaultRecord' lib/engine/matching-eligibility.ts
          grep -Fq 'baselineScenarioRoutes' scripts/capture-production-pages.mjs

      - name: Commit validated product repair
        shell: bash
        run: |
          rm scripts/repair-pr1175-final-gaps.py scripts/repair-pr1175-preflight.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close PR 1175 provenance rematch and evidence gaps"
          git push origin HEAD:agent/pr1175-final-gap-repair
