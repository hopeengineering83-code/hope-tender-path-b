name: Align CV active filter source pin

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/cv-regeneration-transactional-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Align active filter formatting
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/tenders/[id]/regenerate-cvs/route.ts')
          s = p.read_text()
          old = '''                where: {
                            tenderId,
                            exactFileName: fileName,
                            generationStatus: { not: "SUPERSEDED" },
                          },'''
          new = '''                where: { tenderId, exactFileName: fileName, generationStatus: { not: "SUPERSEDED" } },'''
          if old not in s:
              raise SystemExit('active filter block not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/tenders/[id]/regenerate-cvs/route.ts
          git commit -m "test: align CV active-row source pin"
          git push origin HEAD:${{ github.head_ref }}
