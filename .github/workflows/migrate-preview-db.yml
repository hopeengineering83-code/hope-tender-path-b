name: Manually migrate a Preview database

# Manually triggered ONLY — never wired to push/pull_request, so it cannot
# fire without an explicit human (or API) dispatch naming it directly.
#
# Why this exists: scripts/vercel-build.mjs deliberately never runs database
# migrations on a Vercel Preview build ("Preview builds are compile-and-test
# only; they never mutate the shared Production database"), to protect a
# possibly-shared database from an accidental Preview build. That is correct
# for the automatic build path, but it also means there is no automated way
# to initialize a *new*, deliberately-provisioned Preview database's schema.
# This workflow is that path: a separate, explicit, operator-confirmed action
# that runs the exact same non-destructive script the production build
# already trusts (`npm run prisma:migrate:safe` -> `prisma migrate deploy`,
# never `db push`/reset), against whichever database the operator has put in
# the PREVIEW_DATABASE_URL_MIGRATION secret. This session's own sandbox has
# no route to raw-TCP Postgres at all (its egress proxy only carries HTTPS),
# so a GitHub-hosted runner — which has ordinary outbound network access —
# is what actually runs the migration; nothing about the migration itself
# changes.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm: this runs prisma migrate deploy against the database in the PREVIEW_DATABASE_URL_MIGRATION secret.'
        required: true
      expected_fingerprint:
        description: 'The exact databaseFingerprint (from /api/health, e.g. d74f2ac75c88) the target database MUST already produce. The job refuses to run migrate if it does not match — this is the only thing that stops the secret from silently pointing at the wrong database.'
        required: true

permissions:
  contents: read

concurrency:
  group: migrate-preview-db
  cancel-in-progress: false

jobs:
  migrate:
    if: github.event.inputs.confirm == 'migrate'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Verify target database identity (fail closed)
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_MIGRATION }}
          EXPECTED_FINGERPRINT: ${{ github.event.inputs.expected_fingerprint }}
        run: |
          node -e '
            const { createHash } = require("crypto");
            const url = process.env.DATABASE_URL || "";
            let identity;
            try {
              const u = new URL(url);
              const db = u.pathname.replace(/^\/+/, "");
              identity = `${u.host}/${db}`;
            } catch {
              console.error("DATABASE_URL is not a parseable URL. Refusing to proceed.");
              process.exit(1);
            }
            const fp = createHash("sha256").update(identity).digest("hex").slice(0, 12);
            console.log("Target database fingerprint:", fp);
            const expected = process.env.EXPECTED_FINGERPRINT;
            if (!expected) {
              console.error("No expected fingerprint supplied. Refusing to proceed blind.");
              process.exit(1);
            }
            if (fp !== expected) {
              console.error(`REFUSING TO MIGRATE: fingerprint ${fp} does not match expected ${expected}. This secret does not point at the intended database.`);
              process.exit(1);
            }
            console.log("Fingerprint matches the expected target. Proceeding with migration.");
          '
          # This is the exact algorithm lib/database-fingerprint.ts uses at
          # runtime (host + "/" + database name only, sha256, first 12 hex
          # chars) — never the credential, never the query string. It is
          # reimplemented inline rather than imported so the whole safety
          # check is visible in this one file for anyone reviewing it.

      - name: Run the repository's non-destructive migration
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_MIGRATION }}
        run: npm run prisma:migrate:safe

      - name: Report Preview health (no secrets involved — GET only)
        if: always()
        run: |
          curl -sS -o /tmp/health.json -w 'HTTP %{http_code}\n' \
            "https://hope-tender-path-b-git-0db72a-hopeengineering83-codes-projects.vercel.app/api/health" || true
          cat /tmp/health.json || true
