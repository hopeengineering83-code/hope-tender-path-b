name: Consolidation Schema Repair

on:
  workflow_dispatch:
  push:
    branches:
      - release/consolidated-recovery-20260717
    paths:
      - scripts/reconcile-prisma-schema.py
      - .github/workflows/consolidation-schema-repair.yml

permissions:
  contents: write

concurrency:
  group: consolidation-schema-repair
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.repository == 'hopeengineering83-code/hope-tender-path-b' && github.ref == 'refs/heads/release/consolidated-recovery-20260717'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: schema_repair
          POSTGRES_DB: schema_repair
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U schema_repair -d schema_repair"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://schema_repair@127.0.0.1:5432/schema_repair?schema=public
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidated-recovery-20260717
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply exact schema reconciliation
        run: python3 scripts/reconcile-prisma-schema.py

      - name: Install dependencies
        run: npm ci

      - name: Validate and generate Prisma client
        run: |
          npx prisma validate
          npx prisma generate

      - name: Deploy full migration history to disposable PostgreSQL
        run: npx prisma migrate deploy

      - name: Require zero schema drift
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code 2>&1 | tee test-results/schema-repair-zero-drift.log

      - name: Commit validated schema and migration only
        shell: bash
        run: |
          set -euo pipefail
          git add prisma/schema.prisma prisma/migrations/20260717165000_reconcile_schema_history_indexes/migration.sql
          if git diff --cached --quiet; then
            echo "No schema changes to commit"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(db): reconcile Prisma schema with migration history"
          git push origin HEAD:release/consolidated-recovery-20260717

      - name: Upload reconciliation diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: consolidation-schema-repair-diagnostics
          path: |
            prisma/schema.prisma
            prisma/migrations/20260717165000_reconcile_schema_history_indexes/
            test-results/
          if-no-files-found: error
          retention-days: 7
