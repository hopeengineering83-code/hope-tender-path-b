name: Repair Coordinator

on:
  issues:
    types: [opened, labeled, edited, closed]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_run:
    workflows: [CI, Control Tower CI, Release Gate Suite]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: repair-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Select highest-severity finding and assign provider
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const severityRank = { 'risk:critical': 0, 'risk:high': 1, 'risk:medium': 2, 'risk:low': 3 };
            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: 'auto-generated', per_page: 100 });
            const active = issues.filter(i => !i.pull_request && i.labels.some(l => ['status:running','status:pr-opened','status:queued-for-dispatch'].includes(l.name)));
            if (active.length >= 6) { core.notice('Worker capacity reached.'); return; }
            const candidates = issues
              .filter(i => !i.pull_request)
              .filter(i => !i.labels.some(l => ['status:running','status:pr-opened','status:queued-for-dispatch','status:accepted','status:blocked'].includes(l.name)))
              .sort((a,b) => {
                const ar = Math.min(...a.labels.map(l => severityRank[l.name] ?? 99));
                const br = Math.min(...b.labels.map(l => severityRank[l.name] ?? 99));
                return ar - br || a.number - b.number;
              });
            if (!candidates.length) return;
            const issue = candidates[0];
            const attempt = Number((issue.body?.match(/"attempt"\s*:\s*(\d+)/) || [,'0'])[1]);
            if (attempt >= 3) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['status:blocked'] });
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: 'State: BLOCKED\nReason: Maximum three repair attempts reached.' });
              return;
            }
            const labels = issue.labels.map(l => l.name);
            let provider = 'glm';
            if (labels.includes('area:tests') || labels.includes('area:repository-scan')) provider = 'jules';
            if (labels.includes('needs:complex-transaction') || labels.includes('needs:race-condition')) provider = 'codex';
            if (labels.includes('needs:integration-conflict') || labels.includes('needs:cross-file-architecture')) provider = 'claude-code';
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [`agent:${provider}`,'status:queued-for-dispatch'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: [
                '<!-- repair-coordinator -->',
                'State: QUEUED',
                `Assigned tool: ${provider}`,
                `Attempt: ${attempt + 1}/3`,
                'Target: integration/controlled-recovery',
                'Use this issue and linked PR comments as the only task authority.',
                'Do not create a replacement PR, merge, approve, or deploy.'
              ].join('\n')
            });

      - name: Reconcile worker PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: prs } = await github.rest.pulls.list({ owner, repo, state: 'open', base: 'integration/controlled-recovery', per_page: 100 });
            for (const pr of prs) {
              if (!/FINDING-[a-z0-9-]+/i.test(pr.body || '')) continue;
              const { data: suites } = await github.rest.checks.listSuitesForRef({ owner, repo, ref: pr.head.sha });
              const complete = suites.check_suites.length > 0 && suites.check_suites.every(s => s.status === 'completed');
              const green = complete && suites.check_suites.every(s => s.conclusion === 'success');
              if (!complete) continue;
              if (!green) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['revision-required'] });
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `REVISION_REQUIRED\nReviewed SHA: ${pr.head.sha}\nExact-head checks failed. Update this same PR.` });
                continue;
              }
              const marker = `APPROVED_HEAD_SHA: ${pr.head.sha}`;
              if (!(pr.body || '').includes(marker)) {
                await github.rest.pulls.update({ owner, repo, pull_number: pr.number, body: `${pr.body || ''}\n\n${marker}` });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['ready-for-integrator'] });
            }
