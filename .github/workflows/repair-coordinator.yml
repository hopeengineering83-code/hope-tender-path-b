name: Repair Coordinator

on:
  issues:
    types: [opened, labeled, edited, closed]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_run:
    workflows: [CI, Control Tower CI, Release Gate Suite, Worker Exact-Head Validation]
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: read
  checks: read

concurrency:
  group: repair-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Select highest-severity finding and assign provider
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const severityRank = { 'risk:critical': 0, 'risk:high': 1, 'risk:medium': 2, 'risk:low': 3 };
            const issues = await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'auto-generated', per_page: 100 });
            const active = issues.filter(i => !i.pull_request && i.labels.some(l => ['status:running','status:pr-opened','status:queued-for-dispatch'].includes(l.name)));
            if (active.length >= 8) { core.notice('Worker capacity reached.'); return; }
            const candidates = issues
              .filter(i => !i.pull_request)
              .filter(i => !i.labels.some(l => ['status:running','status:pr-opened','status:queued-for-dispatch','status:accepted','status:blocked'].includes(l.name)))
              .sort((a,b) => {
                const ar = Math.min(...a.labels.map(l => severityRank[l.name] ?? 99));
                const br = Math.min(...b.labels.map(l => severityRank[l.name] ?? 99));
                return ar - br || a.number - b.number;
              });
            if (!candidates.length) return;
            const issue = candidates[0];
            // Durable attempt accounting via an `attempt:N` label — the parsed value
            // is read back from a persisted label (not from comment text, which was
            // never re-read), so the three-attempt ceiling cannot be bypassed.
            const attemptLabel = issue.labels.map(l => l.name).find(n => /^attempt:\d+$/.test(n));
            const attempt = attemptLabel ? Number(attemptLabel.split(':')[1]) : 0;
            if (attempt >= 3) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: ['status:blocked'] });
              await github.rest.issues.createComment({ owner, repo, issue_number: issue.number, body: 'State: BLOCKED\nReason: Maximum three repair attempts reached.' });
              return;
            }
            const nextAttempt = attempt + 1;
            const labels = issue.labels.map(l => l.name);
            let provider = labels.includes('agent:chatgpt-code') ? 'chatgpt-code' : 'glm';
            if (labels.includes('area:tests') || labels.includes('area:repository-scan')) provider = 'jules';
            if (labels.includes('needs:complex-transaction') || labels.includes('needs:race-condition')) provider = 'codex';
            if (labels.includes('needs:integration-conflict') || labels.includes('needs:cross-file-architecture')) provider = 'claude-code';
            // Advance the durable attempt counter before dispatching.
            if (attemptLabel) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number: issue.number, name: attemptLabel }).catch(() => {});
            }
            await github.rest.issues.addLabels({ owner, repo, issue_number: issue.number, labels: [`agent:${provider}`, 'status:queued-for-dispatch', `attempt:${nextAttempt}`] });
            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number,
              body: [
                '<!-- repair-coordinator -->',
                'State: QUEUED',
                `Assigned tool: ${provider}`,
                `Attempt: ${nextAttempt}/3`,
                'Target: integration/controlled-recovery',
                'Use this issue and linked PR comments as the only task authority.',
                'Do not create a replacement PR, merge, approve, deploy, or run production migrations.'
              ].join('\n')
            });

      - name: Reconcile worker PRs without approving them
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prs = await github.paginate(github.rest.pulls.list, { owner, repo, state: 'open', base: 'integration/controlled-recovery', per_page: 100 });
            const { data: currentRun } = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId }).catch(() => ({ data: {} }));
            const currentSuiteId = currentRun.check_suite_id;
            for (const pr of prs) {
              if (!/FINDING-[a-z0-9-]+/i.test(pr.body || '')) continue;
              const head = pr.head.sha;
              // Exclude the coordinator's OWN in-progress suite when testing whether
              // every suite has completed. All enumerations are fully paginated.
              const suites = (await github.paginate(github.rest.checks.listSuitesForRef, { owner, repo, ref: head, per_page: 100 }))
                .filter(s => s.id !== currentSuiteId);
              const complete = suites.length > 0 && suites.every(s => s.status === 'completed');
              if (!complete) continue;
              const green = suites.every(s => s.conclusion === 'success');
              // The named exact-head worker validation check must be present and green.
              const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: head, per_page: 100 });
              const workerCheck = runs.find(r => r.name === 'worker-exact-head-validation');
              const validated = green && workerCheck && workerCheck.status === 'completed' && workerCheck.conclusion === 'success';
              if (!validated) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['revision-required'] });
                await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body: `REVISION_REQUIRED\nReviewed SHA: ${head}\nExact-head checks failed or the required worker-exact-head-validation check is missing/not green. Update this same PR.` });
                continue;
              }

              const marker = `<!-- exact-head-validated:${pr.number}:${head} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number, per_page: 100 });
              if (!comments.some(comment => comment.body?.includes(marker))) {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body: [
                    marker,
                    `VALIDATED_HEAD_SHA: ${head}`,
                    'Exact-head CI completed successfully, including worker-exact-head-validation.',
                    'This is validation ONLY — not approval, acceptance, or integration authority.',
                    'Green CI does not create any approval or integrator-ready marker.',
                    'Integration requires an independent CONTROL_TOWER_AUDIT (Decision: ACCEPT,',
                    `Reviewed-Head-SHA: ${head}, Reviewer-Role: independent) from an allow-listed`,
                    'independent identity that is not the PR author, plus the integration-approved label.'
                  ].join('\n')
                });
              }
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ['awaiting-independent-audit'] });
            }
