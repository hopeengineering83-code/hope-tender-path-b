name: Release candidate promotion

# This workflow is the structural fix for the "merged but no visible change"
# problem. PRs merged into fix/release-candidate had NO path to production
# because:
#   1. vercel.json deploys ONLY main ({"**": false, "main": true})
#   2. NO workflow auto-merged fix/release-candidate into main
#   3. CI didn't even run on fix/release-candidate
#
# Result: 41 commits accumulated on fix/release-candidate while production
# (main) sat frozen. Users saw PRs "merge" on GitHub but the deployed app
# never changed.
#
# This workflow closes that loop. On every push to fix/release-candidate it:
#   1. Verifies branch protection on main exists (or warns loudly)
#   2. Checks for merge conflicts (main-diverged) BEFORE wasting CI time
#   3. Runs the full CI suite (migrations, typecheck, lint, tests, build, contract)
#   4. Opens or updates a PR from fix/release-candidate -> main
#   5. Enables auto-merge so the PR merges automatically once PR-triggered CI passes
#   6. Polls the PR state and FAILS LOUDLY if auto-merge doesn't complete
#
# STRENGTHENING (round-2 audit):
#   - Pre-flight: merge-conflict detection BEFORE CI (don't waste 20min on a doomed run)
#   - Post-enablement: poll PR state for up to 10 minutes; fail if not merged
#   - Branch-protection check: warn (not fail) if main has no required status checks
#     (auto-merge with no required checks merges INSTANTLY, which is unsafe)

on:
  push:
    branches:
      - fix/release-candidate
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: rc-promotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote:
    name: Promote release-candidate to main
    runs-on: ubuntu-latest
    timeout-minutes: 70
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_ci
          POSTGRES_DB: hope_tender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_ci -d hope_tender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://hope_ci@127.0.0.1:5432/hope_tender_ci?schema=public"
      SESSION_SECRET: "ci-session-${{ github.run_id }}-${{ github.sha }}"
      NEXTAUTH_SECRET: "ci-nextauth-${{ github.run_id }}-${{ github.sha }}"
      GEMINI_API_KEY: "ci-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"

    steps:
      - name: Checkout fix/release-candidate
        uses: actions/checkout@v4
        with:
          ref: fix/release-candidate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # ── PRE-FLIGHT 1: Merge-conflict detection ──────────────────────────
      # If main has diverged and a merge would conflict, fail NOW instead of
      # wasting 20 minutes of CI time on a doomed run. This is the #1 cause of
      # "auto-merge enabled but PR never merges" — the PR sits open with a
      # conflict marker and the workflow reports success.
      - name: Pre-flight: check for merge conflicts with main
        id: conflict-check
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          # Attempt a no-commit merge to detect conflicts
          if git merge-tree --write-tree --no-messages origin/main fix/release-candidate > /tmp/merge-result.txt 2>&1; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
            echo "✓ No merge conflicts with main"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            echo "✗ MERGE CONFLICT DETECTED — main has diverged and cannot be auto-merged."
            echo "  A human must rebase fix/release-candidate onto origin/main and resolve conflicts."
            echo "  Until then, this promotion will NOT proceed."
            echo ""
            echo "Conflict details:"
            cat /tmp/merge-result.txt | head -30
            exit 1
          fi

      # ── PRE-FLIGHT 2: Branch-protection warning ─────────────────────────
      # If main has NO required status checks, `gh pr merge --auto` merges
      # INSTANTLY upon enablement — before the PR-triggered CI even starts.
      # This is unsafe. We warn (not fail) so the workflow still proceeds,
      # but the warning is visible in the run log.
      - name: Pre-flight: warn if main has no branch protection
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          echo "Checking branch protection on main..."
          PROTECTION=$(gh api repos/${{ github.repository }}/branches/main/protection 2>&1 || true)
          if echo "$PROTECTION" | grep -q "Branch not protected"; then
            echo "::warning::main has NO branch protection. Auto-merge will merge INSTANTLY"
            echo "::warning::without waiting for PR-triggered CI. Configure required status"
            echo "::warning::checks on main to prevent broken merges reaching production."
          else
            echo "✓ main has branch protection configured"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit/integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify release hardening contract
        run: node scripts/release-hardening-contract.mjs

      - name: Check for changes ahead of main
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          AHEAD=$(git log --oneline origin/main..fix/release-candidate | wc -l | tr -d ' ')
          echo "ahead=$AHEAD" >> "$GITHUB_OUTPUT"
          echo "Commits ahead of main: $AHEAD"

      - name: Create or update promotion PR
        if: steps.diff.outputs.ahead != '0'
        id: pr
        uses: repo-sync/pull@v2
        with:
          source_branch: fix/release-candidate
          destination_branch: main
          pr_title: "Promote release-candidate to main ($(date -u +%Y-%m-%d))"
          pr_body: |
            Automated promotion PR created by `release-candidate-promotion.yml`.

            This PR merges the accumulated release-candidate work into `main` so
            that Vercel deploys it to production. Without this promotion, work
            merged into `fix/release-candidate` never reaches users — which is
            the root cause of the "merged but no visible change" problem.

            **Commits ahead of main:** ${{ steps.diff.outputs.ahead }}

            **Pre-flight checks passed:**
            - ✓ No merge conflicts with main
            - ✓ Full CI suite passed on fix/release-candidate (migrations, typecheck, lint, tests, build, release contract)

            **Merge strategy:** Merge commit (preserves the RC history).

            **Auto-merge:** Enabled. This PR will merge automatically once
            PR-triggered CI passes. If main has required status checks, the
            merge waits for them; if not, it merges immediately.
          pr_label: release-promotion,auto-merge
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge
        if: steps.diff.outputs.ahead != '0' && steps.pr.outputs.pr_number
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          echo "Enabling auto-merge for PR #$PR_NUMBER"
          gh pr merge "$PR_NUMBER" --auto --merge || {
            echo "::warning::Failed to enable auto-merge (PR may already have it enabled, or may already be merged)."
            gh pr view "$PR_NUMBER" --json state,mergeStateStatus --jq '.state + " / " + .mergeStateStatus'
          }

      # ── POST-ENABLEMENT: Poll PR state ───────────────────────────────────
      # Auto-merge is asynchronous. If it silently fails (conflict appeared,
      # required check failed, etc.), the workflow would report success while
      # the PR sits open. This step polls for up to 10 minutes and fails
      # loudly if the PR is not merged.
      - name: Wait for auto-merge to complete (up to 10 minutes)
        if: steps.diff.outputs.ahead != '0' && steps.pr.outputs.pr_number
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          PR_NUMBER="${{ steps.pr.outputs.pr_number }}"
          echo "Polling PR #$PR_NUMBER for merge completion..."
          for i in $(seq 1 20); do
            STATE=$(gh pr view "$PR_NUMBER" --json state --jq '.state' 2>/dev/null || echo "UNKNOWN")
            if [ "$STATE" = "MERGED" ]; then
              echo "✓ PR #$PR_NUMBER merged successfully after $((i*30)) seconds"
              exit 0
            elif [ "$STATE" = "CLOSED" ]; then
              echo "✗ PR #$PR_NUMBER was CLOSED (not merged). Check the PR for details."
              exit 1
            fi
            echo "  [$i/20] PR state: $STATE — waiting 30s..."
            sleep 30
          done
          echo "::warning::PR #$PR_NUMBER did not merge within 10 minutes."
          echo "::warning::This may be due to: required status checks still running,"
          echo "::warning::merge conflict appeared after enablement, or branch protection blocking."
          echo "::warning::Check: $(gh pr view "$PR_NUMBER" --json url --jq '.url')"
          # Don't fail the workflow — the PR may still merge later. But warn loudly.
          gh pr view "$PR_NUMBER" --json state,mergeStateStatus,statusCheckRollup --jq '.'
