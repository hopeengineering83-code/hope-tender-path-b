name: Apply audited gap fixes

on:
  push:
    branches: [codex/solve-audited-app-gaps]
    paths:
      - scripts/patch-ai-source-linkage.py
      - scripts/patch-ai-analyze-route.py
      - scripts/patch-ui-ci.py
      - .github/workflows/apply-audited-gap-fixes.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/solve-audited-app-gaps
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply source-level patches
        run: |
          python scripts/patch-ai-source-linkage.py
          python scripts/patch-ai-analyze-route.py
          python scripts/patch-ui-ci.py

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Commit validated fixes
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close source linkage, fallback, UI, and CI gaps"
          git push origin HEAD:codex/solve-audited-app-gaps
