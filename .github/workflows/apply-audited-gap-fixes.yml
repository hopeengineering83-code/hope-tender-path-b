name: Apply audited gap fixes

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || 'codex/solve-audited-app-gaps' }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch AI analysis contract
        run: python scripts/patch-ai-source-linkage.py

      - name: Patch AI Analyze persistence
        run: python scripts/patch-ai-analyze-route.py

      - name: Patch tender UI and CI
        run: python scripts/patch-ui-ci.py

      - name: Install dependencies
        run: npm ci --silent

      - name: Generate Prisma client
        run: npx prisma generate >/dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Full unit suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Commit validated fixes
        run: |
          if git diff --quiet; then
            echo "No patch changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: close source linkage, fallback, UI, and CI gaps"
          git push origin HEAD:${{ github.event.pull_request.head.ref || 'codex/solve-audited-app-gaps' }}
