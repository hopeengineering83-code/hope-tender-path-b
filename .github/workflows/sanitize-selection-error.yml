name: Sanitize scoped-selection public errors

on:
  push:
    paths:
      - .github/sanitize-selection-error-request

permissions:
  contents: write

jobs:
  sanitize-route:
    name: Replace raw selection error response
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout requesting branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Replace exact unsafe response token
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/api/tenders/[id]/matches/route.ts')
          source = path.read_text()
          unsafe = '      return NextResponse.json({ error: error.message, code: error.code }, {'
          replacement = '''      const publicMessage = error.code === "MATCH_NOT_FOUND"
                ? "The selected evidence row was not found."
                : error.code === "MATCH_REVISION_CONFLICT"
                  ? "The Engine selection changed after this page was loaded. Refresh and review the current selection before recording an exception."
                  : "This record is not currently source-verified and cannot be selected.";
              return NextResponse.json({ error: publicMessage, code: error.code }, {'''
          if source.count(unsafe) != 1:
              raise SystemExit(f'Expected exactly one unsafe response token, found {source.count(unsafe)}; refusing broad mutation.')
          path.write_text(source.replace(unsafe, replacement, 1))
          PY

      - name: Verify raw error pattern is absent
        run: |
          ! grep -n 'error: error.message' 'app/api/tenders/[id]/matches/route.ts'

      - name: Commit exact route repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/api/tenders/[id]/matches/route.ts'
          git commit -m "fix: sanitize scoped selection conflict responses"
          git push origin "HEAD:${GITHUB_REF_NAME}"
