name: Change Monitor

on:
  push:
    branches: [main, integration/controlled-recovery]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: change-monitor-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Collect changed files
        id: files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            FILES=$(gh pr diff "${{ github.event.pull_request.number }}" --name-only)
            SHA="${{ github.event.pull_request.head.sha }}"
            PR="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              FILES=$(git ls-tree -r --name-only HEAD)
            else
              FILES=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
            fi
            SHA="${{ github.sha }}"
            PR=""
          else
            FILES=""
            SHA="${{ github.sha }}"
            PR=""
          fi
          RUNTIME=$(printf '%s\n' "$FILES" | grep -E '^(app|lib|components|prisma|scripts)/|^(middleware\.ts|next\.config\.|package(-lock)?\.json|vercel\.json)' || true)
          {
            echo 'runtime<<EOF'
            echo "$RUNTIME"
            echo EOF
            echo "sha=$SHA"
            echo "pr=$PR"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update durable finding issue
        if: steps.files.outputs.runtime != ''
        uses: actions/github-script@v7
        env:
          RUNTIME_FILES: ${{ steps.files.outputs.runtime }}
          TARGET_SHA: ${{ steps.files.outputs.sha }}
          PR_NUMBER: ${{ steps.files.outputs.pr }}
        with:
          script: |
            const crypto = require('crypto');
            const files = process.env.RUNTIME_FILES.split('\n').filter(Boolean).sort();
            const sha = process.env.TARGET_SHA;
            const pr = process.env.PR_NUMBER ? Number(process.env.PR_NUMBER) : null;
            const scope = files.join('|');
            const key = crypto.createHash('sha256').update(`${sha}|${scope}`).digest('hex').slice(0, 16);
            const findingId = `FINDING-${key}`;
            const title = `[${findingId}] Runtime change requires autonomous audit`;
            const finding = {
              id: findingId,
              timestamp: new Date().toISOString(),
              severity: 'high',
              category: 'runtime-change',
              source: 'change-monitor',
              title: 'Runtime change requires autonomous audit',
              description: 'Inspect the actual diff, verify non-negotiable gates, add executable tests, and open a draft worker PR targeting integration/controlled-recovery. No merge or deployment.',
              files,
              agent: 'app',
              status: 'QUEUED',
              github_pr: pr,
              evidence: { sha, command: 'git diff --name-only' },
              attempt: 0,
              max_attempts: 3
            };
            const body = [
              `<!-- control-tower-finding:${findingId} -->`,
              '## Machine-readable finding',
              '```json',
              JSON.stringify(finding, null, 2),
              '```',
              '',
              '## Required outcome',
              '- Verify the gap still exists on the exact SHA.',
              '- Do not invent evidence or weaken extraction, analysis, generation, ownership, or ZIP gates.',
              '- Add executable tests, including database row assertions where persistence is affected.',
              '- Target only `integration/controlled-recovery`.',
              '- Do not merge, approve, or deploy.'
            ].join('\n');

            const query = `repo:${context.repo.owner}/${context.repo.repo} is:issue in:title "${findingId}"`;
            const { data } = await github.rest.search.issuesAndPullRequests({ q: query, per_page: 10 });
            const existing = data.items.find(item => item.title === title && !item.pull_request);
            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
              core.notice(`Updated durable finding issue #${existing.number}`);
              return;
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['auto-generated', 'agent:app', 'status:queued', 'risk:high']
            });
            core.notice(`Created durable finding issue #${created.data.number}`);
