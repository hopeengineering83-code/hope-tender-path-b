name: Refactor Engine route to canonical enqueue authority

on:
  push:
    paths:
      - .github/refactor-engine-enqueue-request

permissions:
  contents: write

jobs:
  refactor-route:
    name: Replace duplicate Engine enqueue implementation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout requesting branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Apply exact bounded route refactor
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/api/tenders/[id]/engine/route.ts')
          source = path.read_text()

          old_import = '''import {
            computeEngineSourceRevision,
            engineIdempotencyKey,
          } from "../../../../../lib/engine/engine-source-revision";'''
          new_import = 'import { enqueueEngineJobForCurrentSources } from "../../../../../lib/engine/enqueue-engine-job";'
          if source.count(old_import) != 1:
              raise SystemExit(f'Expected one source-revision import block, found {source.count(old_import)}.')
          source = source.replace(old_import, new_import, 1)

          start_token = '    const revision = await computeEngineSourceRevision(prisma, {'
          end_token = '    }, { isolationLevel: "Serializable" });\n'
          start = source.find(start_token)
          if start < 0:
              raise SystemExit('Engine enqueue block start not found.')
          end_start = source.find(end_token, start)
          if end_start < 0:
              raise SystemExit('Engine enqueue block end not found.')
          end = end_start + len(end_token)
          replacement = '''    const enqueue = await enqueueEngineJobForCurrentSources(prisma, {
              tenderId: id,
              userId,
              companyId: vaultPreflight.companyId,
              purpose: "INTERNAL_ARTIFACT_PREPARATION",
            });
            if (!enqueue) {
              return NextResponse.json({
                error: "Engine source revision could not be established.",
                code: "ENGINE_SOURCE_REVISION_UNAVAILABLE",
                nextAction: "RETRY_AFTER_DATABASE_CHECK",
                diagnosticId,
              }, { status: 503 });
            }
            const { revision, idempotencyKey, job: enqueueResult } = enqueue;
          '''
          source = source[:start] + replacement + source[end:]

          inventory = '''        tenderFiles: revision.tenderFileCount,
                  vaultDocuments: revision.vaultDocumentCount,'''
          inventory_replacement = '''        tenderFiles: revision.tenderFileCount,
                  requirements: revision.requirementCount,
                  vaultDocuments: revision.vaultDocumentCount,'''
          if source.count(inventory) != 1:
              raise SystemExit(f'Expected one source inventory block, found {source.count(inventory)}.')
          source = source.replace(inventory, inventory_replacement, 1)

          if 'computeEngineSourceRevision' in source or 'engineIdempotencyKey' in source or 'pg_advisory_xact_lock' in source:
              raise SystemExit('Duplicate enqueue implementation remains in the route.')
          path.write_text(source)
          PY

      - name: Commit exact route refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/api/tenders/[id]/engine/route.ts'
          git commit -m "refactor: use canonical Engine enqueue authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
