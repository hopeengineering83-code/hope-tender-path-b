name: PR 1209 run direct audit corrections

on:
  push:
    branches:
      - fix/pr1175-dead-broken-overlap-audit-replacement
  pull_request:
    branches:
      - release/consolidated-recovery-20260717
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1209-run-direct-corrections
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout replacement branch
        uses: actions/checkout@v4
        with:
          ref: fix/pr1175-dead-broken-overlap-audit-replacement
          fetch-depth: 0

      - name: Run correction script with captured diagnostics
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python .github/pr1209-apply.py > /tmp/pr1209-fix.log 2>&1
          status=$?
          set -e
          cat /tmp/pr1209-fix.log
          printf '%s\n' "$status" > /tmp/pr1209-fix-status

      - name: Upload correction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr1209-fix-diagnostics-${{ github.sha }}
          path: |
            /tmp/pr1209-fix.log
            /tmp/pr1209-fix-status
          if-no-files-found: error
          retention-days: 3

      - name: Require successful corrections and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/pr1209-fix-status)" = "0"
          rm -f .github/pr1209-apply.py
          rm -f .github/pr1208-direct-correction-trigger
          rm -f .github/pr1209-run-trigger
          rm -f .github/workflows/pr1209-run-direct-corrections.yml
          git diff --check
          git status --short

      - name: Commit clean replacement corrections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PR 1209 Audit Worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: finalize evidence-backed PR 1175 audit corrections"
          git push origin HEAD:fix/pr1175-dead-broken-overlap-audit-replacement
