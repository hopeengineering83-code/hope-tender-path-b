name: Apply CV transaction patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/cv-regeneration-transactional-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply exact patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/tenders/[id]/regenerate-cvs/route.ts')
          s = p.read_text()

          import_anchor = 'import { resolveTenderOperationGate } from "../../../../../lib/engine/tender-operation-gate";'
          import_block = '''import { resolveTenderOperationGate } from "../../../../../lib/engine/tender-operation-gate";
          import {
            GenerationPersistenceBlockedError,
            withTransactionalGenerationGate,
          } from "../../../../../lib/engine/transactional-generation-gate";'''
          if 'withTransactionalGenerationGate' not in s:
              if import_anchor not in s:
                  raise SystemExit('transaction import anchor not found')
              s = s.replace(import_anchor, import_block, 1)

          start_marker = '      // ACTIVE rows only: matching a SUPERSEDED historical row would mutate'
          end_marker = '      regenerated += 1;'
          start = s.find(start_marker)
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('CV persistence block markers not found')
          end += len(end_marker)
          replacement = '''      const persistCv = async () => {
                await prisma.$transaction(async (tx) => {
                  await withTransactionalGenerationGate({
                    prisma,
                    tx,
                    tenderId,
                    userId: actor.id,
                    purpose: "regenerate-cvs",
                    write: async (lockedTx) => {
                      const existing = await lockedTx.generatedDocument.findFirst({
                        where: { tenderId, exactFileName: fileName, generationStatus: { not: "SUPERSEDED" } },
                        orderBy: { updatedAt: "desc" },
                      });
                      const data = {
                        fileContent: cvContent,
                        ...cvIntegrity,
                        generationStatus: "GENERATED",
                        validationStatus: "PENDING",
                        reviewStatus: "PENDING",
                        reviewNotes: "Regenerated by /regenerate-cvs after transactional readiness recheck.",
                        reviewedBy: null,
                        reviewedAt: null,
                        updatedAt: new Date(),
                      };
                      if (existing) {
                        await lockedTx.generatedDocument.update({ where: { id: existing.id }, data });
                        return;
                      }
                      await lockedTx.generatedDocument.create({
                        data: {
                          tenderId,
                          name: `CV — ${expert.fullName}`,
                          documentType: "EXPERT_CV_PACKAGE",
                          format: "DOCX",
                          exactFileName: fileName,
                          contentSummary: `Professional CV for ${expert.fullName}${expert.title ? `, ${expert.title}` : ""}.`,
                          ...data,
                        },
                      });
                    },
                  });
                });
              };

              try {
                await persistCv();
              } catch (createErr) {
                if ((createErr as { code?: string })?.code === "P2002") {
                  const winner = await prisma.generatedDocument.findFirst({
                    where: { tenderId, exactFileName: fileName, generationStatus: { not: "SUPERSEDED" } },
                    orderBy: { updatedAt: "desc" },
                    select: { id: true },
                  });
                  if (!winner) {
                    errors.push({
                      expertId: expert.id,
                      fullName: expert.fullName,
                      error: "P2002 convergence failed: the concurrent winner was deleted before this row could be updated.",
                    });
                    continue;
                  }
                  // The first transaction rolled back completely. Retrying the
                  // whole locked write converges to updating the winner.
                  await persistCv();
                } else {
                  throw createErr;
                }
              }
              regenerated += 1;'''
          s = s[:start] + replacement + s[end:]

          old_catch = '''    } catch (err) {
              errors.push({ expertId: expert.id, fullName: expert.fullName, error: sanitizeError(err).slice(0, 200) });
            }'''
          new_catch = '''    } catch (err) {
              if (err instanceof GenerationPersistenceBlockedError) {
                errors.push({
                  expertId: expert.id,
                  fullName: expert.fullName,
                  error: `Generation readiness changed before persistence: ${err.code}`,
                });
                break;
              }
              errors.push({ expertId: expert.id, fullName: expert.fullName, error: sanitizeError(err).slice(0, 200) });
            }'''
          if old_catch not in s:
              raise SystemExit('outer CV catch anchor not found')
          s = s.replace(old_catch, new_catch, 1)

          response_start = s.rfind('  return NextResponse.json({')
          if response_start < 0:
              raise SystemExit('CV response start not found')
          response = s[response_start:]
          if '    success: true,' not in response:
              raise SystemExit('CV success field anchor not found')
          response = response.replace('    success: true,', '    success: errors.length === 0,', 1)
          closing = '  });\n}'
          closing_at = response.rfind(closing)
          if closing_at < 0:
              raise SystemExit('CV response closing marker not found')
          response = (
              response[:closing_at]
              + '  }, { status: errors.some((error) => error.error.startsWith("Generation readiness changed")) ? 409 : 200 });\n}'
              + response[closing_at + len(closing):]
          )
          s = s[:response_start] + response

          if 'await prisma.generatedDocument.create' in s or 'await prisma.generatedDocument.update' in s:
              raise SystemExit('root-client GeneratedDocument write remains')
          required = [
              'withTransactionalGenerationGate({',
              'write: async (lockedTx) => {',
              '(createErr as { code?: string })?.code === "P2002"',
              'P2002 convergence failed: the concurrent winner was deleted',
              'err instanceof GenerationPersistenceBlockedError',
          ]
          missing = [value for value in required if value not in s]
          if missing:
              raise SystemExit(f'CV patch incomplete: {missing}')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/tenders/[id]/regenerate-cvs/route.ts
          git commit -m "fix: gate CV regeneration persistence transactionally"
          git push origin HEAD:${{ github.head_ref }}
