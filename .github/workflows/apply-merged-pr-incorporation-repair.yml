name: Apply merged PR incorporation repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.event.pull_request.head.ref == 'codex/fix-merged-pr-incorporation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: codex/fix-merged-pr-incorporation
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply reviewed repair
        run: node scripts/apply-merged-pr-incorporation-repair.mjs

      - name: Remove one-time repair machinery
        run: |
          rm -f .repair-trigger
          rm -f scripts/apply-merged-pr-incorporation-repair.mjs
          rm -f .github/workflows/apply-merged-pr-incorporation-repair.yml

      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No repair changes to commit"
          else
            git commit -m "fix: incorporate merged PR security and policy updates"
            git push origin HEAD:codex/fix-merged-pr-incorporation
          fi
