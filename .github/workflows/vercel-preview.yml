name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: vercel-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Deploy Vercel preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: Preview
    env:
      VERCEL_ORG_ID: team_ASNg31lCZHT3SZmGtuylIDsA
      VERCEL_PROJECT_ID: prj_zVNVDLC2kA9I2mohQFyv7kOxZ0pb
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify preview credentials and project scope
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "VERCEL_TOKEN is missing from the GitHub Preview environment."
            exit 1
          fi
          test "$VERCEL_ORG_ID" = "team_ASNg31lCZHT3SZmGtuylIDsA"
          test "$VERCEL_PROJECT_ID" = "prj_zVNVDLC2kA9I2mohQFyv7kOxZ0pb"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview configuration
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          preview_url="$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "url=${preview_url}" >> "$GITHUB_OUTPUT"

      - name: Publish preview URL
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
        with:
          script: |
            const marker = '<!-- vercel-preview-every-pr -->';
            const body = `${marker}\n## Vercel Preview\n\n${process.env.PREVIEW_URL}\n\nCommit: \`${context.payload.pull_request.head.sha}\``;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) =>
              comment.user?.type === 'Bot' && comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
