name: Temporary Bishoftu DWG Export

on:
  push:
    branches:
      - temp/dwg-export-bishoftu-20260818
    paths:
      - 'tmp-dwg-export/input.part*'
      - 'tmp-dwg-export/convert.mjs'
      - '.github/workflows/temp-bishoftu-dwg-export.yml'

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout temporary branch
        uses: actions/checkout@v4
        with:
          ref: temp/dwg-export-bishoftu-20260818
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install CAD writer
        run: npm install --no-save --ignore-scripts @node-projects/acad-ts@2.4.2
      - name: Convert DXF to DWG and read back
        run: node tmp-dwg-export/convert.mjs
      - name: Commit validated DWG to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f tmp-dwg-export/output/Bishoftu_B_G_9_Terrace_FINAL_REV04.dwg tmp-dwg-export/output/DWG_QA.json
          git commit -m "Temporary validated Bishoftu DWG output [skip ci]"
          git push origin HEAD:temp/dwg-export-bishoftu-20260818
