name: Refresh patched sharp lockfile

on:
  push:
    paths:
      - .github/sharp-upgrade-request

permissions:
  contents: write

jobs:
  refresh-lockfile:
    name: Generate and verify patched sharp lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout requesting branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Setup repository Node version
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile using patched sharp override
        run: |
          npm pkg set overrides.sharp=0.35.3
          npm install --package-lock-only --ignore-scripts
          npm ci
          npm audit --omit=dev --audit-level=high

      - name: Commit npm-generated lockfile
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "deps: upgrade sharp to patched 0.35.3"
          git push origin "HEAD:${GITHUB_REF_NAME}"
