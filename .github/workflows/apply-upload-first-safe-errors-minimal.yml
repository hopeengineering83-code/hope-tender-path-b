name: Apply minimal upload-first safe errors

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/upload-first-safe-client-errors-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace exception-derived client strings
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/tender-upload-first.ts')
          s = p.read_text()

          s = s.replace('import { sanitizeError } from "./sanitize-error";\n', '', 1)

          storage_lines = '''        const message = storageError instanceof Error ? storageError.message : String(storageError);
                  errors.push(`${validation.safeFileName}: storage failed — ${message}`);'''
          storage_safe = '''        logger.error("[upload-first] source storage failed", {
                  requestId,
                  fileName: validation.safeFileName,
                  errorClass: storageError instanceof Error
                    ? storageError.constructor.name
                    : "UnknownError",
                });
                errors.push(`${validation.safeFileName}: secure storage is temporarily unavailable.`);'''
          if storage_lines not in s:
              raise SystemExit('storage exception lines not found')
          s = s.replace(storage_lines, storage_safe, 1)

          extraction_lines = '''        const message = extractionError instanceof Error ? extractionError.message : String(extractionError);
                  warnings.push(`${validation.safeFileName}: file stored, but text extraction failed — ${message}`);'''
          extraction_safe = '''        logger.warn("[upload-first] source extraction failed", {
                  requestId,
                  fileName: validation.safeFileName,
                  errorClass: extractionError instanceof Error
                    ? extractionError.constructor.name
                    : "UnknownError",
                });
                warnings.push(`${validation.safeFileName}: file stored, but text extraction failed. Run OCR or re-extraction.`);'''
          if extraction_lines not in s:
              raise SystemExit('extraction exception lines not found')
          s = s.replace(extraction_lines, extraction_safe, 1)

          final_message = '    const message = sanitizeError(error);\n'
          if final_message not in s:
              raise SystemExit('final sanitizer line not found')
          s = s.replace(final_message, '', 1)

          logger_old = '    logger.error(`[upload-first tender] failed (requestId=${requestId}):`, { detail: error });'
          logger_new = '''    logger.error(`[upload-first tender] failed (requestId=${requestId}):`, {
                detail: error,
                errorClass: error instanceof Error ? error.constructor.name : "UnknownError",
              });'''
          if logger_old not in s:
              raise SystemExit('final logger anchor not found')
          s = s.replace(logger_old, logger_new, 1)

          error_old = '      error: `Upload-first tender intake failed: ${message}`,'
          error_new = '      error: "Tender intake could not be completed. Retry the upload or contact support with the request ID.",'
          if error_old not in s:
              raise SystemExit('final public error anchor not found')
          s = s.replace(error_old, error_new, 1)
          s = s.replace('      detail: message,\n', '', 1)

          forbidden = [
              'storage failed — ${message}',
              'text extraction failed — ${message}',
              'sanitizeError(error)',
              'detail: message',
          ]
          remaining = [value for value in forbidden if value in s]
          if remaining:
              raise SystemExit(f'public exception details remain: {remaining}')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tender-upload-first.ts
          git commit -m "fix: keep upload-first failures server-side"
          git push origin HEAD:${{ github.head_ref }}
