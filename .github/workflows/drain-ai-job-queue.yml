# G10 — Free external cron for the AiJob queue
#
# Vercel Hobby plans allow only ONE cron invocation per day, which is too
# slow for an interactive queue. GitHub Actions schedules run every 5 min
# for free on the Hobby plan's quota (2000 min/month private repos,
# unlimited on public) — so we drain the queue from here instead of from
# Vercel's built-in cron.
#
# REQUIRED SETUP (one-time)
# ─────────────────────────
# 1. Generate a strong random secret:
#      openssl rand -hex 32
#    (or any 32+ char random string)
#
# 2. Add it as a Vercel env var:
#      Vercel dashboard → hope-tender-path-b → Settings → Environment Variables
#      Name:        AI_JOBS_WORKER_SECRET
#      Value:       <the secret from step 1>
#      Environment: Production (+ Preview if desired)
#      → Redeploy so the env var is live.
#
# 3. Add the SAME secret as a GitHub Actions repository secret:
#      GitHub → repo → Settings → Secrets and variables → Actions → New repository secret
#      Name:  AI_JOBS_WORKER_SECRET
#      Value: <same secret>
#
# 4. Commit & push this file (already done if you're reading this in the
#    repo). The schedule kicks in within ~5 min of being on `main`.
#
# WHAT IT DOES
# ────────────
# Every 5 minutes, POST to /api/ai-jobs/run-next with the shared secret.
# The worker claims ONE queued job, runs its handler, and exits within
# Vercel's 60s function budget. If the queue is empty the call is a no-op
# (returns { ran: 0, message: "queue empty" }).
#
# Note: GitHub Actions cron has known drift — actual runs can lag the
# scheduled time by 5-15 min during heavy GitHub load. That's fine here
# because the frontend ALSO kicks off the worker on every "Run in
# background" click (immediate, no wait). This cron is just for orphans.

name: Drain AiJob queue

on:
  schedule:
    # Every 5 minutes. GitHub Actions cron uses UTC and may drift.
    - cron: "*/5 * * * *"
  # Allow manual triggering from the Actions tab for ad-hoc draining or
  # for testing the secret wiring after the initial setup above.
  workflow_dispatch:

# Don't pile up if a previous run is still going (rare — each curl is <1s).
concurrency:
  group: drain-ai-job-queue
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # AI_ANALYZE is the one pipeline stage isDurableRetryJobType does NOT
      # cover (that list is EXTRACT_TEXT, VAULT_INGEST, ENGINE_RUN,
      # PROPOSAL_GENERATION, AUTO_FINALIZE). Its recovery lives in
      # lib/ai-analyze/retry-service.ts behind /api/cron/ai-analyze-retry —
      # which was registered with no scheduler at all: not in vercel.json's
      # crons, not here. A failed AI analysis was therefore never retried, so
      # one transient provider hiccup stranded the tender permanently while the
      # UI still reported "processing automatically".
      #
      # That route already accepts X-Worker-Secret precisely so "an external
      # scheduler can poll this more frequently than the platform's cron
      # minimum" — its own words. This is that scheduler. It runs first so any
      # job it re-arms is claimable by the drain below on the same tick.
      - name: GET /api/cron/ai-analyze-retry
        env:
          WORKER_SECRET: ${{ secrets.AI_JOBS_WORKER_SECRET }}
          RETRY_URL: https://hope-tender-path-b.vercel.app/api/cron/ai-analyze-retry
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "::error::AI_JOBS_WORKER_SECRET repo secret is empty."
            exit 1
          fi

          response=$(curl -sS \
            --connect-timeout 30 \
            --max-time 65 \
            -H "X-Worker-Secret: $WORKER_SECRET" \
            -w "\n---STATUS:%{http_code}---" \
            "$RETRY_URL" \
            || echo "---STATUS:000---")

          status=$(echo "$response" | grep -oE "STATUS:[0-9]+" | cut -d: -f2)
          body=$(echo "$response" | sed -E "s/---STATUS:[0-9]+---//")
          echo "HTTP $status"
          echo "Body: $body"

          # Auth errors mean the secret wiring is broken — worth surfacing.
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::Retry scheduler rejected auth. Check AI_JOBS_WORKER_SECRET matches between this repo and Vercel, then redeploy."
            exit 1
          fi

          # Everything else is non-fatal: the drain step below still needs to
          # run, and the next tick is only 5 minutes away.
          if [ "$status" != "200" ]; then
            echo "::warning::Retry scheduler returned $status — transient, continuing to the drain step."
          fi
          exit 0

      - name: POST /api/ai-jobs/run-next
        env:
          WORKER_SECRET: ${{ secrets.AI_JOBS_WORKER_SECRET }}
          WORKER_URL: https://hope-tender-path-b.vercel.app/api/ai-jobs/run-next
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "::error::AI_JOBS_WORKER_SECRET repo secret is empty. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

          # 30s connect timeout + 65s max time (slightly over Vercel's 60s
          # so we always read the worker's response, even on slow jobs).
          # We expect HTTP 200 with either { ran: 1, ... } or { ran: 0, "queue empty" }.
          # On 401/500/etc. we surface the body in the log but DON'T fail
          # the workflow — failing would just spam your inbox; the next
          # tick is only 5 min away.
          response=$(curl -sS \
            --connect-timeout 30 \
            --max-time 65 \
            -X POST \
            -H "X-Worker-Secret: $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            -w "\n---STATUS:%{http_code}---" \
            "$WORKER_URL" \
            || echo "---STATUS:000---")

          status=$(echo "$response" | grep -oE "STATUS:[0-9]+" | cut -d: -f2)
          body=$(echo "$response" | sed -E "s/---STATUS:[0-9]+---//")

          echo "HTTP $status"
          echo "Body: $body"

          # Auth errors — setup is broken, needs attention.
          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::error::Worker rejected auth. Check that AI_JOBS_WORKER_SECRET matches between this repo's Actions secrets and Vercel's env vars, then Redeploy on Vercel."
            exit 1
          fi

          # Transport errors — worker endpoint unreachable.
          if [ "$status" = "000" ] || [ "$status" = "500" ] || [ "$status" = "502" ] || [ "$status" = "503" ] || [ "$status" = "504" ]; then
            echo "::warning::Worker endpoint returned $status — transient, will retry on next tick."
            exit 0
          fi

          # HTTP 200 — the worker ran, but the AI job may have failed.
          if [ "$status" = "200" ]; then
            terminal_status=$(echo "$body" | grep -oE '"terminalStatus":"[^"]*"' | head -1 | sed 's/"terminalStatus":"//;s/"//')
            result_code=$(echo "$body" | grep -oE '"resultCode":"[^"]*"' | head -1 | sed 's/"resultCode":"//;s/"//')
            retryable=$(echo "$body" | grep -oE '"retryable":(true|false)' | head -1 | sed 's/"retryable"://')
            ran=$(echo "$body" | grep -oE '"ran":[0-9]+' | head -1 | sed 's/"ran"://')

            echo "Worker ran=$ran terminalStatus=$terminal_status resultCode=$result_code retryable=$retryable"

            if [ "$ran" = "0" ]; then
              echo "Queue empty — non-failure."
              exit 0
            fi

            if [ "$terminal_status" = "FAILED" ] && [ "$retryable" = "false" ]; then
              echo "::error::Terminal non-retryable job failure: resultCode=$result_code. Manual intervention required."
              exit 1
            fi

            if [ "$result_code" = "AI_ANALYSIS_PERSISTENCE_FAILED" ]; then
              echo "::error::AI_ANALYSIS_PERSISTENCE_FAILED detected — possible systemic persistence issue. Check finalizeJob() and database health."
              exit 1
            fi

            if [ "$terminal_status" = "FAILED" ] && [ "$retryable" = "true" ]; then
              echo "::warning::Retryable job failure: resultCode=$result_code. Will retry on next tick."
              exit 0
            fi

            echo "Job completed with terminalStatus=$terminal_status — non-failure."
            exit 0
          fi

          echo "::warning::Unexpected HTTP status $status from worker. Body: $body"
          exit 0

      # ─── Preview deployment drain ────────────────────────────────────────
      #
      # Every step above targets PRODUCTION only. The Preview deployment had no
      # worker driver at all, so a job enqueued there stayed QUEUED forever:
      # Vercel runtime logs for the preview environment showed ZERO
      # /api/ai-jobs/run-next invocations over six hours while the browser
      # polled /engine-readiness every three seconds. Pressing Run Engine
      # created the job and nothing ever claimed it, so the UI reported
      # "Engine running…" indefinitely with zero selected evidence.
      #
      # The branch preview URL is stable for this release branch, so the same
      # secret-authenticated drain works against it.
      #
      # Deliberately non-fatal in every outcome. Preview is not the release
      # surface, its secret may not be configured, and the deployment may be
      # absent or rebuilding — none of which should turn the Production drain
      # red or spam the owner. Failures are surfaced as warnings only.
      - name: POST /api/ai-jobs/run-next (preview)
        continue-on-error: true
        env:
          WORKER_SECRET: ${{ secrets.AI_JOBS_WORKER_SECRET }}
          PREVIEW_WORKER_URL: https://hope-tender-path-b-git-0db72a-hopeengineering83-codes-projects.vercel.app/api/ai-jobs/run-next
        run: |
          if [ -z "$WORKER_SECRET" ]; then
            echo "::warning::AI_JOBS_WORKER_SECRET is empty — skipping the preview drain."
            exit 0
          fi

          response=$(curl -sS \
            --connect-timeout 30 \
            --max-time 65 \
            -X POST \
            -H "X-Worker-Secret: $WORKER_SECRET" \
            -H "Content-Type: application/json" \
            -w "\n---STATUS:%{http_code}---" \
            "$PREVIEW_WORKER_URL" \
            || echo "---STATUS:000---")

          status=$(echo "$response" | grep -oE "STATUS:[0-9]+" | cut -d: -f2)
          body=$(echo "$response" | sed -E "s/---STATUS:[0-9]+---//")
          echo "Preview HTTP $status"
          echo "Preview body: $body"

          if [ "$status" = "401" ] || [ "$status" = "403" ]; then
            echo "::warning::Preview worker rejected auth. Set AI_JOBS_WORKER_SECRET for the Preview environment in Vercel and redeploy, or preview jobs will never run."
            exit 0
          fi

          if [ "$status" != "200" ]; then
            echo "::warning::Preview worker returned $status — preview queue not drained on this tick."
            exit 0
          fi

          echo "Preview queue drained."
          exit 0
