name: Apply upload-first safe client errors

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/upload-first-safe-client-errors-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Redact upload-first public failures
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/tender-upload-first.ts')
          s = p.read_text()

          s = s.replace('import { sanitizeError } from "./sanitize-error";\n', '', 1)

          storage_old = '''      } catch (storageError) {
                const message = storageError instanceof Error ? storageError.message : String(storageError);
                errors.push(`${validation.safeFileName}: storage failed — ${message}`);
                continue;
              }'''
          storage_new = '''      } catch (storageError) {
                logger.error("[upload-first] source storage failed", {
                  requestId,
                  fileName: validation.safeFileName,
                  errorClass: storageError instanceof Error
                    ? storageError.constructor.name
                    : "UnknownError",
                });
                errors.push(`${validation.safeFileName}: secure storage is temporarily unavailable.`);
                continue;
              }'''
          if storage_old not in s:
              raise SystemExit('storage failure anchor not found')
          s = s.replace(storage_old, storage_new, 1)

          extraction_old = '''      } catch (extractionError) {
                const message = extractionError instanceof Error ? extractionError.message : String(extractionError);
                warnings.push(`${validation.safeFileName}: file stored, but text extraction failed — ${message}`);
              }'''
          extraction_new = '''      } catch (extractionError) {
                logger.warn("[upload-first] source extraction failed", {
                  requestId,
                  fileName: validation.safeFileName,
                  errorClass: extractionError instanceof Error
                    ? extractionError.constructor.name
                    : "UnknownError",
                });
                warnings.push(`${validation.safeFileName}: file stored, but text extraction failed. Run OCR or re-extraction.`);
              }'''
          if extraction_old not in s:
              raise SystemExit('extraction failure anchor not found')
          s = s.replace(extraction_old, extraction_new, 1)

          final_old = '''  } catch (error) {
                if (storedUploads.length > 0) await cleanupStoredUploads(storedUploads);
                const message = sanitizeError(error);
                logger.error(`[upload-first tender] failed (requestId=${requestId}):`, { detail: error });
                void reportError(error, { route: "/api/tenders/upload-first", requestId });
                return NextResponse.json({
                  success: false,
                  error: `Upload-first tender intake failed: ${message}`,
                  code: "TENDER_INTAKE_FAILED",
                  detail: message,
                  requestId,
                }, { status: 500 });
              }'''
          final_new = '''  } catch (error) {
                if (storedUploads.length > 0) await cleanupStoredUploads(storedUploads);
                logger.error(`[upload-first tender] failed (requestId=${requestId}):`, {
                  detail: error,
                  errorClass: error instanceof Error ? error.constructor.name : "UnknownError",
                });
                void reportError(error, { route: "/api/tenders/upload-first", requestId });
                return NextResponse.json({
                  success: false,
                  error: "Tender intake could not be completed. Retry the upload or contact support with the request ID.",
                  code: "TENDER_INTAKE_FAILED",
                  requestId,
                }, { status: 500 });
              }'''
          if final_old not in s:
              raise SystemExit('final failure anchor not found')
          s = s.replace(final_old, final_new, 1)

          if 'storage failed — ${message}' in s or 'text extraction failed — ${message}' in s:
              raise SystemExit('raw per-file public message remains')
          if 'detail: message' in s or 'sanitizeError(error)' in s:
              raise SystemExit('raw final public detail remains')
          p.write_text(s)
          PY
      - name: Commit repair
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tender-upload-first.ts
          git commit -m "fix: keep upload-first failures server-side"
          git push origin HEAD:${{ github.head_ref }}
