name: PR 1208 dead broken overlap audit

on:
  push:
    branches:
      - fix/pr1175-dead-broken-overlap-audit
  pull_request:
    branches:
      - release/consolidated-recovery-20260717
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      START_SHA: 4c37510578e0d725fecf8bc6e4f388dd807408b6
      PARENT_BASE_SHA: b3c9db5de89a2a665e61a83facbff0f276f9983c
    steps:
      - name: Checkout isolated audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/pr1175-dead-broken-overlap-audit
          fetch-depth: 0

      - name: Apply pending scalar-preservation repair
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          source_path = Path('lib/engine/auto-fill-tender-metadata.ts')
          source = source_path.read_text()
          old_helper = '''function isEmptyOrPlaceholder(value: string | null | undefined): boolean {
            if (!value || value.trim() === "") return true;
            if (isPlaceholderClientName(value)) return true;
            return false;
          }'''.replace('          ', '')
          new_helper = '''function isEmptyOrPlaceholder(value: unknown): boolean {
            if (value === null || value === undefined) return true;
            if (typeof value !== "string") return false;
            if (value.trim() === "") return true;
            return isPlaceholderClientName(value);
          }'''.replace('          ', '')
          old_call = 'if (current != null && !isEmptyOrPlaceholder(current as unknown as string)) {'
          new_call = 'if (current != null && !isEmptyOrPlaceholder(current)) {'

          changed = False
          if old_helper in source:
              source = source.replace(old_helper, new_helper, 1)
              changed = True
          if old_call in source:
              source = source.replace(old_call, new_call, 1)
              changed = True
          source_path.write_text(source)

          test_path = Path('tests/auto-fill-tender-metadata.test.ts')
          test_source = test_path.read_text()
          marker = 'describe("autoFillTenderMetadata — preserves existing non-string values", () => {'
          if marker not in test_source:
              test_source += '''

describe("autoFillTenderMetadata — preserves existing non-string values", () => {
  it("does not throw or overwrite existing dates, numbers, or booleans", async () => {
    const prismaMock = makePrismaMock();
    const deadline = new Date("2026-07-31T12:00:00.000Z");
    const tender = {
      id: "t-existing-scalars",
      clientName: "World Bank",
      reference: "RFP-EXISTING",
      category: "Healthcare",
      country: "Ethiopia",
      deadline,
      submissionMethod: "Online Portal",
      submissionAddress: "https://example.test/submit",
      submissionEmails: "bid@example.test",
      clientContactName: "Existing Contact",
      clientContactTitle: "Procurement Lead",
      clientContactEmail: "contact@example.test",
      clientContactPhone: "+251900000000",
      validityDays: 90,
      pageLimit: 75,
      bidBondAmount: 25000,
      bidBondCurrency: "USD",
      numberOfCopiesRequired: 3,
      mandatorySiteVisit: false,
      evaluationMethodology: "Quality and cost based selection",
      files: [{ extractedText: RICH_TEXT, originalFileName: "rfp.pdf" }],
    };

    const result = await autoFillTenderMetadata(tender, prismaMock as never);
    const patch = prismaMock.getLastPatch();

    for (const field of [
      "deadline",
      "validityDays",
      "pageLimit",
      "bidBondAmount",
      "numberOfCopiesRequired",
      "mandatorySiteVisit",
    ]) {
      assert.ok(!result.filled.includes(field), `${field} must not be overwritten`);
      assert.ok(!patch || patch[field] === undefined, `${field} must not be present in the update patch`);
    }
  });
});
'''
              test_path.write_text(test_source)
              changed = True

          temporary = Path('.github/workflows/pr1208-fix-autofill-scalar.yml')
          if temporary.exists():
              temporary.unlink()
              changed = True
          Path('/tmp/pr1208-repair-changed').write_text('yes\n' if changed else 'no\n')
          PY
          if [ "$(cat /tmp/pr1208-repair-changed)" = "yes" ]; then
            git diff --check
            git config user.name "PR 1208 Audit Worker"
            git config user.email "actions@users.noreply.github.com"
            git add -A
            git commit -m "fix: preserve existing scalar metadata during auto-fill"
            git push origin HEAD:fix/pr1175-dead-broken-overlap-audit
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Initialize audit evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit-output
          {
            echo "start_sha=$START_SHA"
            echo "audit_head=$(git rev-parse HEAD)"
            echo "parent_base_sha=$PARENT_BASE_SHA"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
          } > audit-output/context.txt
          git diff --name-status "$PARENT_BASE_SHA" "$START_SHA" > audit-output/pr1175-changed-files.txt
          git log --oneline --decorate --no-merges "$PARENT_BASE_SHA..$START_SHA" > audit-output/pr1175-commits.txt
          git archive --format=tar.gz --output=audit-output/pr1175-source.tar.gz "$START_SHA"

      - name: Baseline compiler and lint verification
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee audit-output/typecheck.txt
          npm run lint 2>&1 | tee audit-output/lint.txt

      - name: Strict unused local and parameter scan
        shell: bash
        run: |
          set +e
          npx tsc --noEmit --noUnusedLocals --noUnusedParameters --pretty false > audit-output/tsc-unused.txt 2>&1
          echo "$?" > audit-output/tsc-unused-exit-code.txt
          exit 0

      - name: Export and file reachability scan
        shell: bash
        run: |
          set +e
          npx --yes knip@latest --reporter json > audit-output/knip.json 2> audit-output/knip.stderr.txt
          echo "$?" > audit-output/knip-exit-code.txt
          npx --yes depcheck@1.4.7 --json > audit-output/depcheck.json 2> audit-output/depcheck.stderr.txt
          echo "$?" > audit-output/depcheck-exit-code.txt
          exit 0

      - name: Import-cycle and duplication scan
        shell: bash
        run: |
          set +e
          npx --yes madge@latest --circular --warning --extensions ts,tsx --ts-config tsconfig.json app components lib > audit-output/madge-cycles.txt 2> audit-output/madge.stderr.txt
          echo "$?" > audit-output/madge-exit-code.txt
          npx --yes jscpd@latest app components lib --min-lines 12 --min-tokens 90 --reporters json --output audit-output/jscpd > audit-output/jscpd.stdout.txt 2> audit-output/jscpd.stderr.txt
          echo "$?" > audit-output/jscpd-exit-code.txt
          exit 0

      - name: Repository overlap and temporary-code scan
        shell: bash
        run: |
          set +e
          git grep -n -I -E 'TODO|FIXME|HACK|TEMPORARY|temporary|deprecated|legacy|dead code|unreachable' "$START_SHA" -- app components lib scripts tests .github > audit-output/temporary-markers.txt
          git ls-tree -r --name-only "$START_SHA" | sort > audit-output/repository-files.txt
          git ls-tree -r --name-only "$START_SHA" | awk -F/ '{print $NF}' | sort | uniq -d > audit-output/duplicate-basenames.txt
          find app components lib -type f \( -name '*.ts' -o -name '*.tsx' \) -print0 | xargs -0 sha256sum | sort -k1,1 > audit-output/source-hashes.txt
          awk '{count[$1]++; files[$1]=files[$1] "\n" $2} END {for (h in count) if (count[h] > 1) print h, count[h], files[h]}' audit-output/source-hashes.txt > audit-output/exact-duplicate-files.txt
          exit 0

      - name: Summarize machine findings
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const out = { generatedAt: new Date().toISOString() };
          function readJson(path) {
            try { return JSON.parse(fs.readFileSync(path, 'utf8')); }
            catch (error) { return { parseError: String(error) }; }
          }
          out.knip = readJson('audit-output/knip.json');
          out.depcheck = readJson('audit-output/depcheck.json');
          const unused = fs.readFileSync('audit-output/tsc-unused.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          out.tscUnusedCount = unused.length;
          out.tscUnused = unused.slice(0, 1000);
          const cycles = fs.readFileSync('audit-output/madge-cycles.txt', 'utf8').split(/\r?\n/).filter(Boolean);
          out.madgeOutput = cycles.slice(0, 1000);
          fs.writeFileSync('audit-output/summary.json', JSON.stringify(out, null, 2));
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr1208-code-audit-${{ github.sha }}
          path: audit-output
          if-no-files-found: error
          retention-days: 7
