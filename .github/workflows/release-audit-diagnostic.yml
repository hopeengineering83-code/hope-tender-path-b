name: Release audit diagnostic

on:
  push:
    branches:
      - fix/integration-dependency-security

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/integration-dependency-security
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture and publish audit output once
        shell: bash
        run: |
          if [ -f release-audit-diagnostic.json ]; then
            echo "Diagnostic already exists."
            exit 0
          fi
          node scripts/audit-release-integrity.mjs > release-audit-diagnostic.json || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-audit-diagnostic.json
          git commit -m 'chore(ci): publish release audit diagnostic'
          git push origin HEAD:fix/integration-dependency-security
