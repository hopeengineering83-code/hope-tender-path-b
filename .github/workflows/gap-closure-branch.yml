name: Gap Closure Branch Verification

on:
  push:
    branches:
      - codex/full-gap-closure
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_ci
          POSTGRES_PASSWORD: hope_ci
          POSTGRES_DB: hope_tender_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_ci -d hope_tender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: test
      DATABASE_URL: "postgresql://hope_ci:hope_ci@127.0.0.1:5432/hope_tender_ci?schema=public"
      SESSION_SECRET: "ci-only-session-secret-0123456789abcdef0123456789abcdef"
      NEXTAUTH_SECRET: "ci-only-nextauth-secret-0123456789abcdef0123456789abcdef"
      GEMINI_API_KEY: "AIzaFakeCiBuildKeyNotUsedAtRuntime12345678901"
      SMTP_HOST: "smtp.invalid"
      SMTP_USER: "ci"
      SMTP_PASS: "ci-not-a-real-secret"
      EMAIL_FROM: "ci@example.invalid"
      ALLOW_DB_FILE_STORAGE: "true"
      RUN_DB_INTEGRATION: "true"
      E2E_FULL_AUTH: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - name: Sync database schema
        run: npx prisma db push --accept-data-loss
      - run: npm run typecheck
      - run: npm run lint
      - name: Tests
        run: npm test
      - name: Production build
        env:
          NODE_ENV: production
          VERCEL_ENV: preview
        run: npm run build
