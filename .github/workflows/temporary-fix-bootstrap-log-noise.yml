name: Temporary bootstrap log-noise repair

on:
  push:
    branches:
      - release/consolidated-recovery-20260717

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout controlled branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidated-recovery-20260717
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply exact bootstrap warning repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("lib/prisma.ts")
          source = path.read_text()
          old = '''    if (process.env.NODE_ENV === "production") {
              logger.warn(
                "[bootstrap] Skipping bootstrap admin seed in production. Set BOOTSTRAP_ADMIN_ENABLED=true with a secure BOOTSTRAP_ADMIN_PASSWORD to enable.",
              );
            }'''
          new = '''    if (process.env.NODE_ENV === "production") {
              logger.debug(
                "[bootstrap] Bootstrap admin seed is disabled by policy.",
              );
            }'''

          if source.count(old) != 1:
              raise SystemExit(f"Expected exactly one bootstrap warning block, found {source.count(old)}")

          path.write_text(source.replace(old, new, 1))

          test = Path("tests/bootstrap-admin-log-noise.test.ts")
          test.write_text('''import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          import { test } from "node:test";

          const source = readFileSync("lib/prisma.ts", "utf8");

          test("disabled bootstrap admin seed is not emitted as a production warning", () => {
            assert.doesNotMatch(
              source,
              /logger\\.warn\\([\\s\\S]{0,240}Skipping bootstrap admin seed in production/,
            );
            assert.match(
              source,
              /logger\\.debug\\([\\s\\S]{0,160}Bootstrap admin seed is disabled by policy/,
            );
          });

          test("genuine bootstrap failures remain error-level events", () => {
            assert.match(source, /logger\\.error\\("\\[bootstrap\\] failed:"/);
          });
          ''')

      - name: Run focused regression tests
        run: npx tsx --test tests/bootstrap-admin-log-noise.test.ts tests/post-audit-auth-truth.test.ts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Remove temporary workflow and commit repair
        run: |
          rm .github/workflows/temporary-fix-bootstrap-log-noise.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/prisma.ts tests/bootstrap-admin-log-noise.test.ts .github/workflows/temporary-fix-bootstrap-log-noise.yml
          git commit -m "fix: suppress expected bootstrap seed warning noise"
          git push origin HEAD:release/consolidated-recovery-20260717
