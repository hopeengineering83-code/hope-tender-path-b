name: Lockfile refresh artifact

on:
  push:
    branches:
      - integration/production-engine-2026-06
  pull_request:
    branches:
      - release/production-engine-2026-06
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Unrelated to the lockfile-refresh job below — for a normal dispatch, enter anything other than "migrate" (e.g. "refresh"). Only set to "migrate" to run the one-off Preview-database migration job (see migrate-preview-db below) — that job runs prisma migrate deploy against secrets.PREVIEW_DATABASE_URL_MIGRATION and refuses to run without this exact value.'
        required: true
      expected_fingerprint:
        description: 'Only used by the migrate-preview-db job: the exact databaseFingerprint (from /api/health) the target database must already produce. The job refuses to run migrate if it does not match. For a normal (non-migration) dispatch, any value is fine — this job simply will not run.'
        required: true

permissions:
  contents: read

concurrency:
  group: lockfile-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency tree
        run: npm install --ignore-scripts --prefer-offline && npm ls --all

      - name: Upload synchronized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

  # ─── One-off: manually migrate a Preview database ──────────────────────────
  #
  # Unrelated to the `refresh` job above — piggybacked onto this file only
  # because GitHub requires a workflow_dispatch-triggered workflow to already
  # exist on the default branch before it can be dispatched via the API/UI,
  # and this repo's default branch (main) auto-deploys to Production on every
  # push (vercel.json), so adding a brand-new file there was not an option.
  # This file was already registered and already workflow_dispatch-enabled.
  #
  # Never runs unless BOTH conditions below hold: the event is an explicit
  # workflow_dispatch AND its `confirm` input is exactly "migrate". A normal
  # dispatch (or the push/pull_request triggers above) leaves this job
  # skipped — `refresh` is completely unaffected either way.
  #
  # Why this needs to exist at all: scripts/vercel-build.mjs deliberately
  # never runs database migrations on a Vercel Preview build ("Preview builds
  # are compile-and-test only; they never mutate the shared Production
  # database"), and this session's own sandbox has no route to raw-TCP
  # Postgres (its egress proxy only carries HTTPS). A GitHub-hosted runner has
  # ordinary outbound network access, so it runs the exact same non-destructive
  # script the production build already trusts.
  migrate-preview-db:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: migrate-preview-db-oneoff
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci --no-audit --no-fund

      - name: Verify target database identity (fail closed)
        env:
          DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_MIGRATION }}
          EXPECTED_FINGERPRINT: ${{ github.event.inputs.expected_fingerprint }}
        run: |
          node -e '
            const { createHash } = require("crypto");
            const url = process.env.DATABASE_URL || "";
            let identity;
            try {
              const u = new URL(url);
              const db = u.pathname.replace(/^\/+/, "");
              identity = `${u.host}/${db}`;
            } catch {
              console.error("DATABASE_URL is not a parseable URL. Refusing to proceed.");
              process.exit(1);
            }
            const fp = createHash("sha256").update(identity).digest("hex").slice(0, 12);
            console.log("Target database fingerprint:", fp);
            const expected = process.env.EXPECTED_FINGERPRINT;
            if (!expected) {
              console.error("No expected fingerprint supplied. Refusing to proceed blind.");
              process.exit(1);
            }
            if (fp !== expected) {
              console.error(`REFUSING TO MIGRATE: fingerprint ${fp} does not match expected ${expected}. This secret does not point at the intended database.`);
              process.exit(1);
            }
            console.log("Fingerprint matches the expected target. Proceeding with migration.");
          '
          # This is the exact algorithm lib/database-fingerprint.ts uses at
          # runtime (host + "/" + database name only, sha256, first 12 hex
          # chars) — never the credential, never the query string. It is
          # reimplemented inline rather than imported so the whole safety
          # check is visible in this one file for anyone reviewing it.

      - name: Install psql client
        run: sudo apt-get update -y && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Phase 1 — read-only structural + row-count forensics (no mutation)
        env:
          SNAPSHOT_DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_MIGRATION }}
        run: bash scripts/tmp-schema-structural-snapshot.sh

      # Phase 4/5 (verified baseline resolve + normal migrate deploy) is
      # deliberately not run in this dispatch — it needs the Phase 1 output
      # first, to compute exactly which migrations are already reflected.
      # Re-running `prisma migrate deploy` blind here would just reproduce
      # the known P3005 failure.

      - name: Report Preview health (no secrets involved — GET only)
        if: always()
        run: |
          curl -sS -o /tmp/health.json -w 'HTTP %{http_code}\n' \
            "https://hope-tender-path-b-git-0db72a-hopeengineering83-codes-projects.vercel.app/api/health" || true
          cat /tmp/health.json || true
