name: Lockfile refresh artifact

on:
  push:
    branches:
      - integration/production-engine-2026-06
  pull_request:
    branches:
      - release/production-engine-2026-06
  workflow_dispatch:
    inputs:
      confirm:
        description: >-
          TEMPORARY, owner-authorized. Type "accept" to run the one final
          hosted AI-Analyze -> Run-Engine -> ZIP acceptance against the
          Preview deployment. Type "inspect" to run the READ-ONLY vault and
          selection inspection instead (no generation, no writes). Type
          "provision" to migrate a freshly created Preview database and create
          the owner account on it. Type "export" to verify a package the OWNER
          has already generated: it runs the same export, ZIP download and
          artifact inspection as "accept" but SKIPS AI Analyze and Run Engine,
          so it neither supersedes the owner's package nor spends provider
          quota. Type "health" to read /api/health and print BOTH database
          fingerprints (the pooled one the Preview reports and the direct one
          the migration URL resolves to) without touching anything — run this
          first after any database swap. Type "ready" to check whether the
          owner's re-upload has finished: it reports vault documents, brand
          assets, projects, experts, tender files and extraction progress, and
          it always succeeds, so it can be polled without painting a failed
          check on the PR. Type "enrich" to bring already-stored Project rows
          up to the behaviour the ingestion paths now have — portfolio numbers
          derived from each record's own reference text, and a country column
          that actually holds a country. It DRY-RUNS by default and prints the
          full before/after census; it writes only when apply_enrichment is
          "yes". Any other value (including blank) runs only the ordinary
          lockfile-refresh job.
        required: false
        default: ""
      expected_fingerprint:
        description: >-
          TEMPORARY, required with confirm=provision. The fingerprint of the
          database being rebuilt, AS THE MIGRATION URL SEES IT. The rebuild
          re-checks it and refuses to run against anything else, so the target
          can never be implicit or inherited from a stale secret.

          NOT necessarily the number /api/health prints. The fingerprint is
          sha256(host/dbname), Vercel holds the pooled host and the migration
          secret holds the direct one, so the same database hashes two ways and
          the 2026-09-07 rebuild refused on exactly that mismatch. Run
          confirm=health first: it prints both and labels which one belongs
          here.
        required: false
        default: ""
      tender_id:
        description: >-
          TEMPORARY, paired with confirm=accept. The Preview tender ID
          (already uploaded, canonical files and vault already in place).
          Leave blank with confirm=inspect and the read-only inspection
          discovers the tender from /api/tenders — the ID is created by the
          owner's own upload, so it cannot be known before that upload, and a
          default carried over from a previous database would inspect a tender
          that no longer exists.
        required: false
        default: ""
      reverify_stale_provenance:
        description: >-
          Paired with confirm=enrich. Set to "yes" to also re-prove rows whose
          trustLevel says SOURCE_VERIFIED but whose stored provenance no longer
          covers their current field set. A write that filled columns without
          re-issuing provenance leaves rows in exactly that state, and once the
          columns are full there is no further field change for a normal run to
          attach new provenance to, so they would stay unprovable. It invents
          nothing: every value is re-proved against the record's own linked
          source document, anything the document does not support is recorded as
          unverified, and a row carrying a human review is never touched.
        required: false
        default: ""
      apply_enrichment:
        description: >-
          Paired with confirm=enrich. Leave blank (or anything but "yes") and
          the enrichment is a true dry run: it reads every Project row, prints
          exactly what it would change and writes nothing. Set it to "yes" to
          apply those changes to the Preview database. The dry run is printed
          either way, so an applied run still shows what it decided and which
          rows it refused to decide.
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: lockfile-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency tree
        run: npm install --ignore-scripts --prefer-offline && npm ls --all

      - name: Upload synchronized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1

  # ─── TEMPORARY — owner-authorized, single-use ──────────────────────────────
  #
  # Drives the real hosted acceptance walkthrough (AI Analyze -> Run Engine ->
  # automatic ENGINE_RUN -> PROPOSAL_GENERATION -> AUTO_FINALIZE -> ZIP)
  # against the Preview deployment, using the tender and canonical vault
  # already uploaded there. Every mutating route it calls
  # (manual-ai-analyze, engine, export) requires a real authenticated owner
  # session — this sandbox cannot authenticate as the owner and cannot POST to
  # the Preview host at all (its egress proxy rejects it by policy), so this
  # job runs the walkthrough from a GitHub-hosted runner instead, using:
  #   - PREVIEW_OWNER_EMAIL / PREVIEW_OWNER_PASSWORD — signed in through the
  #     real /api/auth/login endpoint exactly as e2e/global-setup.ts does
  #     (same Origin and Referer a same-origin browser form would send, so
  #     strict CSRF stays enabled). The password is never printed, and the
  #     returned hope_session value is registered with ::add-mask:: before it
  #     is used, so it cannot appear in any log line either.
  #   - AI_JOBS_WORKER_SECRET — the secret drain-ai-job-queue.yml already
  #     uses to drain this same Preview's AiJob queue via X-Worker-Secret.
  #
  # Runs ONLY on workflow_dispatch with confirm=accept. Uploads the final ZIP
  # and the readiness/export-readiness responses as a workflow artifact for
  # inspection; makes no other write beyond the normal application actions a
  # signed-in owner clicking through the UI would make. Remove this job, the
  # confirm=accept branch, and the tender_id input once acceptance is done.
  # Two modes share this job because the verification after generation is
  # identical and duplicating ~200 lines of it would let the two drift.
  # "accept" clicks the owner's two manual gates itself; "export" starts from a
  # package the owner already generated, so only the gate-clicking steps below
  # are conditional. Everything from the export snapshot onwards runs in both.
  temporary-preview-hosted-acceptance:
    if: >-
      github.event_name == 'workflow_dispatch'
      && (inputs.confirm == 'accept' || inputs.confirm == 'export')
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    env:
      OWNER_EMAIL: ${{ secrets.PREVIEW_OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
      WORKER_SECRET: ${{ secrets.AI_JOBS_WORKER_SECRET }}
      BASE_URL: https://hope-tender-path-b-git-0db72a-hopeengineering83-codes-projects.vercel.app
      TENDER_ID: ${{ inputs.tender_id }}
    steps:
      - name: Stamp the moment this run began
        run: echo "RUN_STARTED_AT=$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets and inputs are present
        run: |
          if [ -z "$OWNER_EMAIL" ]; then
            echo "::error::PREVIEW_OWNER_EMAIL secret is not set."
            exit 1
          fi
          if [ -z "$OWNER_PASSWORD" ]; then
            echo "::error::PREVIEW_OWNER_PASSWORD secret is not set."
            exit 1
          fi
          if [ -z "$WORKER_SECRET" ]; then
            echo "::error::AI_JOBS_WORKER_SECRET secret is not set."
            exit 1
          fi
          if [ -z "$TENDER_ID" ]; then
            echo "tender_id not supplied -- it will be discovered from /api/tenders after sign-in."
          fi

      - name: Sign in through the real /api/auth/login endpoint
        run: |
          # Same request shape e2e/global-setup.ts uses: JSON credentials with
          # the Origin and Referer a same-origin browser form would send, so
          # strict CSRF stays enabled. Credentials go in a --data-binary file
          # rather than argv so they never reach the process table.
          umask 077
          printf '{"email":%s,"password":%s}' \
            "$(printf '%s' "$OWNER_EMAIL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            "$(printf '%s' "$OWNER_PASSWORD" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            > /tmp/login-body.json
          status=$(curl -sS --connect-timeout 15 --max-time 45 \
            -o /tmp/login-body-response.json -D /tmp/login-headers.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Origin: $BASE_URL" \
            -H "Referer: $BASE_URL/login" \
            --data-binary @/tmp/login-body.json \
            "$BASE_URL/api/auth/login")
          rm -f /tmp/login-body.json
          echo "login status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Login against the Preview app failed (HTTP $status). Check PREVIEW_OWNER_EMAIL / PREVIEW_OWNER_PASSWORD."
            rm -f /tmp/login-headers.txt /tmp/login-body-response.json
            exit 1
          fi
          cookie=$(grep -i '^set-cookie:' /tmp/login-headers.txt \
            | grep -o 'hope_session=[^;]*' \
            | head -1 \
            | cut -d= -f2-)
          rm -f /tmp/login-headers.txt /tmp/login-body-response.json
          if [ -z "$cookie" ]; then
            echo "::error::Login succeeded but no hope_session cookie was returned."
            exit 1
          fi
          # Register the session value as a masked secret BEFORE it is used, so
          # it can never surface in a later log line.
          echo "::add-mask::$cookie"
          echo "SESSION_COOKIE=$cookie" >> "$GITHUB_ENV"
          echo "Signed in; session captured and masked."

      - name: Resolve the tender under test
        run: |
          # The acceptance job used to REQUIRE a tender_id input. Nobody can
          # know that value: tender ids are database rows, and this Preview's
          # database has been re-provisioned several times, so every swap
          # invalidates whatever id was last written down. The only way to
          # learn the current id was to run the inspection job and read its
          # log -- which meant a routine acceptance run failed before it
          # reached the app, on an input the owner had no way to supply.
          #
          # The inspection job already discovers the tender from /api/tenders.
          # This does the same, so an explicit tender_id becomes an override
          # for "run against THAT tender" rather than a precondition.
          if [ -n "$TENDER_ID" ]; then
            echo "tender supplied by input: $TENDER_ID"
          else
            curl -sS --connect-timeout 15 --max-time 45 \
              -H "Cookie: hope_session=$SESSION_COOKIE" \
              "$BASE_URL/api/tenders" > /tmp/tenders-discover.json || true
            tid=$(python3 - <<'PYEOF'
          import json, sys
          try:
              d = json.load(open('/tmp/tenders-discover.json', encoding='utf-8'))
          except Exception as exc:
              print("", end=""); print(f"discovery: unreadable response ({exc})", file=sys.stderr); raise SystemExit(0)
          rows = d if isinstance(d, list) else (d.get('items') or d.get('tenders') or [])
          if not rows:
              print(f"discovery: no rows; top-level keys = {sorted(d) if isinstance(d, dict) else type(d).__name__}", file=sys.stderr)
              print("", end=""); raise SystemExit(0)
          print((rows[0] or {}).get('id', ''), end="")
          PYEOF
          )
            if [ -z "$tid" ]; then
              echo "::error::No tender_id was supplied and none could be discovered from /api/tenders. Upload a tender, or pass tender_id explicitly."
              exit 1
            fi
            echo "tender discovered: $tid"
            echo "TENDER_ID=$tid" >> "$GITHUB_ENV"
          fi

      - name: Verify the session authenticates against the target tender
        run: |
          resp=$(curl -sS --connect-timeout 15 --max-time 30 -w "\n---STATUS:%{http_code}---" \
            -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/tenders/$TENDER_ID")
          status=$(echo "$resp" | grep -oE "STATUS:[0-9]+" | cut -d: -f2)
          echo "GET tender status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::The signed-in session could not read tender $TENDER_ID (HTTP $status). Confirm the tender belongs to PREVIEW_OWNER_EMAIL's account."
            exit 1
          fi
          echo "Session verified against tender $TENDER_ID."

      - name: Trigger AI Analyze (manual, owner-authorized)
        if: inputs.confirm == 'accept'
        run: |
          resp=$(curl -sS --connect-timeout 15 --max-time 60 -X POST -w "\n---STATUS:%{http_code}---" \
            -H "Cookie: hope_session=$SESSION_COOKIE" -H "Origin: $BASE_URL" \
            "$BASE_URL/api/tenders/$TENDER_ID/manual-ai-analyze")
          echo "$resp"
          status=$(echo "$resp" | grep -oE "STATUS:[0-9]+" | cut -d: -f2)
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "::error::manual-ai-analyze failed (HTTP $status)."
            exit 1
          fi
          # Record WHICH job this run is waiting on. The route may hand back an
          # EXISTING row rather than insert one -- run 34983687383 was answered
          # with a job created 42 minutes earlier -- so "the job this run owns"
          # cannot be recovered afterwards from a timestamp.
          echo "$resp" | grep -oE '"jobId":"[^"]+"' | head -1 | cut -d'"' -f4 \
            > /tmp/ai-analyze-job-id.txt || true
          echo "this run is waiting on AI_ANALYZE id=$(cat /tmp/ai-analyze-job-id.txt 2>/dev/null || echo '(not returned)')"

      - name: Wait for AI Analyze to reach a terminal state
        if: inputs.confirm == 'accept'
        run: bash scripts/tmp-await-tender-jobs.sh 40

      - name: Snapshot readiness after AI Analyze
        if: inputs.confirm == 'accept'
        run: |
          curl -sS --connect-timeout 15 --max-time 30 -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/tenders/$TENDER_ID/workflow-center" | tee /tmp/workflow-center-after-analyze.json

      - name: Require AI Analyze to be release-ready before Run Engine
        if: inputs.confirm == 'accept'
        run: |
          # The wait above settles on TERMINALITY, and FAILED is terminal. So on
          # run 34978972693 that step passed, readiness was snapshotted, a
          # baseline artifact hash was recorded -- and the run only died twenty
          # seconds later at Run Engine with HTTP 422 CURRENT_ANALYSIS_REQUIRED.
          # A failure inside AI Analyze was reported as an engine error, two
          # steps and three successful-looking green ticks away from where it
          # happened.
          #
          # The verdict is not re-derived here. tender-release-snapshot.ts
          # already decides release-readiness (state must be AI_SUCCEEDED, with
          # a promoted canonical job and a matching content hash) and publishes
          # it on the workflow-center payload just fetched. Reading the
          # product's own answer keeps this harness from enforcing a policy
          # stricter or looser than the engine it is supposed to be testing.
          #
          # The durable per-job cause is printed alongside it, because the
          # snapshot says an analysis is not usable while only the AiJob row
          # says why.
          curl -sS --connect-timeout 15 --max-time 45 -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/ai-jobs?tenderId=$TENDER_ID&take=25" > /tmp/jobs-after-analyze.json
          python3 - <<'PYEOF'
          import json, os

          started = os.environ['RUN_STARTED_AT']
          snapshot = json.load(open('/tmp/workflow-center-after-analyze.json', encoding='utf-8'))
          analysis = (snapshot.get('snapshot') or snapshot).get('analysis') or {}
          state = str(analysis.get('state') or '(absent)')
          blocker = analysis.get('blocker')
          print(f"analysis state after AI Analyze: {state}")

          jobs = (json.load(open('/tmp/jobs-after-analyze.json', encoding='utf-8')) or {}).get('jobs') or []
          analyses = [j for j in jobs if j.get('jobType') == 'AI_ANALYZE']

          # Select by the id the route returned. Filtering on createdAt >= this
          # run's start looked equivalent and is not: manual-ai-analyze can
          # answer with an EXISTING row, which keeps its original createdAt. On
          # run 34983687383 that filter matched nothing, so the gate stopped in
          # the right place and then declined to say why -- the exact failure
          # this whole step was added to prevent, reproduced one level down.
          try:
              wanted = open('/tmp/ai-analyze-job-id.txt', encoding='utf-8').read().strip()
          except Exception:
              wanted = ''
          mine = [j for j in analyses if wanted and j.get('id') == wanted]
          if not mine and analyses:
              # The list is newest-first; the newest analysis is the one the
              # snapshot's verdict describes.
              mine = [analyses[0]]
              print(f"  (no job id returned by the trigger; reporting the newest AI_ANALYZE row)")

          for j in mine:
              reused = str(j.get('createdAt') or '') < started
              note = "  [pre-existing row, re-run by this run]" if reused else ""
              print(f"  AI_ANALYZE {j.get('status')} id={j.get('id')} created={j.get('createdAt')}{note}")
              if j.get('status') in ('FAILED', 'CANCELED'):
                  print(f"    durable cause: {j.get('errorMessage') or '(job recorded no failure detail)'}")

          if not mine:
              print("  (no AI_ANALYZE row came back for this tender at all)")

          if blocker:
              raise SystemExit(
                  f"AI Analyze is not release-ready, so Run Engine cannot run and nothing below "
                  f"this point would describe work this run produced.\n  blocker: {blocker}"
              )
          print("AI Analyze is release-ready; Run Engine may proceed.")
          PYEOF

      - name: Record the artifact this run starts from
        if: inputs.confirm == 'accept'
        run: |
          # Run 33996268451 passed every gate below while regenerating nothing:
          # it delivered a ZIP whose contentSha256, byte size and defect counts
          # were identical to the run before it. Run Engine is idempotent
          # against an unchanged analysis revision, so re-triggering it enqueued
          # no job at all — the newest ENGINE_RUN/PROPOSAL_GENERATION/
          # AUTO_FINALIZE rows were two runs old and the document's updatedAt
          # had not moved. A green result like that says nothing about whether a
          # generation-path code change reached the client's document.
          #
          # So the hash of the artifact this run starts from is recorded here,
          # and compared after the chain settles.
          curl -sS --connect-timeout 15 --max-time 90 -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/admin/generated-proposals/audit?tenderId=$TENDER_ID&includeReady=true" > /tmp/audit-before.json
          python3 - <<'PYEOF'
          import json
          audit = json.load(open('/tmp/audit-before.json', encoding='utf-8'))
          rows = [r for r in audit.get('documents', []) if r.get('finalExportCandidate')]
          sha = (rows[0].get('contentSha256') or '') if rows else ''
          print(f"baseline artifact sha256: {sha[:16] or '(none)'}")
          open('/tmp/baseline-sha.txt', 'w').write(sha)
          PYEOF

      - name: Trigger Run Engine (manual, owner-authorized)
        if: inputs.confirm == 'accept'
        run: |
          resp=$(curl -sS --connect-timeout 15 --max-time 60 -X POST -w "\n---STATUS:%{http_code}---" \
            -H "Cookie: hope_session=$SESSION_COOKIE" -H "Origin: $BASE_URL" -H "Content-Type: application/json" \
            -d '{"action":"run"}' \
            "$BASE_URL/api/tenders/$TENDER_ID/engine")
          echo "$resp"
          status=$(echo "$resp" | grep -oE "STATUS:[0-9]+" | cut -d: -f2)
          # 202 is the normal success shape: the route enqueues a durable
          # ENGINE_RUN job and returns Accepted, exactly as manual-ai-analyze does.
          if [ "$status" != "200" ] && [ "$status" != "202" ]; then
            echo "::error::Run Engine failed (HTTP $status)."
            exit 1
          fi
          # reusedActiveJob and the returned jobId are the route's own account of
          # whether this enqueued work or handed back an earlier job.
          echo "$resp" | grep -oE '"(jobId|reusedActiveJob|sourceRevision)":[^,}]*' || true

      - name: Wait for ENGINE_RUN -> PROPOSAL_GENERATION -> AUTO_FINALIZE to settle
        if: inputs.confirm == 'accept'
        run: bash scripts/tmp-await-tender-jobs.sh 120

      - name: Fail if any job in this run's chain failed
        if: inputs.confirm == 'accept'
        run: |
          # The settle loop exits when nothing is QUEUED or RUNNING. A FAILED
          # job is terminal, so it satisfies that condition perfectly — and the
          # old, still-valid document then goes on satisfying every gate below.
          # That is how run 33996268451 reported a fully green walkthrough while
          # PROPOSAL_GENERATION had failed 1.3 seconds after ENGINE_RUN handed
          # off to it. The failure has to be read out explicitly.
          curl -sS --connect-timeout 15 --max-time 45 -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/ai-jobs?tenderId=$TENDER_ID&take=12" > /tmp/jobs-final.json
          python3 - <<'PYEOF'
          import json, os, datetime
          started = os.environ['RUN_STARTED_AT']
          payload = json.load(open('/tmp/jobs-final.json', encoding='utf-8'))
          jobs = payload.get('jobs') or payload.get('data') or (payload if isinstance(payload, list) else [])
          failed = []
          for job in jobs:
              created = str(job.get('createdAt') or '')
              status = str(job.get('status') or '')
              if created >= started and status in ('FAILED', 'CANCELED'):
                  failed.append(f"{job.get('jobType')} {status} id={job.get('id')} created={created} error={job.get('errorMessage')}")
          for line in failed:
              print(line)
          if failed:
              raise SystemExit(
                  f"{len(failed)} job(s) in this run's chain did not succeed. The pipeline did not "
                  "complete, and any readiness or export result below refers to a document an "
                  "earlier run produced."
              )
          print("every job created by this run reached a successful terminal state")
          PYEOF

      - name: Read what letterhead actually did on this run
        if: inputs.confirm == 'accept'
        run: |
          # Live proof for the storage-backed-letterhead fix (3e41c502), and it
          # has to sit HERE rather than with the PDF audit further down.
          #
          # Reproduced problem: run 34625093741 ran the whole chain green and
          # then stopped at "Require real final readiness with zero blockers".
          # Every branding check in this workflow lives after that gate, so a
          # single unrelated readiness blocker means the letterhead question
          # goes unanswered for another full hosted run. The generation job
          # already knows the answer the moment it finishes — read it there.
          #
          # PROPOSAL_GENERATION's output carries letterheadAppliedCount and
          # letterheadSkipReason, and /api/ai-jobs/{id} exposes both. Zero is
          # never reported bare: the reason names which of the exits was taken.
          python3 - <<'PYEOF'
          import json, os, subprocess
          started = os.environ['RUN_STARTED_AT']
          base, cookie = os.environ['BASE_URL'], os.environ['SESSION_COOKIE']
          jobs = json.load(open('/tmp/jobs-final.json', encoding='utf-8')).get('jobs') or []
          gen = [j for j in jobs
                 if j.get('jobType') == 'PROPOSAL_GENERATION' and str(j.get('createdAt') or '') >= started]
          if not gen:
              raise SystemExit('This run created no PROPOSAL_GENERATION job, so nothing generated documents to brand.')
          job = sorted(gen, key=lambda j: str(j.get('createdAt')))[-1]
          detail = json.loads(subprocess.run(
              ['curl', '-sS', '--connect-timeout', '15', '--max-time', '45',
               '-H', f'Cookie: hope_session={cookie}',
               f"{base}/api/ai-jobs/{job['id']}"],
              capture_output=True, text=True, check=True).stdout).get('job') or {}
          output = detail.get('output') or {}
          applied = output.get('letterheadAppliedCount')
          reason = output.get('letterheadSkipReason')
          for step in detail.get('steps') or []:
              if step.get('stepName') == 'proposal.complete':
                  print(f"proposal.complete: {step.get('message')}")
          print(f"letterheadAppliedCount={applied!r}")
          print(f"letterheadSkipReason={reason!r}")
          if not applied:
              raise SystemExit(
                  'Letterhead reached 0 generated documents on this run. '
                  f'The generation job gives the cause: {reason or "(no reason recorded)"}'
              )
          print(f'letterhead applied to {applied} generated document(s)')
          PYEOF

      - name: Setup Node for artifact inspection
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies for artifact inspection
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Audit the delivered PDF for branding, before the export gate
        run: |
          # "letterhead applied to 1 file(s)" says the DOCX was branded. It
          # does NOT say the client's PDF carries that branding: letterhead is
          # applied after generateTenderDocuments, the PDF is finalized
          # separately, and the surface that would catch a disagreement (the
          # ZIP audit) sits behind the export gate.
          #
          # GET /download?type=pdf serves the finalized PDF itself without
          # assembling a ZIP, so this reads the real delivered bytes even while
          # an unrelated readiness blocker holds the package back.
          status=$(curl -sS --connect-timeout 15 --max-time 120 \
            -o /tmp/delivered-technical-proposal.pdf -w "%{http_code}" \
            -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/tenders/$TENDER_ID/download?type=pdf")
          size=$(wc -c < /tmp/delivered-technical-proposal.pdf)
          echo "PDF HTTP:$status SIZE:$size"
          if [ "$status" != "200" ]; then
            # Observed on run 34627029199: HTTP 409
            # MANDATORY_NO_FULL_SUBSTANTIAL_COVERAGE. proposalPdf() runs the
            # same assertTenderReadyForGenerationAndExport gate as the ZIP, so
            # there is NO route to the delivered bytes that skips it. That is
            # the gate working; it is not a reason to add a bypass.
            #
            # This step is an observation, not an acceptance criterion, so it
            # must not be the thing that fails the job — the canonical
            # readiness step below says the same thing in the right place.
            # It records NOT MEASURED explicitly, because a missing branding
            # line must never be mistaken for a passing one.
            echo "::warning::BRANDING IN THE DELIVERED PDF: NOT MEASURED — the finalized PDF is gate-refused (HTTP $status)."
            {
              echo "BRANDING IN THE DELIVERED PDF: NOT MEASURED"
              echo "reason: GET /download?type=pdf returned HTTP $status"
              head -c 2000 /tmp/delivered-technical-proposal.pdf
              echo
            } | tee /tmp/pdf-branding-pre-gate.txt
            # The pricing and money reports below read these same bytes. With no
            # bytes there is nothing to report, and an absent report file must
            # never be mistaken for a clean one.
            echo "PRICING LEAKAGE FRAGMENTS: NOT MEASURED (the finalized PDF is gate-refused, HTTP $status)" \
              | tee /tmp/pricing-leakage-fragments.txt
            echo "DELIVERED FIGURES: NOT MEASURED (the finalized PDF is gate-refused, HTTP $status)" \
              | tee /tmp/pdf-money-report.txt
            rm -f /tmp/delivered-technical-proposal.pdf
            exit 0
          fi
          node scripts/tmp-inspect-pdf-typography-and-assets.mjs \
            /tmp/delivered-technical-proposal.pdf 2>&1 | tee /tmp/pdf-branding-pre-gate.txt

          # WHICH SENTENCE TRIPPED THE PRICING GATE?
          #
          # The audit reports PRICING_LEAKAGE [HIGH] with no excerpt, and two
          # AUTO_FINALIZE failures in a row had to be diagnosed by guessing.
          # Approximating the audit's view with a different extractor gives a
          # different answer — the raw page text reads clean and the reflowed
          # text does not — so this runs the application's OWN reader and
          # detector over the delivered bytes and names the offending fragments.
          #
          # It runs HERE, before the readiness gate, because PRICING_LEAKAGE is
          # itself a reason readiness fails: on run 34767072234 the gate refused
          # the package and every later step was skipped, including this report.
          # Informational — it never fails the run.
          npx tsx scripts/tmp-report-pricing-leakage-fragments.ts \
            /tmp/delivered-technical-proposal.pdf 2>&1 | tee /tmp/pricing-leakage-fragments.txt || true

          # Same reasoning for the money census: it measures the delivered PDF,
          # and the delivered PDF is in hand at this point whether or not the
          # package passes.
          node scripts/tmp-dump-pdf-text.mjs /tmp/delivered-technical-proposal.pdf > /tmp/pdf-text.txt 2>/dev/null || true
          npx tsx scripts/tmp-report-delivered-figures.ts /tmp/pdf-text.txt 2>&1 | tee /tmp/pdf-money-report.txt || true

      - name: Snapshot final workflow-center and export-readiness state
        run: |
          curl -sS --connect-timeout 15 --max-time 30 -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/tenders/$TENDER_ID/workflow-center" | tee /tmp/workflow-center-final.json
          echo
          curl -sS --connect-timeout 15 --max-time 90 -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/tenders/$TENDER_ID/export-readiness" | tee /tmp/export-readiness-final.json
          echo
          curl -sS --connect-timeout 15 --max-time 90 -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/admin/generated-proposals/audit?tenderId=$TENDER_ID&includeReady=true" | tee /tmp/generated-proposal-audit.json

      # accept-only: it compares against a baseline hash that only the
      # accept path records. In export mode this run deliberately regenerates
      # NOTHING — it verifies a package the owner already produced — so
      # demanding a changed hash would fail by design. The export-mode
      # equivalent is the step after it.
      - name: Prove this run actually regenerated the artifact
        if: inputs.confirm == 'accept'
        run: |
          # Guards the trap described in "Record the artifact this run starts
          # from". If the hash has not moved, the pipeline handed back the
          # document an earlier run produced, and nothing below can tell you
          # anything about a generation-path change in this commit.
          python3 - <<'PYEOF'
          import json, sys
          baseline = open('/tmp/baseline-sha.txt', encoding='utf-8').read().strip()
          audit = json.load(open('/tmp/generated-proposal-audit.json', encoding='utf-8'))
          rows = [r for r in audit.get('documents', []) if r.get('finalExportCandidate')]
          if not rows:
              raise SystemExit('Audit returned no final-export candidate rows')
          current = (rows[0].get('contentSha256') or '').strip()
          print(f"baseline sha256: {baseline[:16] or '(none)'}")
          print(f"current  sha256: {current[:16] or '(none)'}")
          if not current:
              raise SystemExit('The final artifact has no contentSha256 to compare')
          if baseline and baseline == current:
              raise SystemExit(
                  'This run regenerated nothing: the final artifact is byte-identical to the one '
                  'it started from. Run Engine is idempotent against an unchanged analysis revision, '
                  'so a green result here would prove nothing about generation-path changes in this '
                  'commit. Change the source revision (or the analysis) before re-running.'
              )
          print('regeneration confirmed: the delivered artifact is new')
          PYEOF

      - name: Require a real package to verify (export mode)
        if: inputs.confirm == 'export'
        run: |
          # Export mode must not silently "verify" an empty package. On
          # 2026-09-11T10:29Z this tender had currentOutputs 0 and every rule
          # read PENDING_PACKAGE — a state in which the export gate is
          # correctly closed and there is nothing to inspect. Fail loudly here
          # rather than produce an inspection report about nothing.
          python3 - <<'PYEOF'
          import json
          audit = json.load(open('/tmp/generated-proposal-audit.json', encoding='utf-8'))
          rows = [r for r in audit.get('documents', []) if r.get('finalExportCandidate')]
          summary = audit.get('summary') or {}
          print(f"currentOutputs={summary.get('currentOutputs')} "
                f"finalExportCandidates={summary.get('finalExportCandidates')} "
                f"readyForExport={summary.get('readyForExport')} "
                f"staleOutputs={summary.get('staleOutputs')}")
          if not rows:
              raise SystemExit(
                  'No final-export candidate documents exist. There is no package to verify — '
                  'the owner gates (Run Engine, then generation) have not produced current '
                  'outputs for this tender.'
              )
          for r in rows:
              print(f"  {r.get('exactFileName') or r.get('documentName')} "
                    f"sha256={(r.get('contentSha256') or '(none)')[:16]} "
                    f"updatedAt={r.get('updatedAt')} "
                    f"quality={r.get('qualityScore')}/{r.get('qualityRecommendedStatus')}")
              if not (r.get('contentSha256') or '').strip():
                  raise SystemExit(f"{r.get('exactFileName')} has no contentSha256 — its bytes are not verifiable")
          print(f"package present: {len(rows)} final-export candidate document(s)")
          PYEOF

      - name: Require real final readiness with zero blockers
        run: |
          # A COUNT IS NOT A REASON. This step used to fail with
          # "blockers=3" and nothing else, so every diagnosis of a refused
          # package cost an extra full run just to discover WHICH three --
          # the same defect the export blocker itself had, in the workflow
          # that reads it. The reasons are already in the response.
          python3 - <<'PYEOF'
          import json
          with open('/tmp/export-readiness-final.json', encoding='utf-8') as stream:
              result = json.load(stream)
          blockers = result.get('blockers') or []
          print(f"export-readiness: ok={result.get('ok')} status={result.get('status')} blockers={len(blockers)}")
          for blocker in blockers:
              if isinstance(blocker, dict):
                  print(f"  [{blocker.get('code') or blocker.get('area')}] "
                        f"{blocker.get('documentName') or blocker.get('title') or ''}"
                        .rstrip())
                  print(f"      {blocker.get('reason') or blocker.get('message') or '(no reason given)'}")
                  if blocker.get('nextAction'):
                      print(f"      next: {blocker['nextAction']}")
              else:
                  print(f"  {blocker}")
          # Anything else the response carries that names a rule, so a new
          # blocker shape cannot go silent here the way the count did.
          for key in ('documentFailures', 'tenderLevelBlockers', 'missingRequiredFiles', 'warnings'):
              values = result.get(key) or []
              if values:
                  print(f"  {key}: {json.dumps(values)[:900]}")
          if result.get('ok') is not True or blockers:
              raise SystemExit(
                  f"Hosted readiness did not pass: ok={result.get('ok')!r}, "
                  f"blockers={len(blockers)} (each named above)")
          PYEOF

      - name: Require the audit surface to agree with export-readiness
        run: |
          # Defect 6: these two surfaces previously disagreed about the same
          # bytes because the audit could not read a PDF at all. It reported
          # qualityScore 0 / DRAFT_ONLY while export-readiness reported READY.
          # They must now reach the same verdict on the same artifact.
          python3 - <<'PYEOF'
          import json
          audit = json.load(open('/tmp/generated-proposal-audit.json', encoding='utf-8'))
          rows = [r for r in audit.get('documents', []) if r.get('finalExportCandidate')]
          if not rows:
              raise SystemExit('Audit returned no final-export candidate rows')
          for r in rows:
              print(f"audit: {r.get('exactFileName')} score={r.get('qualityScore')} "
                    f"status={r.get('qualityRecommendedStatus')} readyForExport={r.get('readyForExport')} "
                    f"zipEligible={r.get('zipEligible')} visibleTextInspectable={r.get('visibleTextInspectable')} "
                    f"sha256={(r.get('contentSha256') or '')[:16]}")
              if not r.get('visibleTextInspectable'):
                  raise SystemExit(f"Audit could not read the artifact text of {r.get('exactFileName')!r} "
                                   "- the surface is judging bytes it never opened")
              if r.get('qualityRecommendedStatus') == 'DRAFT_ONLY':
                  raise SystemExit(f"Audit still reports DRAFT_ONLY for {r.get('exactFileName')!r}")
              if not r.get('readyForExport') or not r.get('zipEligible'):
                  raise SystemExit(f"Audit says not exportable while export-readiness said READY: {r.get('recommendedAction')}")
              for issue in r.get('qualityIssues', []):
                  print(f"   quality issue: {issue.get('severity')} {issue.get('code')}: {issue.get('message')}")
          PYEOF

      - name: Trigger export readiness build (POST /export)
        run: |
          resp=$(curl -sS --connect-timeout 15 --max-time 60 -X POST -w "\n---STATUS:%{http_code}---" \
            -H "Cookie: hope_session=$SESSION_COOKIE" -H "Origin: $BASE_URL" \
            "$BASE_URL/api/tenders/$TENDER_ID/export")
          echo "$resp" | tee /tmp/export-response.json
          status=$(echo "$resp" | grep -oE "STATUS:[0-9]+" | cut -d: -f2)
          if [ "$status" != "200" ]; then
            echo "::error::POST /export did not return 200 (HTTP $status)."
            exit 1
          fi

      - name: Download the final ZIP
        run: |
          curl -sS --connect-timeout 15 --max-time 120 -o /tmp/preview-final.zip \
            -w "%{http_code}" \
            -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/tenders/$TENDER_ID/download?type=zip" > /tmp/zip-status.txt
          status=$(cat /tmp/zip-status.txt)
          size=$(wc -c < /tmp/preview-final.zip)
          echo "ZIP HTTP:$status SIZE:$size"
          if [ "$status" != "200" ] || [ "$size" -le 0 ]; then
            echo "::error::Final ZIP download failed (HTTP $status, $size bytes)."
            exit 1
          fi
          unzip -t /tmp/preview-final.zip
          # Run 34161170459 lost a whole acceptance cycle here to
          # "curl: (35) SSL_ERROR_SYSCALL" — a dropped TLS handshake on this one
          # request, after the ZIP had already downloaded and verified. A
          # transport hiccup must not read as a product failure, so this is
          # retried; a genuinely unreachable endpoint still fails the step.
          for attempt in 1 2 3 4; do
            if curl -sS --connect-timeout 15 --max-time 90 --retry 2 --retry-connrefused \
              -H "Cookie: hope_session=$SESSION_COOKIE" \
              "$BASE_URL/api/admin/generated-proposals/audit?tenderId=$TENDER_ID&includeReady=true" \
              > /tmp/generated-proposal-audit-post-export.json; then
              break
            fi
            if [ "$attempt" = "4" ]; then
              echo "::error::Post-export audit fetch failed after 4 attempts."
              exit 1
            fi
            echo "Post-export audit fetch attempt $attempt failed; retrying."
            sleep $((attempt * 5))
          done
          python3 - <<'PYEOF'
          # Every delivered file must be a current generated document, and its
          # bytes must match the identity the database persisted for it.
          #
          # This used to assert `names != ['Technical Proposal.pdf']` — one
          # file, by that exact name. That was true of the tender the harness
          # was written against and is not a property of the product. The
          # owner's re-uploaded tender plans three deliverables:
          #
          #   Technical Proposal.pdf
          #   Renovation Planning and Implementation Oversight.docx
          #   Project Close-Out and Operational Readiness.docx
          #
          # All three downloaded and passed `unzip -t`, and export readiness
          # had already passed with zero blockers — so a correct package failed
          # acceptance on a hardcoded expectation about a different tender.
          #
          # The replacement is STRICTER, not looser. Before, exactly one file
          # was hash-checked and any second file would have been rejected
          # without ever being examined. Now every entry must resolve to
          # exactly one current GENERATED audit row and every entry's bytes are
          # hashed against it, so a package of three is verified three times
          # over. An empty ZIP is still a failure.
          import hashlib, json, zipfile

          audit = json.load(open('/tmp/generated-proposal-audit-post-export.json', encoding='utf-8'))
          documents = audit.get('documents', [])

          with zipfile.ZipFile('/tmp/preview-final.zip') as archive:
              names = archive.namelist()
              if not names:
                  raise SystemExit('The delivered ZIP is empty.')
              print(f'ZIP contains {len(names)} file(s):')
              for name in names:
                  payload = archive.read(name)
                  rows = [
                      row for row in documents
                      if row.get('generationStatus') == 'GENERATED'
                      and row.get('exactFileName') == name
                  ]
                  if len(rows) != 1:
                      raise SystemExit(
                          f'Expected exactly one current GENERATED audit row for {name!r}, got {len(rows)}. '
                          'A file in the delivered package that the database does not recognise as a current '
                          'generated document is an integrity failure, not a naming quibble.'
                      )
                  expected = rows[0].get('contentSha256')
                  actual = hashlib.sha256(payload).hexdigest()
                  if not expected or expected != actual:
                      raise SystemExit(
                          f'{name}: downloaded bytes do not match the persisted generated-document identity '
                          f'(expected {expected!r}, got {actual!r}).'
                      )
                  print(f'  OK  {name}  {len(payload)} bytes  sha256 {actual[:16]}')
          print(f'All {len(names)} delivered file(s) match their persisted identity.')
          PYEOF

      - name: Render every page of the final PDF and check the layout
        run: |
          # "Do not accept a PDF from text extraction alone." Every page is
          # rasterised with poppler and inspected for clipping, overflow,
          # footer collision and pagination.
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1 || true
          mkdir -p /tmp/pdf-pages /tmp/zip-extract
          python3 -m zipfile -e /tmp/preview-final.zip /tmp/zip-extract/
          ls -la /tmp/zip-extract/
          node scripts/tmp-render-pdf-pages.mjs "/tmp/zip-extract/Technical Proposal.pdf" /tmp/pdf-pages 2>&1 | tee /tmp/pdf-page-report.txt

      - name: Audit the delivered PDF for embedded brand-asset bytes
        run: |
          # ACTIVE metadata in the asset store is not proof the bytes reached
          # the client. This reads the PDF's own object graph, because text
          # extraction cannot see an image and has already produced three false
          # findings in this workstream.
          node scripts/tmp-inspect-pdf-typography-and-assets.mjs "/tmp/zip-extract/Technical Proposal.pdf" 2>&1 | tee /tmp/pdf-asset-audit.txt

          # DID THE PORTFOLIO NUMBERS REACH THE CLIENT?
          #
          # The vault carries a contract value on 113 of 114 projects, and the
          # reference proposal the owner benchmarks against cites 35 monetary
          # figures. A delivered proposal that cites none is the symptom the
          # whole portfolio enrichment exists for, and it is invisible to every
          # gate above, because an absent number breaks no rule.
          #
          # The first version of this check was an inline regex that treated any
          # three-letter token beside digits as a currency. On the real delivered
          # PDF it reported five "monetary figures": 2026, ISO 9001, ISO 21542,
          # TIN 0064637886 and a licence number. It now runs through the same
          # currency reference the application uses, so an ISO standard number
          # can never be counted as money.
          #
          # Informational: it never fails the run. How persuasive a document is
          # is not a pass/fail contract.
          # The money and pricing-leakage reports used to run here. They now run
          # in the pre-gate step, against the same finalized bytes: run
          # 34767072234 failed at readiness with PRICING_LEAKAGE, and every step
          # from here on was skipped — so the report that names the offending
          # sentence was unreachable in exactly the case it exists for. A
          # diagnostic behind the gate it explains is no diagnostic.
          node scripts/tmp-dump-pdf-text.mjs "/tmp/zip-extract/Technical Proposal.pdf" > /tmp/pdf-text.txt 2>/dev/null || true

          # The audit above says whether the bytes ARRIVED. This says what the
          # store holds, so a zero above can be attributed rather than guessed:
          # an asset the applier skips because it has no inline bytes looks
          # identical, in the delivered PDF, to one blocked by tender policy.
          curl -sS --connect-timeout 15 --max-time 60 --retry 2 \
            -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/company/assets" > /tmp/company-assets.json || true
          python3 - <<'PYEOF' | tee -a /tmp/pdf-asset-audit.txt
          import json
          try:
              data = json.load(open("/tmp/company-assets.json", encoding="utf-8"))
          except Exception as exc:
              print(f"ASSET STORE: unreadable ({exc})")
              raise SystemExit(0)
          rows = None
          if isinstance(data, dict):
              for key in ("assets", "items", "data", "results"):
                  if isinstance(data.get(key), list):
                      rows = data[key]
                      break
          elif isinstance(data, list):
              rows = data
          if rows is None:
              print(f"ASSET STORE: unexpected payload; keys={list(data)[:10] if isinstance(data, dict) else type(data)}")
              raise SystemExit(0)
          print(f"\nASSET STORE: {len(rows)} row(s)")
          for a in rows:
              # hasInlineFileContent / hasPrivateStorage are what the route
              # returns. It strips storagePath and never sends
              # fileContentLength, so asking for those printed "no" and "NOT
              # RETURNED BY API" for assets that may well have bytes — and the
              # letterhead question turns on exactly this.
              inline = a.get("hasInlineFileContent")
              print(
                  f"  type={a.get('assetType')} active={a.get('isActive')} "
                  f"mime={a.get('mimeType')} size={a.get('size')} "
                  f"inlineBytes={inline if inline is not None else 'NOT RETURNED BY API'} "
                  f"privateStorage={a.get('hasPrivateStorage')} "
                  f"integrity={a.get('integrityStatus')}"
              )
          PYEOF

      - name: Dump the final PDF's visible text for claim-by-claim review
        run: |
          # The 17-dimension assessment and the factual/compliance review have
          # to be made against what the client actually reads, so the extracted
          # text is emitted here in full rather than summarised.
          node scripts/tmp-dump-pdf-text.mjs "/tmp/zip-extract/Technical Proposal.pdf" > /tmp/final-pdf-text.txt
          echo "=== FINAL PDF TEXT ($(wc -c < /tmp/final-pdf-text.txt) chars) ==="
          cat /tmp/final-pdf-text.txt
          echo "=== END FINAL PDF TEXT ==="

      - name: Upload acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-hosted-acceptance
          path: |
            /tmp/workflow-center-after-analyze.json
            /tmp/workflow-center-final.json
            /tmp/export-readiness-final.json
            /tmp/generated-proposal-audit.json
            /tmp/generated-proposal-audit-post-export.json
            /tmp/export-response.json
            /tmp/preview-final.zip
            /tmp/pdf-page-report.txt
            /tmp/pdf-asset-audit.txt
            /tmp/pdf-money-report.txt
            /tmp/pricing-leakage-fragments.txt
            /tmp/pdf-branding-pre-gate.txt
            /tmp/delivered-technical-proposal.pdf
            /tmp/company-assets.json
            /tmp/final-pdf-text.txt
            /tmp/pdf-pages/
          if-no-files-found: warn
          retention-days: 3

  # ─── TEMPORARY — owner-authorized, read-only ───────────────────────────────
  #
  # Answers "what does the live Preview vault actually contain, and what did
  # the selection pipeline do with it?" without generating anything. Every
  # call is a GET. No AiJob is created, no document is written, and the
  # provider section reads the DURABLE usage snapshot rather than probing a
  # provider, so it costs no quota.
  #
  # This exists because the vault counts were previously inferred from the
  # generated PDF's own summary line rather than read from the database.
  # Remove it with the acceptance job.
  temporary-preview-vault-inspection:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'inspect'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      OWNER_EMAIL: ${{ secrets.PREVIEW_OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
      BASE_URL: https://hope-tender-path-b-git-0db72a-hopeengineering83-codes-projects.vercel.app
      TENDER_ID: ${{ inputs.tender_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets and inputs are present
        run: |
          if [ -z "$OWNER_EMAIL" ] || [ -z "$OWNER_PASSWORD" ]; then
            echo "::error::PREVIEW_OWNER_EMAIL / PREVIEW_OWNER_PASSWORD secrets are not set."
            exit 1
          fi
          if [ -z "$TENDER_ID" ]; then
            echo "tender_id not supplied — the inspection will discover the tender from /api/tenders."
          fi

      - name: Sign in through the real /api/auth/login endpoint
        run: |
          # Same request shape e2e/global-setup.ts uses: JSON credentials with
          # the Origin and Referer a same-origin browser form would send, so
          # strict CSRF stays enabled. Credentials go in a --data-binary file
          # rather than argv so they never reach the process table.
          umask 077
          printf '{"email":%s,"password":%s}' \
            "$(printf '%s' "$OWNER_EMAIL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            "$(printf '%s' "$OWNER_PASSWORD" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            > /tmp/login-body.json
          status=$(curl -sS --connect-timeout 15 --max-time 45 \
            -o /tmp/login-body-response.json -D /tmp/login-headers.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Origin: $BASE_URL" \
            -H "Referer: $BASE_URL/login" \
            --data-binary @/tmp/login-body.json \
            "$BASE_URL/api/auth/login")
          rm -f /tmp/login-body.json
          echo "login status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::Login against the Preview app failed (HTTP $status). Check PREVIEW_OWNER_EMAIL / PREVIEW_OWNER_PASSWORD."
            rm -f /tmp/login-headers.txt /tmp/login-body-response.json
            exit 1
          fi
          cookie=$(grep -i '^set-cookie:' /tmp/login-headers.txt \
            | grep -o 'hope_session=[^;]*' \
            | head -1 \
            | cut -d= -f2-)
          rm -f /tmp/login-headers.txt /tmp/login-body-response.json
          if [ -z "$cookie" ]; then
            echo "::error::Login succeeded but no hope_session cookie was returned."
            exit 1
          fi
          # Register the session value as a masked secret BEFORE it is used, so
          # it can never surface in a later log line.
          echo "::add-mask::$cookie"
          echo "SESSION_COOKIE=$cookie" >> "$GITHUB_ENV"
          echo "Signed in; session captured and masked."

      - name: Read the live vault, the selection pipeline and provider state
        run: python3 scripts/tmp-inspect-vault-and-selection.py 2>&1 | tee /tmp/vault-inspection.txt

      # WHY THIS EXISTS: the workflow UI's failure line is a regex over ONE
      # aggregated message, so it reports the union of categories seen across
      # the whole chain ("BILLING, AUTH..., RATE_LIMITED, ... REQUEST_TOO_LARGE")
      # and cannot say which provider produced which. When a provider passes
      # the analysis capability probe and then fails the real run, that union
      # is exactly the wrong resolution to debug at. The AiJob row carries the
      # durable, server-redacted failure text; this prints it verbatim.
      - name: Read the durable AI_ANALYZE job failures verbatim
        run: |
          tid="${{ inputs.tender_id }}"
          if [ -z "$tid" ]; then
            # /api/tenders returns { items, nextCursor, hasMore }. This read
            # looked for a `tenders` key, found nothing, and reported
            # "NOT READ -- no tender id discovered" on a Preview that had the
            # tender all along. The 2>/dev/null swallowed the reason, so the
            # step could not say whether the request failed, the session was
            # rejected, or the shape was simply different. It now names the
            # shape it got, and accepts every shape this API has used.
            curl -sS --connect-timeout 15 --max-time 45 \
              -H "Cookie: hope_session=$SESSION_COOKIE" \
              "$BASE_URL/api/tenders" > /tmp/tenders.json || true
            tid=$(python3 - <<'PYEOF'
          import json
          try:
              d = json.load(open('/tmp/tenders.json', encoding='utf-8'))
          except Exception as exc:
              print("", end="")
              import sys; print(f"TENDER DISCOVERY: unreadable response ({exc})", file=sys.stderr); raise SystemExit(0)
          import sys
          rows = d if isinstance(d, list) else (d.get('items') or d.get('tenders') or [])
          if not rows:
              print(f"TENDER DISCOVERY: no rows; top-level keys = {sorted(d) if isinstance(d, dict) else type(d).__name__}", file=sys.stderr)
              print("", end=""); raise SystemExit(0)
          print((rows[0] or {}).get('id', ''), end="")
          PYEOF
          )
          fi
          if [ -z "$tid" ]; then
            echo "AI_ANALYZE JOBS: NOT READ -- no tender id discovered (gap in this script, not a statement about the jobs)"
            exit 0
          fi
          echo "tender: $tid"
          curl -sS --connect-timeout 15 --max-time 45 \
            -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/ai-jobs?tenderId=$tid&take=25" > /tmp/ai-jobs.json || true
          python3 - <<'PYEOF' | tee /tmp/ai-analyze-failures.txt
          import json
          try:
              jobs = json.load(open('/tmp/ai-jobs.json', encoding='utf-8')).get('jobs', [])
          except Exception as exc:
              raise SystemExit(f"AI_ANALYZE JOBS: NOT READ (unreadable: {exc})")
          if not jobs:
              raise SystemExit("AI_ANALYZE JOBS: none recorded for this tender")
          for j in jobs:
              print(f"  {j.get('jobType')} {j.get('status')} id={j.get('id')} "
                    f"created={j.get('createdAt')} finished={j.get('finishedAt')}")
              msg = j.get('errorMessage') or j.get('error')
              if msg:
                  print("    errorMessage (verbatim, server-redacted):")
                  for line in str(msg).splitlines() or [""]:
                      print(f"      {line}")
          PYEOF

      # WHY THIS EXISTS: a green acceptance run proves the pipeline completed,
      # not that a model wrote anything. generateTenderDocuments deliberately
      # falls back to a deterministic draft so a human always has something to
      # review, so "AI Analyze succeeded" and "the proposal is model-backed" are
      # two different claims and only one of them is visible in a workflow's
      # step list. This prints the authorship the product already records.
      - name: Read who actually authored this analysis and these documents
        run: |
          tid="${{ inputs.tender_id }}"
          if [ -z "$tid" ]; then
            curl -sS --connect-timeout 15 --max-time 45 \
              -H "Cookie: hope_session=$SESSION_COOKIE" \
              "$BASE_URL/api/tenders" > /tmp/tenders-auth.json || true
            tid=$(python3 -c "import json;d=json.load(open('/tmp/tenders-auth.json'));r=d if isinstance(d,list) else (d.get('items') or d.get('tenders') or []);print((r[0] or {}).get('id','') if r else '',end='')" 2>/dev/null || echo "")
          fi
          if [ -z "$tid" ]; then
            echo "AUTHORSHIP: NOT READ -- no tender id discovered"
            exit 0
          fi
          curl -sS --connect-timeout 15 --max-time 45 \
            -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/tenders/$tid/analysis-quality" > /tmp/analysis-quality.json || true
          # /api/tenders/<id>/documents has no route handler -- only
          # documents/[docId] and documents/bulk-review exist -- so it 404s with
          # an empty body and the read reported "NOT READ (Expecting value:
          # line 1 column 1)". The generated documents, with the contentSummary
          # that names their author, hang off the tender detail endpoint.
          curl -sS --connect-timeout 15 --max-time 45 \
            -H "Cookie: hope_session=$SESSION_COOKIE" \
            "$BASE_URL/api/tenders/$tid" > /tmp/documents.json || true
          python3 - <<'PYEOF' | tee /tmp/authorship.txt
          import json

          def load(path):
              try:
                  return json.load(open(path, encoding="utf-8"))
              except Exception as exc:
                  return {"__unreadable__": str(exc)}

          q = load('/tmp/analysis-quality.json')
          if "__unreadable__" in q:
              print(f"ANALYSIS AUTHORSHIP: NOT READ ({q['__unreadable__']})")
          else:
              print(f"ANALYSIS AUTHORSHIP: analysisSource={q.get('analysisSource')!r}")
              for key in ("analysisSourceLabel", "analysisSourceRisk", "ready", "score"):
                  if key in q:
                      print(f"  {key}={q[key]!r}")

          d = load('/tmp/documents.json')
          if "__unreadable__" in d:
              print(f"DOCUMENT AUTHORSHIP: NOT READ ({d['__unreadable__']})")
              raise SystemExit(0)
          docs = (
              d.get("generatedDocuments")
              or d.get("documents")
              or d.get("items")
              or (d if isinstance(d, list) else [])
          )
          if not docs:
              print(f"DOCUMENT AUTHORSHIP: no documents; top-level keys = {sorted(d) if isinstance(d, dict) else type(d).__name__}")
              raise SystemExit(0)
          print(f"DOCUMENT AUTHORSHIP: {len(docs)} document(s)")
          for doc in docs:
              summary = str(doc.get("contentSummary") or "")
              # The summary always begins with the mode label, so the first
              # clause says whether a provider or the deterministic draft wrote
              # it. Print that rather than the whole paragraph.
              head = summary.split(".")[0][:160] if summary else "(no contentSummary)"
              print(f"  - {doc.get('fileName') or doc.get('name')!r}")
              print(f"      reviewStatus={doc.get('reviewStatus')!r} mode={head!r}")
              # WHY IT FELL BACK, not just THAT it fell back.
              #
              # generate-elite.ts already appends "AI fallback reason: <error>" to
              # contentSummary whenever the AI writer throws and the deterministic
              # draft takes over, and the deterministic label is only ever set
              # inside that catch -- so the writer WAS attempted and DID throw.
              # This printer showed only summary.split(".")[0], the mode, so three
              # accept runs reported "deterministic benchmark fallback" while the
              # provider sweep said groq was GENERATION_VERIFIED, and the actual
              # exception sat unread in the same field.
              marker = "AI fallback reason:"
              if marker in summary:
                  print(f"      FELL BACK BECAUSE: {summary.split(marker, 1)[1].strip()[:400]}")
              elif "deterministic" in head.lower():
                  print("      FELL BACK BECAUSE: (no reason recorded -- the AI writer was never attempted)")
          PYEOF

      - name: Read Preview health
        run: |
          curl -sS --connect-timeout 15 --max-time 45 "$BASE_URL/api/health" > /tmp/preview-health.json || true
          python3 - <<'PYEOF' | tee /tmp/preview-health.txt
          import json
          try:
              d = json.load(open('/tmp/preview-health.json', encoding='utf-8'))
          except Exception as exc:
              raise SystemExit(f"PREVIEW HEALTH: NOT MEASURED (unreadable: {exc})")
          print(f"PREVIEW HEALTH: ok={d.get('ok')} status={d.get('status')}")
          for key in ("releaseSha", "commitSha", "gitCommitSha", "version", "database", "schema"):
              if key in d:
                  print(f"  {key}={d[key]}")
          PYEOF
        continue-on-error: true

      - name: Print WHY the quality gate refuses each document
        run: |
          # GENERATED_DOCUMENT_QUALITY_FAILED names no rule. The readiness
          # blocker's own text says "The Document Validator shows the score and
          # the specific issues" -- which is a dead end for an automated
          # operator, because the score and the issues live behind a UI panel.
          #
          # /api/tenders/{id}/validate is the AUTHORITATIVE gate (the same
          # readiness model the blocker comes from) and it already returns
          # documentFailures[].reasons carrying "(score/100): reason; reason".
          # Reading it here turns "failed the rubric" into a named rule.
          # Origin header is REQUIRED: the app enforces a same-origin CSRF check on
          # POST, and without it this returned 403 and printed
          # "None document(s), None failing" -- a diagnostic that silently said
          # nothing was wrong with a package the gate was refusing. Every other
          # POST in this workflow already sends it.
          code=$(curl -sS -o /tmp/validate.json -w '%{http_code}' -X POST \
            -H "Cookie: hope_session=$SESSION_COOKIE" -H "Origin: $BASE_URL" \
            -H 'Content-Type: application/json' -d '{}' \
            --connect-timeout 15 --max-time 90 \
            "$BASE_URL/api/tenders/$TENDER_ID/validate" || echo 000)
          echo "validate HTTP $code   (422 = blocked, which is the case we want to read)"
          if [ "$code" != "200" ] && [ "$code" != "422" ]; then
            echo "::warning::validate returned $code — the quality report below is NOT a verdict on the package."
          fi
          python3 - <<'PYEOF' | tee /tmp/document-quality-blockers.txt
          import json
          try:
              d = json.load(open('/tmp/validate.json', encoding='utf-8'))
          except Exception as e:
              raise SystemExit(f"DOCUMENT QUALITY: validate response unreadable: {e}")
          # An auth/CSRF refusal has no documentCount at all. Saying "0 failing"
          # for that is worse than saying nothing: it reads as a clean package.
          if d.get('documentCount') is None:
              raise SystemExit(
                  "DOCUMENT QUALITY: NOT MEASURED — validate did not return a document report "
                  f"(error={d.get('error') or d.get('message') or d!r})")
          print(f"DOCUMENT QUALITY: {d.get('documentCount')} document(s), "
                f"{d.get('failureCount')} failing")
          # validate returned 422 (blocked) while reporting 0 document failures
          # and 0 tender-level blockers, so the reason it blocked is in neither
          # list. Print its own verdict and every remaining list, or the next
          # reader repeats this round trip.
          print(f"  validate says: {d.get('message') or d.get('error') or '(no message)'}")
          for key, value in sorted(d.items()):
              if key in {'documentFailures', 'tenderLevelBlockers'}:
                  continue
              if isinstance(value, list) and value:
                  print(f"  {key}: {json.dumps(value)[:600]}")
              elif isinstance(value, (bool, int)) or (isinstance(value, str) and key.lower().endswith('code')):
                  print(f"  {key}={value!r}")
          for f in (d.get('documentFailures') or []):
              print(f"  {f.get('name')}  id={f.get('documentId')}")
              for r in (f.get('reasons') or []):
                  # reasons carry the score and the named rule
                  msg = r.get('message') if isinstance(r, dict) else r
                  code = r.get('code') if isinstance(r, dict) else None
                  print(f"      [{code}] {msg}")
          for b in (d.get('tenderLevelBlockers') or []):
              msg = b.get('message') if isinstance(b, dict) else b
              code = b.get('code') if isinstance(b, dict) else None
              print(f"  TENDER-LEVEL [{code}] {msg}")
          PYEOF
        continue-on-error: true

      - name: Run the live provider chain test and print WHY each one failed
        run: |
          # Same call the "Test provider chain" button makes -- the only surface
          # that does a real round-trip per provider.
          #
          # BATCHED, because the whole chain does not fit one request. Ten real
          # serial round-trips share a 60s route budget, and on 34778938488 a
          # single 45s Z.ai timeout consumed it and left six providers
          # NOT_TESTED. Batching by the ?provider= filter gives every provider
          # its own budget, so "not measured" stops being the common outcome.
          # Z.ai runs alone because it is the known slow one.
          #
          # Diagnostics run inside runAsDiagnostic(), so nothing here imposes a
          # cooldown on real work.
          # BOTH CAPABILITIES, because they are different questions and this
          # report answered only one of them.
          #
          # On 2026-09-16 the full chain ran end to end and the proposal came
          # back "deterministic benchmark fallback" -- the deterministic draft
          # wrote it, not a model -- while this sweep reported providers
          # ANALYSIS_VERIFIED minutes earlier. Both were true. AI Analyze and
          # proposal GENERATION use different models and payload sizes (a tiny
          # structured extraction versus full narrative sections), so a
          # provider can pass the analysis probe and still be unable to write
          # the proposal. Measuring analysis and reporting it as "AI Analyze
          # can run" says nothing about whether a MODEL-BACKED PROPOSAL can be
          # produced, which is the question the acceptance exists to answer.
          : > /tmp/provider-chain.jsonl
          for capability in analysis generation; do
            echo "=== capability: $capability"
            for batch in "gemini,groq,mistral" "zai" "cerebras,openrouter,openai" "together,deepseek,anthropic"; do
              echo "--- batch: $batch ($capability)"
              curl -sS --connect-timeout 15 --max-time 120 \
                -H "Cookie: hope_session=$SESSION_COOKIE" \
                "$BASE_URL/api/ai-providers/diagnostics?live=1&capability=$capability&provider=$batch" \
                >> /tmp/provider-chain.jsonl || true
              echo >> /tmp/provider-chain.jsonl
            done
          done
          python3 - <<'PYEOF' | tee /tmp/provider-chain.txt
          import json
          rows, untested, unreadable = [], [], 0
          for line in open('/tmp/provider-chain.jsonl', encoding='utf-8'):
              line = line.strip()
              if not line:
                  continue
              try:
                  d = json.loads(line)
              except Exception:
                  unreadable += 1
                  continue
              rows.extend(d.get('perProvider') or [])
              untested.extend(d.get('notTested') or [])
          if not rows:
              raise SystemExit(
                  f"PROVIDER CHAIN: NOT MEASURED (no perProvider in any batch; "
                  f"{unreadable} unreadable response(s))")
          verified = {'CONNECTIVITY_VERIFIED', 'ANALYSIS_VERIFIED', 'GENERATION_VERIFIED'}
          ok = [r for r in rows if r.get('diagnosticState') in verified]
          # TWO DIFFERENT QUESTIONS, PRINTED SEPARATELY.
          #
          # `usableForAiAnalyze` is the PROBE: this key, route and model did a
          # real structured extraction on a tiny payload.
          # `eligible` is ROUTING: the provider is in the chain AND not cooling
          # down from earlier REAL failures.
          #
          # On 2026-09-16 this report printed only the first. It said
          # "gemini ANALYSIS_VERIFIED analyze=True" at 13:33Z, and at 13:37Z the
          # real AI Analyze recorded "gemini: in cooldown" and contacted nobody.
          # Both were true. Printing one of them is what made three sessions in
          # a row predict a run that could not happen.
          probe_ok = [r for r in rows if r.get('usableForAiAnalyze')]
          routable = [r for r in rows if r.get('usableForAiAnalyze') and r.get('eligible')]
          print(f"PROVIDER CHAIN: {len(ok)}/{len(rows)} verified, "
                f"{len(probe_ok)} passed the analysis PROBE, "
                f"{len(routable)} ELIGIBLE FOR REAL WORK NOW"
                + (f", {unreadable} unreadable batch(es)" if unreadable else ""))
          print(f"  PROBE PASSED:       {[r.get('provider') for r in probe_ok] or 'NONE'}")
          print(f"  ELIGIBLE NOW:       {[r.get('provider') for r in routable] or 'NONE'}"
                + ("   <-- AI Analyze can run" if routable else "   <-- AI Analyze CANNOT run yet"))
          blocked = [r for r in rows if r.get('usableForAiAnalyze') and not r.get('eligible')]
          for r in blocked:
              print(f"  PROBE-OK BUT NOT ROUTABLE: {r.get('provider')} -- {r.get('eligibilityReason')}"
                    f" (cooldownUntil={r.get('cooldownUntil')})")
          for r in rows:
              print(f"  {str(r.get('provider')):<12} {str(r.get('diagnosticState')):<22}"
                    f" probe={r.get('usableForAiAnalyze')} eligible={r.get('eligible')}"
                    f" model={r.get('resolvedModel')} keyPresent={r.get('keyPresent')}")
              # The number that turns "skipped" into a decision: whether waiting
              # is the answer, and until when.
              if r.get('coolingDown') or r.get('cooldownUntil'):
                  print(f"      cooldownUntil={r.get('cooldownUntil')}"
                        f" lastFailureAt={r.get('lastFailureAt')}"
                        f" lastFailureCategory={r.get('lastFailureCategory')}"
                        f" consecutiveFailures={r.get('consecutiveFailures')}")
              elif not r.get('eligible'):
                  print(f"      not eligible: {r.get('eligibilityReason')}")
              # Per-use-case models, because "configured" is not one question.
              # Groq is dropped from the analysis CHUNK PLANNER unless proposal,
              # extraction AND fast all resolve non-empty (isProviderConfigured),
              # and an empty slot is invisible in the single `model` field above.
              rm = r.get('resolvedModels') or {}
              if rm:
                  print(f"      resolvedModels: proposal={rm.get('proposal')!r} "
                        f"extraction={rm.get('extraction')!r} fast={rm.get('fast')!r}")
              for cap in (r.get('results') or []):
                  if cap.get('status') == 'ok':
                      continue
                  print(f"      {cap.get('capability')}: {cap.get('category')} -- {cap.get('safeMessage')}")
          for nt in untested:
              print(f"  NOT TESTED: {nt.get('provider')} -- {nt.get('reason')}")
          PYEOF
        continue-on-error: true

      # The authorship answer is the reason this job is usually run, and it was
      # printed in the middle of a 3,600-line log, behind a provider sweep whose
      # echoed script alone is ~60 lines. Reading it back cost several large log
      # fetches that each missed it by a few lines. Re-print it last: the most
      # important line in the report should not be the hardest one to find.
      - name: Repeat the authorship verdict at the end of the log
        if: always()
        run: |
          echo "================ AUTHORSHIP VERDICT (repeat) ================"
          cat /tmp/authorship.txt 2>/dev/null || echo "authorship.txt was not produced"
          echo "============================================================="

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: preview-vault-inspection
          path: |
            /tmp/vault-inspection.txt
            /tmp/ai-analyze-failures.txt
            /tmp/authorship.txt
            /tmp/provider-chain.txt
            /tmp/document-quality-blockers.txt
            /tmp/provider-chain.jsonl
            /tmp/preview-health.txt
          if-no-files-found: error
          retention-days: 3

  # ─── TEMPORARY — owner-authorized, runs only on a NEW empty database ────────
  #
  # A new Neon database arrives with no tables and no accounts. The Preview
  # build cannot fix that: scripts/migrate-deploy-safe.mjs deliberately skips
  # migrations on every non-production Vercel environment, so a Preview deploy
  # leaves the schema uncreated. And with no owner account there is no way to
  # sign in, so neither the vault upload nor the acceptance harness can run.
  #
  # This job applies the committed migrations and creates exactly one owner. It
  # inserts no tender, project or expert — evidence is uploaded through the real
  # UI so every record carries genuine source provenance.
  #
  # prisma migrate deploy is additive: it applies the migrations already in
  # prisma/migrations and never drops or resets. Remove this job once the

  # ───────────────────────────────────────────────────────────────────────────
  # TEMPORARY. The first thing to run after a Neon database swap.
  #
  # A swap has now happened three times (2026-09-03, 2026-09-07, 2026-09-11).
  # Each time the same two questions decide everything that follows, and each
  # time they were answered slowly:
  #
  #   1. Did a Preview process touch the new database before the migrations
  #      did? lib/prisma.ts's legacy bootstrap builds the schema ad-hoc
  #      whenever NODE_ENV != "production", leaving 54 tables, no
  #      _prisma_migrations history and hundreds of drift statements, which is
  #      why `prisma migrate deploy` then refuses with P3005.
  #
  #   2. Which fingerprint does the rebuild expect? sha256(host/dbname), and
  #      Vercel holds the POOLED host while the migration secret holds the
  #      DIRECT one, so one database hashes two ways. The 2026-09-07 rebuild
  #      refused on precisely that mismatch and the run was wasted.
  #
  # This job answers both, changes nothing, and prints the two fingerprints
  # side by side with the one provision needs labelled. Read-only: it issues a
  # GET and computes two hashes. Remove it with the other temporary jobs.
  # ───────────────────────────────────────────────────────────────────────────
  temporary-preview-health:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'health'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      BASE_URL: https://hope-tender-path-b-git-0db72a-hopeengineering83-codes-projects.vercel.app
      MIGRATION_URL: ${{ secrets.PREVIEW_DATABASE_URL_MIGRATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read /api/health on the Preview
        run: |
          echo "BASE_URL: $BASE_URL"
          code=$(curl -sS -o /tmp/health.json -w '%{http_code}' \
            --connect-timeout 15 --max-time 60 "$BASE_URL/api/health" || echo 000)
          echo "HTTP $code"
          echo "--- /api/health ---"
          cat /tmp/health.json || true
          echo
          echo "--- end ---"

      - name: Summarise what the health payload decides
        run: |
          python3 - <<'PYEOF'
          import json
          try:
              h = json.load(open('/tmp/health.json'))
          except Exception as e:
              print(f"  !! health payload unreadable: {e}")
              print("  A 503 with every database probe false is the signature of a")
              print("  DATABASE_URL the runtime cannot reach. That is an environment")
              print("  fact, not a code regression.")
              raise SystemExit(0)
          print(f"  ok                      = {h.get('ok')}")
          print(f"  status                  = {h.get('status')}")
          print(f"  databaseFingerprint     = {h.get('databaseFingerprint')}   <-- POOLED (what Vercel uses)")
          print(f"  schemaMatchesDeployedCode = {h.get('schemaMatchesDeployedCode')}")
          tables = h.get('tables') or h.get('database') or {}
          if isinstance(tables, dict):
              missing = [k for k, v in tables.items() if v is not True]
              print(f"  tables present          = {len(tables) - len(missing)}/{len(tables)}")
              if missing:
                  print(f"  tables NOT present      = {missing}")
          print("")
          if h.get('schemaMatchesDeployedCode') is True and h.get('ok') is True:
              print("  => Schema is up to date and reachable. No rebuild needed.")
              print("     The vault will still be EMPTY on a new database; the owner")
              print("     must re-upload Company Vault + Brand Assets, then the tender.")
          else:
              print("  => Something is off. If migrate deploy refused with P3005, the")
              print("     runtime bootstrap created the schema first; run confirm=provision")
              print("     with the DIRECT fingerprint printed in the next step.")
          PYEOF

      - name: Print both fingerprints, and say which one provision needs
        run: |
          node -e '
            const { createHash } = require("node:crypto");
            const raw = (process.env.MIGRATION_URL || "").trim();
            if (!raw) { console.log("  !! PREVIEW_DATABASE_URL_MIGRATION is not set"); process.exit(0); }
            const fp = (u) => { const p = new URL(u); return createHash("sha256").update(`${p.hostname}/${p.pathname.replace(/^\//, "")}`).digest("hex").slice(0, 12); };
            const direct = new URL(raw);
            const pooledHost = direct.hostname.includes("-pooler.") ? direct.hostname : direct.hostname.replace(/^([^.]+)\./, "$1-pooler.");
            const pooled = new URL(raw); pooled.hostname = pooledHost;
            const bare = new URL(raw); bare.hostname = direct.hostname.replace("-pooler.", ".");
            console.log("  migration secret host   =", direct.hostname);
            console.log("  fingerprint (as stored) =", fp(direct.toString()));
            console.log("  fingerprint (direct)    =", fp(bare.toString()), "  <-- pass THIS as expected_fingerprint");
            console.log("  fingerprint (pooled)    =", fp(pooled.toString()), "  <-- what /api/health prints");
            console.log("");
            console.log("  The two differ because the fingerprint is sha256(host/dbname)");
            console.log("  and the pooled host carries a -pooler. marker. Passing the");
            console.log("  health one is what made the 2026-09-07 rebuild refuse.");
          '


  # ───────────────────────────────────────────────────────────────────────────
  # TEMPORARY. Poll this while the owner re-uploads after a database swap.
  #
  # The acceptance run costs provider quota and produces the benchmark artifact.
  # Starting it while the vault is half-uploaded measures the upload, not the
  # app: unextracted vault documents cannot be matched as evidence, so every
  # requirement is under-evidenced through no fault of the code.
  #
  # Read-only, and it ALWAYS exits 0. "Not ready" is a valid answer rather than
  # a failure — a red X on the PR every time somebody checks is noise that
  # teaches people to ignore red Xs.
  # ───────────────────────────────────────────────────────────────────────────
  temporary-preview-upload-readiness:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      OWNER_EMAIL: ${{ secrets.PREVIEW_OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
      BASE_URL: https://hope-tender-path-b-git-0db72a-hopeengineering83-codes-projects.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign in through the real /api/auth/login endpoint
        run: |
          # Byte-for-byte the step the inspection job uses. My first attempt
          # wrote a fresh one that omitted the Origin and Referer headers and
          # got a flat HTTP 403: the login route enforces strict CSRF and wants
          # the headers a same-origin browser form would send. Credentials go
          # through a --data-binary file rather than argv so they never reach
          # the process table.
          umask 077
          printf '{"email":%s,"password":%s}' \
            "$(printf '%s' "$OWNER_EMAIL" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            "$(printf '%s' "$OWNER_PASSWORD" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')" \
            > /tmp/login-body.json
          status=$(curl -sS --connect-timeout 15 --max-time 45 \
            -o /tmp/login-body-response.json -D /tmp/login-headers.txt \
            -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -H "Origin: $BASE_URL" \
            -H "Referer: $BASE_URL/login" \
            --data-binary @/tmp/login-body.json \
            "$BASE_URL/api/auth/login")
          rm -f /tmp/login-body.json
          echo "login status: $status"
          if [ "$status" != "200" ]; then
            # Say what was observed, not what it might mean. A 403 is CSRF or
            # deployment protection; a 401 is credentials; a 5xx is the app. The
            # first version of this message asserted "the owner account is
            # missing" for all of them, which was an inference with nothing
            # behind it and would have sent the next reader to rebuild a
            # database that was perfectly fine.
            echo "::error::Login against the Preview app failed (HTTP $status). 401 means the credentials are wrong; 403 means CSRF/deployment protection rejected the request shape; 5xx means the app or its database is unwell — run confirm=health."
            rm -f /tmp/login-headers.txt /tmp/login-body-response.json
            exit 1
          fi
          cookie=$(grep -i '^set-cookie:' /tmp/login-headers.txt \
            | grep -o 'hope_session=[^;]*' \
            | head -1 \
            | cut -d= -f2-)
          rm -f /tmp/login-headers.txt /tmp/login-body-response.json
          if [ -z "$cookie" ]; then
            echo "::error::Login succeeded but no hope_session cookie was returned."
            exit 1
          fi
          echo "::add-mask::$cookie"
          echo "SESSION_COOKIE=$cookie" >> "$GITHUB_ENV"
          echo "Signed in; session captured and masked."

      - name: Report what has been uploaded so far
        run: python3 scripts/tmp-upload-readiness.py

  # database swap is done.
  temporary-preview-db-provision:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'provision'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      # The migration URL, not the pooled one. Migrations serialise themselves
      # with a SESSION-scoped advisory lock and a transaction pooler answers
      # consecutive statements from different backends, so the lock is never
      # observed and Prisma fails P1002. resolve-migration-url.mjs also strips a
      # "-pooler." marker if one is present, so either form works here.
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_MIGRATION }}
      OWNER_EMAIL: ${{ secrets.PREVIEW_OWNER_EMAIL }}
      OWNER_PASSWORD: ${{ secrets.PREVIEW_OWNER_PASSWORD }}
      OWNER_COMPANY_NAME: Hope Urban Planning Architectural and Engineering Consultancy PLC
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify secrets are present
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PREVIEW_DATABASE_URL_MIGRATION is not set. Update it to the new Neon URL before running this job."
            exit 1
          fi
          if [ -z "$OWNER_EMAIL" ] || [ -z "$OWNER_PASSWORD" ]; then
            echo "::error::PREVIEW_OWNER_EMAIL / PREVIEW_OWNER_PASSWORD must be set so the seeded owner matches the account the acceptance harness signs in as."
            exit 1
          fi
          if [ -z "${{ inputs.expected_fingerprint }}" ]; then
            echo "::error::expected_fingerprint is required. Read it from /api/health on the Preview being rebuilt. Without it the rebuild has no way to prove which database it is about to change."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Inspect what the target database already contains
        # P3005 ("schema is not empty") covers two opposite situations: a fresh
        # database carrying stray objects, which should be cleared, and one
        # holding real records, which must be baselined and never cleared. This
        # read-only listing is what tells them apart.
        run: node scripts/tmp-inspect-target-database.mjs

      - name: Show migration status before applying
        run: npx prisma migrate status || true

      - name: Does the live schema already match prisma/schema.prisma?
        # Decides between baselining and rebuilding without touching anything.
        # An empty diff means the schema the database has is exactly the schema
        # the migrations produce, so marking them applied is safe. A non-empty
        # diff means baselining would leave silent drift, and the schema must be
        # rebuilt instead. Read-only: --script only prints SQL.
        run: |
          echo "--- SQL that would be needed to bring the DATABASE up to schema.prisma ---"
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --script | tee /tmp/schema-drift.sql
          echo "--- end ---"
          # Comments and blank lines do not count as drift.
          drift=$(grep -vE '^\s*(--.*)?$' /tmp/schema-drift.sql | wc -l)
          echo "drift statements: $drift"
          if [ "$drift" -eq 0 ]; then
            echo "SCHEMA_MATCHES=true" >> "$GITHUB_ENV"
            echo "The live schema already matches. Baselining is safe."
          else
            echo "SCHEMA_MATCHES=false" >> "$GITHUB_ENV"
            echo "::warning::The live schema does NOT match prisma/schema.prisma; baselining would leave drift."
          fi

      - name: Install PostgreSQL 18 client tools (matches the Neon server version)
        # pg_dump refuses to read from a server newer than itself, and Ubuntu
        # ships v16 while Neon runs 18. The schema-only backup taken as rollback
        # evidence in the next step depends on this.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      # This repeats the procedure used for the first Neon switch on
      # 2026-09-03 (commit 25de5cc7), because the new database reproduced that
      # switch's signature exactly. Root cause then and now: lib/prisma.ts's
      # legacy isRuntimeSchemaBootstrapEnabled()/bootstrap() path builds the
      # schema ad-hoc rather than from prisma/migrations, so it carries no
      # _prisma_migrations history and drifts from schema.prisma, and it seeds
      # the 4 canonical Role rows that are this database's only data. That path
      # runs whenever NODE_ENV is not "production", which is how a Preview
      # process touching a brand-new database creates its schema.
      #
      # The rebuild is gated rather than blind. The script re-verifies the
      # fingerprint against EXPECTED_FINGERPRINT, requires every business table
      # to be empty, requires any Role rows to match the repository's canonical
      # set exactly, and takes a schema-only pg_dump as rollback evidence before
      # it changes anything — exiting 1 if any gate fails.
      - name: Gated verified rebuild (proceeds only if every gate passes)
        env:
          EXPECTED_FINGERPRINT: ${{ inputs.expected_fingerprint }}
        run: node scripts/tmp-verified-clean-rebuild.mjs

      - name: Apply the full repository migration history from empty
        run: npm run prisma:migrate:safe

      - name: Restore the 4 canonical Role rows and verify migration history
        run: node scripts/tmp-restore-canonical-roles-and-verify.mjs

      - name: Confirm every migration is applied
        run: npx prisma migrate status

      - name: Provision the owner account
        run: node scripts/tmp-provision-preview-owner.mjs

  # ---------------------------------------------------------------------------
  # TEMPORARY, owner-authorized: portfolio enrichment against the Preview
  # database.
  #
  # Two write-path defects were fixed in the app: the bulk import never derived
  # the portfolio numbers sitting verbatim in each record's own reference text,
  # and neither ingestion path checked that the value going into
  # `Project.country` was a country. Neither fix reaches a row that was already
  # written, and the rows already written are the ones the proposal writer
  # reads — on the owner's portfolio that meant 0 of 114 rows held a plain
  # country and none held a contract value.
  #
  # This job runs the same service the ingestion paths use, against the
  # Preview database, through the MIGRATION url (the pooled one is fine for
  # row updates, but reusing the migration secret keeps the target explicit
  # rather than inherited). It is a dry run unless apply_enrichment is "yes",
  # it never blanks a column, it never overwrites a populated one except a
  # country value proven not to be a country, and it lists every row whose own
  # evidence cannot settle its country instead of guessing.
  # ---------------------------------------------------------------------------
  temporary-preview-portfolio-enrichment:
    if: github.event_name == 'workflow_dispatch' && inputs.confirm == 'enrich'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DATABASE_URL: ${{ secrets.PREVIEW_DATABASE_URL_MIGRATION }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify the target is named, not inherited
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::PREVIEW_DATABASE_URL_MIGRATION is not set. This job has no database to read."
            exit 1
          fi
          node -e '
            const url = new URL(process.env.DATABASE_URL);
            const crypto = require("node:crypto");
            const fingerprint = crypto
              .createHash("sha256")
              .update(`${url.host}${url.pathname}`)
              .digest("hex")
              .slice(0, 16);
            console.log(`target host: ${url.host.replace(/^[^.]*/, "***")}`);
            console.log(`target fingerprint (sha256 of host/dbname, first 16): ${fingerprint}`);
          '

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Dry run — what would change, and what would be refused
        run: npx tsx scripts/enrich-project-portfolio-facts.ts ${{ inputs.reverify_stale_provenance == 'yes' && '--reverify-stale' || '' }}

      - name: Apply
        if: inputs.apply_enrichment == 'yes'
        run: npx tsx scripts/enrich-project-portfolio-facts.ts --apply ${{ inputs.reverify_stale_provenance == 'yes' && '--reverify-stale' || '' }}

      - name: Re-read after applying, so the census is measured and not predicted
        if: inputs.apply_enrichment == 'yes'
        # A second dry run over the written rows. Every "rows modified" count
        # must now be zero, "durably verified" must equal the row count, and the
        # country/value populations must match what the applied run reported:
        # that is what distinguishes a write that landed from a write that was
        # only planned, and it is the check that would have caught the
        # enrichment which silently un-verified 114 projects.
        run: npx tsx scripts/enrich-project-portfolio-facts.ts ${{ inputs.reverify_stale_provenance == 'yes' && '--reverify-stale' || '' }}
