name: Lockfile refresh artifact

on:
  push:
    branches:
      - integration/production-engine-2026-06
  pull_request:
    branches:
      - release/production-engine-2026-06
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lockfile-refresh-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Refresh lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify dependency tree
        run: npm install --ignore-scripts --prefer-offline && npm ls --all

      - name: Upload synchronized lockfile
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-lockfile
          path: |
            package.json
            package-lock.json
          if-no-files-found: error
          retention-days: 1
