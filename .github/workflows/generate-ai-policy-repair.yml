name: Generate AI policy repair artifact

on:
  push:
    branches: [codex-release-integrity-hardening]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate deterministic repaired files
        run: node scripts/repair-ai-policy-artifact.mjs

      - name: Upload repaired source artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-policy-repair
          path: repair-artifact/
          if-no-files-found: error
          retention-days: 1
