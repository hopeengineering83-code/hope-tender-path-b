name: CI

on:
  pull_request:
    branches:
      - main
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  push:
    branches:
      - main
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Migration, schema, integrity, typecheck, lint, test, build, and browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_ci
          POSTGRES_PASSWORD: hope_ci
          POSTGRES_DB: hope_tender_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_ci -d hope_tender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://hope_ci:hope_ci@127.0.0.1:5432/hope_tender_ci?schema=public"
      SESSION_SECRET: "ci-session-secret-with-more-than-thirty-two-characters"
      NEXTAUTH_SECRET: "ci-nextauth-secret-with-more-than-thirty-two-characters"
      GEMINI_API_KEY: "ci-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"
      E2E_FULL_AUTH: "false"
      E2E_TEST_EMAIL: "e2e-release-integrity@example.test"
      E2E_TEST_PASSWORD: "E2E-release-integrity-password-2026"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject install-time source mutation
        run: git diff --exit-code

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy the complete migration history
        run: npx prisma migrate deploy

      - name: Verify critical migrated schema
        env:
          REQUIRE_MIGRATION_HISTORY: "true"
        run: npm run db:check-critical-schema

      - name: Verify migration idempotency
        run: npx prisma migrate deploy

      - name: Audit release integrity
        run: npm run audit:release-integrity

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and database integration tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm test 2>&1 | tee test-results/npm-test.log

      - name: Upload test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-results
          npm run build 2>&1 | tee build-results/npm-build.log

      - name: Reject build-time source mutation
        run: git diff --exit-code

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed isolated browser-test account
        run: node scripts/seed-e2e-user.mjs

      - name: Browser smoke and golden tender workflow
        env:
          E2E_GOLDEN_AUTH: "true"
          MISTRAL_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          GEMINI_API_KEY: "ci-provider-placeholder-not-used-at-runtime"
          OPENAI_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          CSRF_MODE: "off"
        run: npm run test:e2e

      - name: Reject test-time source mutation
        if: always()
        run: git diff --exit-code

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
