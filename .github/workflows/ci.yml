# ─── Neon-isolation contract (audit requirements #1–#7) ──────────────────────
#
# This workflow NEVER connects to the live Neon Production database.
#   #1 — No dependency on the external Neon DATABASE_URL. The job sets its own
#        DATABASE_URL inline below; no `secrets.DATABASE_URL` is read.
#   #2 — A postgres:16 service container is started for every database
#        integration test (see `services:` below). The container is ephemeral
#        and is destroyed when the job exits.
#   #3 — DATABASE_URL is generated INSIDE the workflow (see the `env:` block
#        below) and is scoped only to this job. The URL points at the service
#        container via 127.0.0.1:5432.
#   #4 — RUN_DB_INTEGRATION=true is set ONLY for this job (the one using the
#        ephemeral Postgres). No other workflow in this repo sets it.
#   #5 — A fail-closed runtime guard (lib/test-db-guard.mjs) is loaded by
#        scripts/run-tests.mjs and rejects any DATABASE_URL containing
#        neon.tech, the known Production Neon hostname, or any
#        production-designated database name (prod_*, *_prod, vercel_prod, etc.).
#   #6 — Test-created rows (users, tenders, files, requirements, AI jobs, …)
#        are transactionally cleaned up by tests/helpers/db-fixture.ts even
#        when assertions fail mid-test.
#   #7 — A repo-wide regression test (tests/ci-neon-isolation-regression.test.ts)
#        enforces all of the above statically — any future contributor who
#        re-introduces `secrets.DATABASE_URL` or a non-postgres:16 service
#        image will fail the build.
#
# This contract is non-negotiable. Production Neon credentials, Vercel
# Production env vars, SESSION_SECRET, migrations, and Production deployment
# are NEVER touched by this workflow.
name: CI

on:
  pull_request:
    branches:
      - main
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  push:
    branches:
      - main
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Migrations, integrity, typecheck, lint, tests, build, and authenticated isolation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_ci
          POSTGRES_DB: hope_tender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_ci -d hope_tender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://hope_ci@127.0.0.1:5432/hope_tender_ci?schema=public"
      SESSION_SECRET: "ci-session-${{ github.run_id }}-${{ github.sha }}"
      NEXTAUTH_SECRET: "ci-nextauth-${{ github.run_id }}-${{ github.sha }}"
      GEMINI_API_KEY: "ci-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"
      REQUIRE_MIGRATION_HISTORY: "true"
      E2E_FULL_AUTH: "true"
      E2E_SEED_ALLOWED: "true"
      E2E_TEST_EMAIL: "e2e-primary@example.test"
      E2E_TEST_PASSWORD: "CiPrimary-${{ github.run_id }}-A9!secure"
      E2E_SECOND_EMAIL: "e2e-secondary@example.test"
      E2E_SECOND_PASSWORD: "CiSecondary-${{ github.run_id }}-B8!secure"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject install-time source mutation
        run: git diff --exit-code

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy complete migration history
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npx prisma migrate deploy 2>&1 | tee test-results/migrate-deploy.log

      - name: Verify critical migrated schema
        run: npm run db:check-critical-schema

      - name: Verify retroactive initialization structure and history
        run: npm run db:verify-retroactive-init

      - name: Verify migration idempotency
        shell: bash
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee test-results/migrate-idempotency.log

      - name: Audit release integrity
        run: npm run audit:release-integrity

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and database integration tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/npm-test.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-results
          npm run build 2>&1 | tee build-results/npm-build.log

      - name: Reject build-time source mutation
        run: git diff --exit-code

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed isolated two-user browser fixtures
        run: node scripts/seed-e2e-user.mjs

      - name: Browser smoke, authenticated intake, golden workflow, and cross-user isolation
        env:
          CSRF_MODE: "off"
          MISTRAL_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          # Map the CI-seeded credentials to the env vars the Playwright tests check.
          # E2E_FULL_AUTH is already set in the job-level env; E2E_GOLDEN_AUTH enables
          # the golden tender workflow. SMOKE_TEST_EMAIL/PASSWORD enable the production
          # smoke and tablet tests. The credentials are generated per-run and seeded
          # by scripts/seed-e2e-user.mjs — they are not real production accounts.
          E2E_GOLDEN_AUTH: "true"
          SMOKE_TEST_EMAIL: ${{ env.E2E_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
        run: npm run test:e2e

      - name: Reject test-time source mutation
        if: always()
        run: git diff --exit-code

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            test-results/
            build-results/
            playwright-report/
            test-results-e2e/
          if-no-files-found: ignore
          retention-days: 7
