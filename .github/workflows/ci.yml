name: CI

on:
  pull_request:
    branches:
      - main
      - integration/controlled-recovery
      - release/consolidated-recovery-20260717
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  push:
    branches:
      - main
      - integration/controlled-recovery
      - release/consolidated-recovery-20260717
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Migrations, integrity, typecheck, lint, tests, build, and authenticated isolation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_ci
          POSTGRES_DB: hope_tender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_ci -d hope_tender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://hope_ci@127.0.0.1:5432/hope_tender_ci?schema=public"
      SESSION_SECRET: "ci-session-${{ github.run_id }}-${{ github.sha }}"
      NEXTAUTH_SECRET: "ci-nextauth-${{ github.run_id }}-${{ github.sha }}"
      GEMINI_API_KEY: "ci-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"
      REQUIRE_MIGRATION_HISTORY: "true"
      E2E_FULL_AUTH: "true"
      E2E_SEED_ALLOWED: "true"
      E2E_TEST_EMAIL: "e2e-primary@example.test"
      E2E_TEST_PASSWORD: "CiPrimary-${{ github.run_id }}-A9!secure"
      E2E_SECOND_EMAIL: "e2e-secondary@example.test"
      E2E_SECOND_PASSWORD: "CiSecondary-${{ github.run_id }}-B8!secure"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject install-time source mutation
        run: git diff --exit-code

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy complete migration history
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npx prisma migrate deploy 2>&1 | tee test-results/migrate-deploy.log

      - name: Verify critical migrated schema
        run: npm run db:check-critical-schema

      - name: Verify retroactive initialization structure and history
        run: npm run db:verify-retroactive-init

      - name: Verify migration idempotency
        shell: bash
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee test-results/migrate-idempotency.log

      - name: Verify Prisma zero drift
        shell: bash
        run: |
          set -o pipefail
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code 2>&1 | tee test-results/prisma-zero-drift.log

      - name: Audit release integrity
        shell: bash
        run: |
          set -o pipefail
          npm run audit:release-integrity 2>&1 | tee test-results/release-integrity-audit.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee test-results/typecheck.log

      - name: Lint
        run: npm run lint

      - name: Unit and database integration tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/npm-test.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-results
          npm run build 2>&1 | tee build-results/npm-build.log

      - name: Reject build-time source mutation
        run: git diff --exit-code

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed isolated two-user browser fixtures
        run: node scripts/seed-e2e-user.mjs

      - name: Browser smoke, authenticated intake, golden workflow, and cross-user isolation
        env:
          CSRF_MODE: "off"
          MISTRAL_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          E2E_GOLDEN_AUTH: "true"
          SMOKE_TEST_EMAIL: ${{ env.E2E_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
        run: npm run test:e2e

      - name: Reject test-time source mutation
        if: always()
        run: git diff --exit-code

      - name: Upload diagnostics and exact critical sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            test-results/
            build-results/
            playwright-report/
            test-results-e2e/
            prisma/schema.prisma
            prisma/migrations/
            lib/ai-job-handlers.ts
            lib/ai.ts
            lib/engine/final-package-readiness-model.ts
            lib/engine/public-readiness-envelope.ts
          if-no-files-found: error
          retention-days: 7

  validate-proposal-fallback-repair:
    name: Validate mixed-fallback zero-write repair
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1175 &&
      github.event.pull_request.head.ref == 'release/consolidated-recovery-20260717'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused?schema=public
      SESSION_SECRET: validation-only-session-secret
      GEMINI_API_KEY: validation-placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidated-recovery-20260717
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture existing TypeScript debt
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-before.log 2>&1
          status=$?
          set -e
          echo "$status" > /tmp/typecheck-before.status
          grep -c "error TS" /tmp/typecheck-before.log > /tmp/typecheck-before.count || echo 0 > /tmp/typecheck-before.count

      - name: Apply exact mixed-fallback repair
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'if (sectionResult.anyFallback)' lib/ai-job-handlers.ts \
            && grep -Fq 'AI_PROPOSAL_MIXED_FALLBACK_BLOCKED' lib/ai-job-handlers.ts \
            && test -f tests/proposal-mixed-fallback-zero-write.test.ts; then
            echo "The exact mixed-fallback zero-write repair is already present; validation remains required."
          else
            python3 scripts/enforce-zero-write-proposal-fallback.py
          fi

      - name: Run focused zero-write regression
        run: npx tsx --test tests/proposal-mixed-fallback-zero-write.test.ts

      - name: Prove repair introduces no TypeScript regression
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-after.log 2>&1
          status=$?
          set -e
          before_count=$(cat /tmp/typecheck-before.count)
          after_count=$(grep -c "error TS" /tmp/typecheck-after.log || true)
          echo "Existing TypeScript errors: $before_count; repaired tree errors: $after_count"
          if grep -F "lib/ai-job-handlers.ts" /tmp/typecheck-after.log; then
            echo "The repaired handler has a TypeScript diagnostic"
            cat /tmp/typecheck-after.log
            exit 1
          fi
          if [ "$after_count" -gt "$before_count" ]; then
            echo "The repair introduced additional TypeScript errors"
            diff -u /tmp/typecheck-before.log /tmp/typecheck-after.log || true
            exit 1
          fi
          if [ "$(cat /tmp/typecheck-before.status)" -eq 0 ] && [ "$status" -ne 0 ]; then
            echo "A previously clean tree became type-invalid"
            cat /tmp/typecheck-after.log
            exit 1
          fi

      - name: Commit validated repair to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add lib/ai-job-handlers.ts tests/proposal-mixed-fallback-zero-write.test.ts
          if git diff --cached --quiet; then
            echo "No repair diff remains; exact-head files already contain the validated zero-write rule."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai): block mixed fallback before proposal persistence"
          git push --force origin HEAD:refs/heads/automation/consolidation-proposal-fallback-validated

      - name: Upload repair diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proposal-fallback-repair-diagnostics
          path: |
            lib/ai-job-handlers.ts
            tests/proposal-mixed-fallback-zero-write.test.ts
            /tmp/typecheck-before.log
            /tmp/typecheck-after.log
          if-no-files-found: error
          retention-days: 7
