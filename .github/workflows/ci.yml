name: CI

on:
  pull_request:
    branches:
      - main
      - integration/controlled-recovery
      - release/consolidated-recovery-20260717
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  push:
    branches:
      - main
      - integration/controlled-recovery
      - release/consolidated-recovery-20260717
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Migrations, integrity, typecheck, lint, tests, build, and authenticated isolation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_ci
          POSTGRES_DB: hope_tender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_ci -d hope_tender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://hope_ci@127.0.0.1:5432/hope_tender_ci?schema=public"
      SESSION_SECRET: "ci-session-${{ github.run_id }}-${{ github.sha }}"
      NEXTAUTH_SECRET: "ci-nextauth-${{ github.run_id }}-${{ github.sha }}"
      GEMINI_API_KEY: "ci-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"
      REQUIRE_MIGRATION_HISTORY: "true"
      E2E_FULL_AUTH: "true"
      E2E_SEED_ALLOWED: "true"
      E2E_TEST_EMAIL: "e2e-primary@example.test"
      E2E_TEST_PASSWORD: "CiPrimary-${{ github.run_id }}-A9!secure"
      E2E_SECOND_EMAIL: "e2e-secondary@example.test"
      E2E_SECOND_PASSWORD: "CiSecondary-${{ github.run_id }}-B8!secure"
      EVIDENCE_SOURCE_SHA: "${{ github.event.pull_request.head.sha || github.sha }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Mask isolated authentication fixtures
        shell: bash
        run: |
          echo "::add-mask::$E2E_TEST_EMAIL"
          echo "::add-mask::$E2E_TEST_PASSWORD"
          echo "::add-mask::$E2E_SECOND_EMAIL"
          echo "::add-mask::$E2E_SECOND_PASSWORD"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize exact-head command evidence
        shell: bash
        run: |
          mkdir -p test-results build-results browser-results
          rm -f test-results/command-ledger.ndjson

      - name: Reject install-time source mutation
        run: >-
          node scripts/run-evidence-command.mjs
          --name reject-install-source-mutation
          --log test-results/reject-install-source-mutation.log
          --
          git diff --exit-code

      - name: Validate Prisma schema
        run: >-
          node scripts/run-evidence-command.mjs
          --name prisma-validate
          --log test-results/prisma-validate.log
          --
          npx prisma validate

      - name: Generate Prisma client
        run: >-
          node scripts/run-evidence-command.mjs
          --name prisma-generate
          --log test-results/prisma-generate.log
          --
          npx prisma generate

      - name: Deploy complete migration history
        run: >-
          node scripts/run-evidence-command.mjs
          --name migrate-deploy
          --log test-results/migrate-deploy.log
          --
          npx prisma migrate deploy

      - name: Verify critical migrated schema
        run: >-
          node scripts/run-evidence-command.mjs
          --name critical-schema
          --log test-results/critical-schema.log
          --
          npm run db:check-critical-schema

      - name: Verify retroactive initialization structure and history
        run: >-
          node scripts/run-evidence-command.mjs
          --name retroactive-init
          --log test-results/retroactive-init.log
          --
          npm run db:verify-retroactive-init

      - name: Verify migration idempotency
        run: >-
          node scripts/run-evidence-command.mjs
          --name migrate-idempotency
          --log test-results/migrate-idempotency.log
          --
          npx prisma migrate deploy

      - name: Verify Prisma zero drift
        run: >-
          node scripts/run-evidence-command.mjs
          --name prisma-zero-drift
          --log test-results/prisma-zero-drift.log
          --
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Audit release integrity
        run: >-
          node scripts/run-evidence-command.mjs
          --name release-integrity
          --log test-results/release-integrity-audit.log
          --
          npm run audit:release-integrity

      - name: Typecheck
        run: >-
          node scripts/run-evidence-command.mjs
          --name typecheck
          --log test-results/typecheck.log
          --
          npm run typecheck

      - name: Lint
        run: >-
          node scripts/run-evidence-command.mjs
          --name lint
          --log test-results/lint.log
          --
          npm run lint

      - name: Unit and database integration tests
        run: >-
          node scripts/run-evidence-command.mjs
          --name unit-database-tests
          --log test-results/npm-test.log
          --
          npm test

      - name: Build
        run: >-
          node scripts/run-evidence-command.mjs
          --name build
          --log build-results/npm-build.log
          --
          npm run build

      - name: Reject build-time source mutation
        run: >-
          node scripts/run-evidence-command.mjs
          --name reject-build-source-mutation
          --log test-results/reject-build-source-mutation.log
          --
          git diff --exit-code

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed isolated two-user browser fixtures
        run: node scripts/seed-e2e-user.mjs

      - name: Browser smoke, authenticated intake, golden workflow, and cross-user isolation
        env:
          CSRF_MODE: "origin"
          CSRF_STRICT_DEV: "true"
          MISTRAL_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          E2E_GOLDEN_AUTH: "true"
          SMOKE_TEST_EMAIL: ${{ env.E2E_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
        run: >-
          node scripts/run-evidence-command.mjs
          --name playwright
          --log browser-results/playwright.log
          --
          npm run test:e2e

      - name: Reject test-time source mutation
        if: always()
        run: >-
          node scripts/run-evidence-command.mjs
          --name reject-test-source-mutation
          --log test-results/reject-test-source-mutation.log
          --
          git diff --exit-code

      - name: Verify exact-head evidence completeness
        if: success()
        run: node scripts/verify-ci-evidence.mjs

      - name: Upload credential-free exact-head acceptance evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exact-head-acceptance-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            acceptance-evidence/
            build-results/
            test-results/
            browser-results/
          if-no-files-found: error
          retention-days: 14

      - name: Upload non-browser diagnostics and exact critical sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            test-results/
            browser-results/
            playwright-report/
            acceptance-evidence/
            build-results/
            prisma/schema.prisma
            prisma/migrations/
            lib/ai-job-handlers.ts
            lib/ai.ts
            lib/engine/final-package-readiness-model.ts
            lib/engine/public-readiness-envelope.ts
          if-no-files-found: error
          retention-days: 7
