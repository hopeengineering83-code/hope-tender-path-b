name: CI

on:
  pull_request:
    branches:
      - main
      - integration/controlled-recovery
      - release/consolidated-recovery-20260717
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  push:
    branches:
      - main
      - integration/controlled-recovery
      - release/consolidated-recovery-20260717
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Migrations, integrity, typecheck, lint, tests, build, and authenticated isolation
    runs-on: ubuntu-latest
    timeout-minutes: 55
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_ci
          POSTGRES_DB: hope_tender_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_ci -d hope_tender_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://hope_ci@127.0.0.1:5432/hope_tender_ci?schema=public"
      SESSION_SECRET: "ci-session-${{ github.run_id }}-${{ github.sha }}"
      NEXTAUTH_SECRET: "ci-nextauth-${{ github.run_id }}-${{ github.sha }}"
      GEMINI_API_KEY: "ci-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"
      REQUIRE_MIGRATION_HISTORY: "true"
      E2E_FULL_AUTH: "true"
      E2E_SEED_ALLOWED: "true"
      E2E_TEST_EMAIL: "e2e-primary@example.test"
      E2E_TEST_PASSWORD: "CiPrimary-${{ github.run_id }}-A9!secure"
      E2E_SECOND_EMAIL: "e2e-secondary@example.test"
      E2E_SECOND_PASSWORD: "CiSecondary-${{ github.run_id }}-B8!secure"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject install-time source mutation
        run: git diff --exit-code

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy complete migration history
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npx prisma migrate deploy 2>&1 | tee test-results/migrate-deploy.log

      - name: Verify critical migrated schema
        run: npm run db:check-critical-schema

      - name: Verify retroactive initialization structure and history
        run: npm run db:verify-retroactive-init

      - name: Verify migration idempotency
        shell: bash
        run: |
          set -o pipefail
          npx prisma migrate deploy 2>&1 | tee test-results/migrate-idempotency.log

      - name: Verify Prisma zero drift
        shell: bash
        run: |
          set -o pipefail
          npx prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code 2>&1 | tee test-results/prisma-zero-drift.log

      - name: Audit release integrity
        shell: bash
        run: |
          set -o pipefail
          npm run audit:release-integrity 2>&1 | tee test-results/release-integrity-audit.log

      - name: Typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee test-results/typecheck.log

      - name: Lint
        run: npm run lint

      - name: Unit and database integration tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-results/npm-test.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build-results
          npm run build 2>&1 | tee build-results/npm-build.log

      - name: Reject build-time source mutation
        run: git diff --exit-code

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Seed isolated two-user browser fixtures
        run: node scripts/seed-e2e-user.mjs

      - name: Browser smoke, authenticated intake, golden workflow, and cross-user isolation
        env:
          CSRF_MODE: "off"
          MISTRAL_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          E2E_GOLDEN_AUTH: "true"
          SMOKE_TEST_EMAIL: ${{ env.E2E_TEST_EMAIL }}
          SMOKE_TEST_PASSWORD: ${{ env.E2E_TEST_PASSWORD }}
        run: npm run test:e2e

      - name: Reject test-time source mutation
        if: always()
        run: git diff --exit-code

      - name: Upload diagnostics and exact critical sources on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            test-results/
            build-results/
            playwright-report/
            test-results-e2e/
            prisma/schema.prisma
            prisma/migrations/
            lib/ai-job-handlers.ts
            lib/ai.ts
            lib/engine/final-package-readiness-model.ts
            lib/engine/public-readiness-envelope.ts
          if-no-files-found: error
          retention-days: 7

  validate-proposal-fallback-repair:
    name: Validate mixed-fallback zero-write repair
    if: >-
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1175 &&
      github.event.pull_request.head.ref == 'release/consolidated-recovery-20260717'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused?schema=public
      SESSION_SECRET: validation-only-session-secret
      GEMINI_API_KEY: validation-placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidated-recovery-20260717
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Capture existing TypeScript debt
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-before.log 2>&1
          status=$?
          set -e
          echo "$status" > /tmp/typecheck-before.status
          grep -c "error TS" /tmp/typecheck-before.log > /tmp/typecheck-before.count || echo 0 > /tmp/typecheck-before.count

      - name: Apply exact mixed-fallback repair
        shell: bash
        run: |
          set -euo pipefail
          if grep -Fq 'if (sectionResult.anyFallback)' lib/ai-job-handlers.ts \
            && grep -Fq 'AI_PROPOSAL_MIXED_FALLBACK_BLOCKED' lib/ai-job-handlers.ts \
            && test -f tests/proposal-mixed-fallback-zero-write.test.ts; then
            echo "The exact mixed-fallback zero-write repair is already present; validation remains required."
          else
            python3 scripts/enforce-zero-write-proposal-fallback.py
          fi

      - name: Run focused zero-write regression
        run: npx tsx --test tests/proposal-mixed-fallback-zero-write.test.ts

      - name: Prove repair introduces no TypeScript regression
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck-after.log 2>&1
          status=$?
          set -e
          before_count=$(cat /tmp/typecheck-before.count)
          after_count=$(grep -c "error TS" /tmp/typecheck-after.log || true)
          echo "Existing TypeScript errors: $before_count; repaired tree errors: $after_count"
          if grep -F "lib/ai-job-handlers.ts" /tmp/typecheck-after.log; then
            echo "The repaired handler has a TypeScript diagnostic"
            cat /tmp/typecheck-after.log
            exit 1
          fi
          if [ "$after_count" -gt "$before_count" ]; then
            echo "The repair introduced additional TypeScript errors"
            diff -u /tmp/typecheck-before.log /tmp/typecheck-after.log || true
            exit 1
          fi
          if [ "$(cat /tmp/typecheck-before.status)" -eq 0 ] && [ "$status" -ne 0 ]; then
            echo "A previously clean tree became type-invalid"
            cat /tmp/typecheck-after.log
            exit 1
          fi

      - name: Commit validated repair to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          git add lib/ai-job-handlers.ts tests/proposal-mixed-fallback-zero-write.test.ts
          if git diff --cached --quiet; then
            echo "No repair diff remains; exact-head files already contain the validated zero-write rule."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ai): block mixed fallback before proposal persistence"
          git push --force origin HEAD:refs/heads/automation/consolidation-proposal-fallback-validated

      - name: Upload repair diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: proposal-fallback-repair-diagnostics
          path: |
            lib/ai-job-handlers.ts
            tests/proposal-mixed-fallback-zero-write.test.ts
            /tmp/typecheck-before.log
            /tmp/typecheck-after.log
          if-no-files-found: error
          retention-days: 7

  incorporate-open-pr-donors:
    name: Validate and preserve every open PR donor
    needs: validate-proposal-fallback-repair
    if: >-
      always() &&
      needs.validate-proposal-fallback-repair.result == 'success' &&
      github.actor != 'github-actions[bot]' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.number == 1175 &&
      github.event.pull_request.head.ref == 'release/consolidated-recovery-20260717'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR_1188_SHA: e36638a4b93843f461063acaf3eb6a1b71cc1dea
      PR_1157_SHA: 3c5a9611fca142f7e18e2a83d196016627a15596
      PR_1130_SHA: 26e351f2ce3b10a06d778819ecc3eefae1215125
      PR_1128_SHA: a7e0d31aab3c03a5757b766b2abe6fdbc1fee010
      TARGET_BRANCH: release/consolidated-recovery-20260717
      OUTPUT_BRANCH: automation/open-pr-incorporation-validated
      DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused?schema=public
      SESSION_SECRET: donor-validation-session-secret
      GEMINI_API_KEY: donor-validation-placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact consolidation branch
        uses: actions/checkout@v4
        with:
          ref: release/consolidated-recovery-20260717
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git and fetch exact donor heads
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin \
            "$PR_1188_SHA" \
            "$PR_1157_SHA" \
            "$PR_1130_SHA" \
            "$PR_1128_SHA"
          git rev-parse HEAD | tee /tmp/consolidation-start-sha
          for sha in "$PR_1188_SHA" "$PR_1157_SHA" "$PR_1130_SHA" "$PR_1128_SHA"; do
            git cat-file -e "${sha}^{commit}"
          done

      - name: Incorporate PR 1188 application fix
        shell: bash
        run: |
          set -euo pipefail
          if grep -q 'confirmedBuildPlan.ok && plannedDocs.length > 0' components/tender-health-score-panel.tsx \
            && grep -q 'Spec Test 16' tests/release-snapshot-panel-truth.test.ts; then
            echo "PR #1188 is already present."
          else
            git cherry-pick --no-commit "$PR_1188_SHA"
          fi
          grep -q 'getCurrentConfirmedBuildPlan' components/tender-health-score-panel.tsx
          grep -q 'confirmedBuildPlan.ok && plannedDocs.length > 0' components/tender-health-score-panel.tsx
          grep -q 'Spec Test 16' tests/release-snapshot-panel-truth.test.ts

      - name: Verify and preserve PR 1157 and duplicate PR 1180
        shell: bash
        run: |
          set -euo pipefail
          test -f lib/engine/public-readiness-envelope.ts
          grep -q 'buildPublicReadinessEnvelope' lib/engine/public-readiness-envelope.ts
          grep -q 'NO_CONFIRMED_BUILD_PLAN' lib/engine/final-package-readiness-model.ts
          grep -q 'buildPlan' lib/engine/final-package-readiness-model.ts
          grep -q 'getFinalPackageReadinessModel' app/api/tenders/\[id\]/generation-readiness/route.ts
          grep -q 'buildPublicReadinessEnvelope' app/api/tenders/\[id\]/export-readiness/route.ts
          grep -q 'getFinalPackageReadinessModel' app/api/tenders/\[id\]/authority-review/route.ts
          mkdir -p docs/release/donor-snapshots/pr-1157
          git show --format=email --binary "$PR_1157_SHA" > docs/release/donor-snapshots/pr-1157/commit.patch
          git show "$PR_1157_SHA:docs/audits/pr-1128-route-truth-audit.md" > docs/release/donor-snapshots/pr-1157/pr-1128-route-truth-audit.md
          git show "$PR_1157_SHA:operator_handoff.md" > docs/release/donor-snapshots/pr-1157/operator_handoff.md
          for test_path in \
            tests/final-package-readiness-model.test.ts \
            tests/route-driven-workflow-truth-verification.test.ts; do
            temp_path="tests/open-pr-1157-$(basename "$test_path")"
            git show "$PR_1157_SHA:$test_path" > "$temp_path"
          done

      - name: Preserve PR 1130 control-plane code without activation
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            tmp="$(mktemp)"
            git show "$PR_1130_SHA:$path" > "$tmp"
            dest="$path"
            if [ -f "$dest" ] && ! cmp -s "$tmp" "$dest"; then
              rel="${path#.github/}"
              dest=".github/release-control/donor-overrides/pr-1130/$rel"
            fi
            mkdir -p "$(dirname "$dest")"
            mv "$tmp" "$dest"
          done < <(git ls-tree -r --name-only "$PR_1130_SHA" -- .github/agents .github/release-control)
          find .github/release-control -type f -name '*.sh' -exec chmod +x {} +

          mkdir -p .github/release-control/dormant-workflows
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            name="$(basename "$path")"
            git show "$PR_1130_SHA:$path" > ".github/release-control/dormant-workflows/pr-1130-${name}.disabled"
          done < <(git ls-tree -r --name-only "$PR_1130_SHA" -- .github/workflows)

          cat > .github/release-control/dormant-workflows/README.md <<'EOF'
# Dormant donor workflows

These definitions were extracted from still-open PR #1130 without activation. The `.disabled` suffix prevents GitHub Actions execution. They cannot dispatch workers, integrate branches, merge, deploy, or run migrations from PR #1175.
EOF

      - name: Preserve PR 1128 screenshot capture code safely
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts .github/release-control/dormant-workflows
          tmp="$(mktemp)"
          git show "$PR_1128_SHA:scripts/capture-production-pages.mjs" > "$tmp"
          if [ -f scripts/capture-production-pages.mjs ] && ! cmp -s "$tmp" scripts/capture-production-pages.mjs; then
            mv "$tmp" scripts/capture-production-pages.pr-1128.mjs
          else
            mv "$tmp" scripts/capture-production-pages.mjs
          fi
          git show "$PR_1128_SHA:.github/workflows/temporary-app-screenshot-capture.yml" \
            > .github/release-control/dormant-workflows/pr-1128-temporary-app-screenshot-capture.yml.disabled

      - name: Write exact donor incorporation ledger
        shell: bash
        run: |
          set -euo pipefail
          start_sha="$(cat /tmp/consolidation-start-sha)"
          mkdir -p docs/release
          cat > docs/release/open-pr-incorporation-20260717.md <<EOF
# Open PR donor incorporation ledger

Target: PR #1175, branch \`$TARGET_BRANCH\`
Starting consolidation SHA: \`$start_sha\`

No open donor PR was closed, merged, approved, or marked ready during extraction.

## PR #1188

- SHA: \`$PR_1188_SHA\`
- Confirmed Build Plan truth was applied to the Tender Health Submission Plan dimension with its regression test.

## PR #1157 and PR #1180

- Shared SHA: \`$PR_1157_SHA\`
- Current runtime contains the canonical final-package model and public readiness envelope. The exact donor patch and handoff evidence are preserved under \`docs/release/donor-snapshots/pr-1157/\`.
- PR #1180 is the same donor SHA and was not duplicated.

## PR #1130

- SHA: \`$PR_1130_SHA\`
- Agent contracts, release-control schemas, scripts, and tests were preserved. Donor workflows are stored with a \`.disabled\` suffix and were not activated.

## PR #1128

- SHA: \`$PR_1128_SHA\`
- The screenshot capture script was preserved. Its production-targeting workflow remains dormant.
EOF

      - name: Install dependencies and validate donor contracts
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npx prisma generate
          npm run typecheck
          npm run lint
          npx tsx --test \
            tests/release-snapshot-panel-truth.test.ts \
            tests/open-pr-1157-final-package-readiness-model.test.ts \
            tests/open-pr-1157-route-driven-workflow-truth-verification.test.ts

      - name: Remove temporary validation and workflow files
        shell: bash
        run: |
          set -euo pipefail
          rm -f tests/open-pr-1157-final-package-readiness-model.test.ts
          rm -f tests/open-pr-1157-route-driven-workflow-truth-verification.test.ts
          rm -f .github/workflows/incorporate-open-pr-donors.yml
          git checkout HEAD^ -- .github/workflows/ci.yml

      - name: Commit isolated validated candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "No donor changes remained after verification."
            exit 1
          fi
          git commit -m "release: incorporate important code from every open PR donor"
          git push --force-with-lease origin "HEAD:refs/heads/$OUTPUT_BRANCH"

      - name: Upload donor diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: open-pr-donor-incorporation-diagnostics
          path: |
            docs/release/open-pr-incorporation-20260717.md
            docs/release/donor-snapshots/
            .github/release-control/
            components/tender-health-score-panel.tsx
            tests/release-snapshot-panel-truth.test.ts
          if-no-files-found: warn
          retention-days: 7
