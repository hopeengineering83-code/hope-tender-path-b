name: Agent Dispatcher

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        required: true
      agent:
        required: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: agent-dispatch-${{ github.event.issue.number || inputs.issue_number || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve, authorize, and record dispatch
        uses: actions/github-script@v7
        with:
          script: |
            const allowedAgents = new Set([
              'glm',
              'chatgpt-code',
              'jules',
              'codex',
              'claude-code',
              'chatgpt-review'
            ]);
            let issueNumber;
            let agent;
            let actor = context.actor;

            if (context.eventName === 'issue_comment') {
              if (context.payload.comment.user.type === 'Bot') throw new Error('Bot dispatch commands are rejected.');
              const match = context.payload.comment.body.match(/^\/dispatch\s+(glm|chatgpt-code|jules|codex|claude-code|chatgpt-review)\s*$/);
              if (!match) throw new Error('Unsupported dispatch command.');
              issueNumber = context.payload.issue.number;
              agent = match[1];
            } else if (context.eventName === 'issues') {
              issueNumber = context.payload.issue.number;
              const label = context.payload.label.name;
              if (!label.startsWith('agent:')) throw new Error('Not an agent label.');
              agent = label.slice('agent:'.length);
              actor = context.payload.sender.login;
            } else {
              issueNumber = Number('${{ inputs.issue_number }}');
              agent = '${{ inputs.agent }}';
            }

            if (!Number.isInteger(issueNumber) || !allowedAgents.has(agent)) throw new Error('Invalid dispatch target.');
            const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: actor
            });
            if (!['admin','maintain','write'].includes(permission.permission)) throw new Error(`@${actor} is not authorized.`);

            const marker = `<!-- control-tower-dispatch:${issueNumber}:${agent} -->`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100
            });
            if (comments.some(c => c.body?.includes(marker) && /WORKING|PR_OPENED|WAITING_FOR_TOOL|WAITING_FOR_[A-Z_]+/.test(c.body))) {
              core.notice('Existing active dispatch found.');
              return;
            }

            const states = {
              glm: 'WAITING_FOR_GLM_CHAT',
              'chatgpt-code': 'WAITING_FOR_CHATGPT_CODE_CHAT',
              jules: 'WAITING_FOR_JULES',
              codex: 'WAITING_FOR_CODEX_LIMIT_RESET',
              'claude-code': 'WAITING_FOR_CLAUDE_LIMIT_RESET',
              'chatgpt-review': 'WAITING_FOR_REVIEW_CHAT'
            };
            const state = states[agent] || 'WAITING_FOR_TOOL';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: [
                marker,
                `State: ${state}`,
                `Assigned tool: ${agent}`,
                `Target branch: integration/controlled-recovery`,
                `Instruction authority: this issue and its linked PR comments`,
                `Browser-session activation may require opening the assigned chat once.`,
                `Do not create a replacement PR, merge, approve, deploy, or run production migrations.`,
                `Update this issue with WORKING, PR_OPENED, REVISION_REQUIRED, ACCEPTED, or BLOCKED.`
              ].join('\n')
            });
