name: Execute open PR donor reconciliation

on:
  pull_request:
    branches:
      - release/consolidated-recovery-20260717
    paths:
      - .github/workflows/diagnose-open-pr-donors.yml

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: execute-open-pr-donors-20260724
  cancel-in-progress: false

jobs:
  execute:
    if: github.head_ref == 'consolidate/open-pr-donors-20260724'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Fetch exact donor heads
        run: |
          git fetch origin main
          git fetch origin +refs/pull/1249/head:refs/remotes/origin/pr-1249 +refs/pull/1251/head:refs/remotes/origin/pr-1251
      - name: Reconcile, validate, commit, and push
        run: bash scripts/reconcile-open-pr-donors.sh
