# Release Gate Suite
#
# The authoritative release-acceptance suite. Green CI alone is NOT sufficient
# to release. This suite must also pass. It is called by:
#   - release-auditor.yml (on push to main, as a release-readiness check)
#   - integration-controller.yml (on integration PR updates)
#
# This workflow is reusable via workflow_call. It does NOT run on its own
# triggers — callers must invoke it with inputs.
#
# What this suite checks (beyond standard CI):
#   1. All standard CI checks (migrations, typecheck, lint, tests, build)
#   2. Prisma schema validation + migration idempotency
#   3. Release-integrity audit (npm run audit:release-integrity)
#   4. Safe-API-errors audit (no raw errors in client responses)
#   5. No-user-facing-metadata audit
#   6. Workflow-state-consistency audit
#   7. Critical-schema verification
#   8. Retroactive-init verification
#   9. Findings schema validation (every JSON in .github/release-control/findings/)
#   10. Agent-contract compliance check
#   11. No-force-push-to-main check
#   12. No-auto-merge-config check
#   13. Playwright e2e + cross-user isolation
#
# If ANY step fails, the release-gate suite fails and the release is blocked.

name: Release Gate Suite

on:
  workflow_call:
    inputs:
      ref:
        description: "The ref (branch/SHA) to run the suite against."
        required: true
        type: string
      integration-mode:
        description: "Whether this is an integration-branch run (skips e2e if false)."
        required: false
        type: boolean
        default: false
    secrets:
      GH_PAT:
        description: "GitHub PAT for issue/PR operations (optional)."
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

concurrency:
  group: release-gate-${{ inputs.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release Gate Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_gate
          POSTGRES_DB: hope_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_gate -d hope_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://hope_gate@127.0.0.1:5432/hope_gate?schema=public"
      SESSION_SECRET: "gate-session-${{ github.run_id }}-${{ github.sha }}"
      NEXTAUTH_SECRET: "gate-nextauth-${{ github.run_id }}-${{ github.sha }}"
      GEMINI_API_KEY: "gate-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"
      REQUIRE_MIGRATION_HISTORY: "true"
      E2E_FULL_AUTH: "true"
      E2E_SEED_ALLOWED: "true"
      E2E_TEST_EMAIL: "gate-primary@example.test"
      E2E_TEST_PASSWORD: "GatePrimary-${{ github.run_id }}-A9!secure"
      E2E_SECOND_EMAIL: "gate-secondary@example.test"
      E2E_SECOND_PASSWORD: "GateSecondary-${{ github.run_id }}-B8!secure"

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject install-time source mutation
        run: git diff --exit-code

      # ── 1. Standard CI ────────────────────────────────────────────────────

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations
        run: npx prisma migrate deploy

      - name: Verify critical schema
        run: npm run db:check-critical-schema

      - name: Verify retroactive init
        run: npm run db:verify-retroactive-init

      - name: Verify migration idempotency
        run: npx prisma migrate deploy

      - name: Audit release integrity
        run: npm run audit:release-integrity

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit + DB integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Reject build-time source mutation
        run: git diff --exit-code

      # ── 2. Release-gate-specific audits ───────────────────────────────────

      - name: Safe-API-errors audit
        run: npm run audit:safe-api-errors

      - name: No-user-facing-metadata audit
        run: npm run audit:no-user-facing-metadata

      - name: Workflow-state-consistency audit
        run: npm run audit:workflow-state-consistency

      # ── 3. Findings schema validation ─────────────────────────────────────

      - name: Validate findings JSON files
        shell: bash
        run: |
          set -e
          if [ ! -d .github/release-control/findings ]; then
            echo "No findings directory — skipping."
            exit 0
          fi
          FINDINGS_COUNT=$(find .github/release-control/findings -name '*.json' | wc -l)
          echo "Validating $FINDINGS_COUNT finding(s)..."
          for f in .github/release-control/findings/*.json; do
            [ -f "$f" ] || continue
            echo "  validating: $f"
            npx ajv validate -s .github/release-control/findings.schema.json -d "$f" \
              || { echo "FAIL: $f does not conform to findings.schema.json"; exit 1; }
          done
          echo "All findings conform to schema."

      # ── 4. Agent-contract compliance ──────────────────────────────────────

      - name: Agent-contract compliance check
        shell: bash
        run: |
          set -e
          echo "Checking agent-contract files exist..."
          for f in .github/agents/app-contract.md .github/agents/worker-contract.md .github/agents/integrator-contract.md; do
            [ -f "$f" ] || { echo "FAIL: missing $f"; exit 1; }
            echo "  ✓ $f"
          done

          echo ""
          echo "Checking no workflow enables auto-merge..."
          # Skip release-gate.yml itself (it contains the pattern strings as detection logic).
          for f in .github/workflows/*.yml; do
            [ "$f" = ".github/workflows/release-gate.yml" ] && continue
            if grep -qE 'enablePullRequestAutoMerge|gh pr merge --auto|auto-merge: true' "$f"; then
              echo "FAIL: $f enables auto-merge"
              exit 1
            fi
          done
          echo "  ✓ No auto-merge configuration found."

          echo ""
          echo "Checking no workflow merges to main..."
          for f in .github/workflows/*.yml; do
            [ "$f" = ".github/workflows/release-gate.yml" ] && continue
            if grep -qE 'gh pr merge.* --base main|merge_method.*main' "$f"; then
              echo "FAIL: $f merges to main"
              exit 1
            fi
          done
          echo "  ✓ No main-merge commands found."

          echo ""
          echo "Checking no workflow deploys to production..."
          for f in .github/workflows/*.yml; do
            [ "$f" = ".github/workflows/release-gate.yml" ] && continue
            if grep -qE 'vercel deploy --prod|vercel --prod|deploymentEnabled.*true' "$f"; then
              echo "FAIL: $f deploys to production"
              exit 1
            fi
          done
          echo "  ✓ No production-deploy commands found."

      # ── 5. No-force-push-to-main check ────────────────────────────────────

      - name: No-force-push-to-main check
        shell: bash
        run: |
          set -e
          # This step verifies the workflow files do not contain force-push commands to main.
          for f in .github/workflows/*.yml; do
            if grep -qE 'git push --force.*main|git push -f.*main|git push --force-with-lease.*main' "$f"; then
              echo "FAIL: $f force-pushes to main"
              exit 1
            fi
          done
          echo "✓ No force-push to main in any workflow."

      # ── 6. Playwright e2e (skip in integration mode if requested) ─────────

      - name: Install Playwright browser
        if: ${{ inputs.integration-mode != true }}
        run: npx playwright install --with-deps chromium

      - name: Seed e2e fixtures
        if: ${{ inputs.integration-mode != true }}
        run: node scripts/seed-e2e-user.mjs

      - name: Browser smoke + cross-user isolation
        if: ${{ inputs.integration-mode != true }}
        env:
          CSRF_MODE: "off"
          MISTRAL_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: npm run test:e2e

      - name: Reject test-time source mutation
        if: always()
        run: git diff --exit-code

      # ── 7. Evidence upload ────────────────────────────────────────────────

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ inputs.ref }}-${{ github.run_id }}
          path: |
            test-results/
            build-results/
            playwright-report/
            test-results-e2e/
            .github/release-control/evidence/
          if-no-files-found: ignore
          retention-days: 14

  release-gate-verdict:
    name: Release Gate Verdict
    runs-on: ubuntu-latest
    needs: release-gate
    if: always()
    steps:
      - name: Emit verdict
        run: |
          echo "## Release Gate Suite Verdict" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.release-gate.result }}" = "success" ]; then
            echo "✅ **PASSED** — release-gate suite succeeded on ${{ inputs.ref }}." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Green CI + release-gate suite both pass. Release manager may review." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **FAILED** — release-gate suite failed on ${{ inputs.ref }}." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Result: ${{ needs.release-gate.result }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Release is blocked.** Green CI alone is NOT sufficient." >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
