# Release Gate Suite
#
# Authoritative release-acceptance suite. Green CI alone is not sufficient.
# This reusable workflow never merges, approves, deploys, or runs production
# migrations. Callers provide an immutable ref.

name: Release Gate Suite

on:
  workflow_call:
    inputs:
      ref:
        description: "The immutable branch/SHA to run the suite against."
        required: true
        type: string
      integration-mode:
        description: "When true, skip browser e2e in the reusable integration pass."
        required: false
        type: boolean
        default: false
    secrets:
      GH_PAT:
        description: "GitHub PAT for optional issue/PR operations."
        required: false

permissions:
  contents: read
  pull-requests: read
  checks: write
  actions: read

concurrency:
  group: release-gate-${{ inputs.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  release-gate:
    name: Release Gate Suite
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hope_gate
          POSTGRES_DB: hope_gate
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope_gate -d hope_gate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "postgresql://hope_gate@127.0.0.1:5432/hope_gate?schema=public"
      SESSION_SECRET: "gate-session-${{ github.run_id }}-${{ github.sha }}"
      NEXTAUTH_SECRET: "gate-nextauth-${{ github.run_id }}-${{ github.sha }}"
      GEMINI_API_KEY: "gate-provider-placeholder-not-used-at-runtime"
      ANTHROPIC_API_KEY: ""
      RUN_DB_INTEGRATION: "true"
      REQUIRE_MIGRATION_HISTORY: "true"
      E2E_FULL_AUTH: "true"
      E2E_SEED_ALLOWED: "true"
      E2E_TEST_EMAIL: "gate-primary@example.test"
      E2E_TEST_PASSWORD: "GatePrimary-${{ github.run_id }}-A9!secure"
      E2E_SECOND_EMAIL: "gate-secondary@example.test"
      E2E_SECOND_PASSWORD: "GateSecondary-${{ github.run_id }}-B8!secure"

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject install-time source mutation
        run: git diff --exit-code

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Deploy migrations to disposable PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify critical schema
        run: npm run db:check-critical-schema

      - name: Verify retroactive init
        run: npm run db:verify-retroactive-init

      - name: Verify migration idempotency
        run: npx prisma migrate deploy

      - name: Audit release integrity
        run: npm run audit:release-integrity

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit and PostgreSQL integration tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Reject build-time source mutation
        run: git diff --exit-code

      - name: Safe API errors audit
        run: npm run audit:safe-api-errors

      - name: No user-facing metadata audit
        run: npm run audit:no-user-facing-metadata

      - name: Workflow state consistency audit
        run: npm run audit:workflow-state-consistency

      - name: Agent contract compliance check
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking agent contract files..."
          for file in \
            .github/agents/app-contract.md \
            .github/agents/worker-contract.md \
            .github/agents/integrator-contract.md; do
            test -f "$file" || { echo "FAIL: missing $file"; exit 1; }
            echo "  verified: $file"
          done

          echo "Checking workflows for automatic merge outside detection workflows..."
          for file in .github/workflows/*.yml; do
            case "$file" in
              .github/workflows/release-gate.yml|.github/workflows/control-tower-ci.yml)
                continue
                ;;
            esac
            if grep -qE 'enablePullRequestAutoMerge|gh pr merge --auto|auto-merge: true' "$file"; then
              echo "FAIL: $file enables automatic merge"
              exit 1
            fi
          done

          echo "Checking workflows for main-merge commands..."
          for file in .github/workflows/*.yml; do
            case "$file" in
              .github/workflows/release-gate.yml|.github/workflows/control-tower-ci.yml)
                continue
                ;;
            esac
            if grep -qE 'gh pr merge.* --base main|merge_method.*main' "$file"; then
              echo "FAIL: $file merges to main"
              exit 1
            fi
          done

          echo "Checking workflows for production deployment commands..."
          for file in .github/workflows/*.yml; do
            case "$file" in
              .github/workflows/release-gate.yml|.github/workflows/control-tower-ci.yml)
                continue
                ;;
            esac
            if grep -qE 'vercel deploy --prod|vercel --prod|deploymentEnabled.*true' "$file"; then
              echo "FAIL: $file deploys to production"
              exit 1
            fi
          done

      - name: No force push to main check
        shell: bash
        run: |
          set -euo pipefail
          for file in .github/workflows/*.yml; do
            if grep -qE 'git push --force.*main|git push -f.*main|git push --force-with-lease.*main' "$file"; then
              echo "FAIL: $file force-pushes to main"
              exit 1
            fi
          done
          echo "No force-push to main found."

      - name: Install Playwright browser
        if: ${{ inputs.integration-mode != true }}
        run: npx playwright install --with-deps chromium

      - name: Seed e2e fixtures
        if: ${{ inputs.integration-mode != true }}
        run: node scripts/seed-e2e-user.mjs

      - name: Browser smoke and cross-user isolation
        if: ${{ inputs.integration-mode != true }}
        env:
          CSRF_MODE: "off"
          MISTRAL_API_KEY: ""
          GROQ_API_KEY: ""
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          TOGETHER_API_KEY: ""
          DEEPSEEK_API_KEY: ""
        run: npm run test:e2e

      - name: Reject test-time source mutation
        if: always()
        run: git diff --exit-code

      - name: Upload release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-evidence-${{ inputs.ref }}-${{ github.run_id }}
          path: |
            test-results/
            build-results/
            playwright-report/
            test-results-e2e/
            .github/release-control/evidence/
          if-no-files-found: ignore
          retention-days: 14

  release-gate-verdict:
    name: Release Gate Verdict
    runs-on: ubuntu-latest
    needs: release-gate
    if: always()
    steps:
      - name: Emit verdict
        env:
          RELEASE_RESULT: ${{ needs.release-gate.result }}
          TARGET_REF: ${{ inputs.ref }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Release Gate Suite Verdict"
            echo ""
            if [ "$RELEASE_RESULT" = "success" ]; then
              echo "PASSED — release-gate suite succeeded on $TARGET_REF."
              echo ""
              echo "Green CI and release-gate suite both pass. Release manager may review."
            else
              echo "FAILED — release-gate suite failed on $TARGET_REF."
              echo ""
              echo "Result: $RELEASE_RESULT"
              echo ""
              echo "Release is blocked. Green CI alone is not sufficient."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          test "$RELEASE_RESULT" = "success"
