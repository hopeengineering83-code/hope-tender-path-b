# CodeQL SAST Analysis
#
# Runs GitHub's CodeQL static analysis on every PR and on a weekly schedule.
# Free for public repositories. Scans TypeScript/JavaScript for security
# vulnerabilities (OWASP Top 10, injection, path traversal, etc.).
#
# Addresses audit gap: GAP-SEC-10

name: "CodeQL"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly scan on Sunday 03:00 UTC
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # required to upload CodeQL results

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Use the default security-and-quality query suite for JS/TS.
          # This covers OWASP Top 10, CWE, and code-quality issues.
          queries: security-and-quality

      - name: Autobuild
        # CodeQL's autobuild attempts to build the project automatically.
        # If it fails, replace with explicit build steps.
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          # Upload results to GitHub Security tab
          output: sarif-results

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: sarif-results
