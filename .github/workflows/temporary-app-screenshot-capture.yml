name: Temporary app screenshot capture

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/capture-production-pages.mjs"
      - ".github/workflows/temporary-app-screenshot-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCREENSHOT_BASE_URL: https://hope-tender-path-1houe0m3i-hopeengineering83-codes-projects.vercel.app
      SCREENSHOT_TEST_EMAIL: ${{ secrets.SCREENSHOT_TEST_EMAIL }}
      SCREENSHOT_TEST_PASSWORD: ${{ secrets.SCREENSHOT_TEST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify screenshot credentials exist
        shell: bash
        run: |
          test -n "$SCREENSHOT_TEST_EMAIL"
          test -n "$SCREENSHOT_TEST_PASSWORD"

      - name: Capture all reachable app pages
        run: node scripts/capture-production-pages.mjs

      - name: Upload screenshot package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hope-tender-app-screenshots
          path: artifacts/app-screenshots
          if-no-files-found: error
          retention-days: 3
