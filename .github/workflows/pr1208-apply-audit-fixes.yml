name: PR 1208 apply audited fixes

on:
  push:
    branches:
      - fix/pr1175-dead-broken-overlap-audit
  pull_request:
    branches:
      - release/consolidated-recovery-20260717

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/pr1175-dead-broken-overlap-audit
          fetch-depth: 0

      - name: Export and reconstruct checksum-guarded patch
        id: reconstruct
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pr1208-diagnostics/variants
          cp -R .github/pr1208-patch /tmp/pr1208-diagnostics/server-parts
          python <<'PY'
          from pathlib import Path
          import hashlib
          import itertools

          root = Path('.github/pr1208-patch')
          out = Path('/tmp/pr1208-diagnostics')
          parts = [(root / f'plain-{index:02d}.patch').read_bytes() for index in range(5)]
          expected_digest = '3b0d1fe26f866e178bf1b181124fedfe4e44be945f19a8556cc0e84c7915d9e8'
          manifest = []
          found = False

          for trim_flags in itertools.product((False, True), repeat=len(parts)):
              chunks = []
              valid = True
              for data, trim in zip(parts, trim_flags):
                  if trim:
                      if not data.endswith(b'\n'):
                          valid = False
                          break
                      data = data[:-1]
                  chunks.append(data)
              if not valid:
                  continue
              patch = b''.join(chunks)
              digest = hashlib.sha256(patch).hexdigest()
              name = ''.join('1' if flag else '0' for flag in trim_flags)
              (out / 'variants' / f'{name}-{digest}.patch').write_bytes(patch)
              manifest.append(f'{name} {len(patch)} {digest}')
              if digest == expected_digest:
                  Path('/tmp/pr1208-product.patch').write_bytes(patch)
                  found = True

          (out / 'manifest.txt').write_text('\n'.join(manifest) + '\n')
          (out / 'part-manifest.txt').write_text('\n'.join(
              f'{index} {len(data)} {hashlib.sha256(data).hexdigest()}'
              for index, data in enumerate(parts)
          ) + '\n')
          Path('/tmp/pr1208-valid').write_text('yes\n' if found else 'no\n')
          print((out / 'part-manifest.txt').read_text())
          print(f'checksum_match={found}')
          PY

      - name: Upload reconstruction diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr1208-patch-transport-${{ github.sha }}
          path: /tmp/pr1208-diagnostics
          if-no-files-found: error
          retention-days: 3

      - name: Require exact audited checksum
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat /tmp/pr1208-valid)" = "yes"

      - name: Apply product fixes and remove temporary transport files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/pr1208-product.patch
          git apply /tmp/pr1208-product.patch
          rm -rf .github/pr1208-patch
          rm -f .github/workflows/pr1208-apply-audit-fixes.yml
          git diff --check

      - name: Commit audited product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PR 1208 Audit Worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove dead broken and overlapping PR 1175 code"
          git push origin HEAD:fix/pr1175-dead-broken-overlap-audit
