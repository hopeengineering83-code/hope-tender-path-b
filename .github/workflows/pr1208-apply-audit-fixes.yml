name: PR 1208 apply audited fixes

on:
  push:
    branches:
      - fix/pr1175-dead-broken-overlap-audit
  pull_request:
    branches:
      - release/consolidated-recovery-20260717

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout audit branch
        uses: actions/checkout@v4
        with:
          ref: fix/pr1175-dead-broken-overlap-audit
          fetch-depth: 0

      - name: Reconstruct checksum-guarded patch
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import hashlib

          root = Path('.github/pr1208-patch')
          expected_sizes = [16000, 16000, 16000, 16000, 15013]
          chunks = []
          for index, expected in enumerate(expected_sizes):
              path = root / f'plain-{index:02d}.patch'
              data = path.read_bytes()
              if len(data) == expected + 1 and data.endswith(b'\n'):
                  data = data[:-1]
              if len(data) != expected:
                  raise SystemExit(f'{path}: expected {expected} bytes, found {len(data)}')
              chunks.append(data)

          patch = b''.join(chunks)
          digest = hashlib.sha256(patch).hexdigest()
          expected_digest = '3b0d1fe26f866e178bf1b181124fedfe4e44be945f19a8556cc0e84c7915d9e8'
          if digest != expected_digest:
              raise SystemExit(f'patch checksum mismatch: {digest} != {expected_digest}')
          Path('/tmp/pr1208-product.patch').write_bytes(patch)
          print(f'patch bytes={len(patch)} sha256={digest}')
          PY

      - name: Apply product fixes and remove temporary transport files
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/pr1208-product.patch
          git apply /tmp/pr1208-product.patch
          rm -rf .github/pr1208-patch
          rm -f .github/workflows/pr1208-apply-audit-fixes.yml
          git diff --check

      - name: Commit audited product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PR 1208 Audit Worker"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove dead broken and overlapping PR 1175 code"
          git push origin HEAD:fix/pr1175-dead-broken-overlap-audit
