name: Move PDF ownership check before readiness

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/cross-tenant-supplied-id-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Move nested ownership resolution before readiness gates
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/tenders/[id]/finalize-pdf/route.ts')
          s = p.read_text()

          early_anchor = '''    if (!tender) return err("Tender not found", 404, { code: "TENDER_NOT_FOUND" });

              // Central authoritative gate'''
          early_replacement = '''    if (!tender) return err("Tender not found", 404, { code: "TENDER_NOT_FOUND" });

              const activeDocs = tender.generatedDocuments.filter((document: any) =>
                isFinalExportCandidateDocument(document),
              );
              // Resolve an explicitly supplied nested ID before exposing any tender
              // readiness state. Foreign and nonexistent IDs are indistinguishable.
              if (docId && !activeDocs.some((document: any) => document.id === docId)) {
                return err("Source document not found", 404, { code: "PDF_SOURCE_NOT_FOUND" });
              }

              // Central authoritative gate'''
          if early_anchor not in s:
              raise SystemExit('early tender anchor not found')
          s = s.replace(early_anchor, early_replacement, 1)

          late_block = '''    const activeDocs = tender.generatedDocuments.filter((d: any) => isFinalExportCandidateDocument(d));
              // Explicit document IDs are scoped to the already owner-filtered tender.
              // Return the same non-enumerating 404 for nonexistent and foreign IDs.
              if (docId && !activeDocs.some((document: any) => document.id === docId)) {
                return err("Source document not found", 404, { code: "PDF_SOURCE_NOT_FOUND" });
              }
              // A required PDF counts as satisfied only when the row's REAL bytes carry'''
          late_replacement = '''    // A required PDF counts as satisfied only when the row's REAL bytes carry'''
          if late_block not in s:
              raise SystemExit('late ownership block not found')
          s = s.replace(late_block, late_replacement, 1)

          gate_pos = s.find('const gate = await assertTenderReadyForGenerationAndExport')
          ownership_pos = s.find('code: "PDF_SOURCE_NOT_FOUND"')
          if ownership_pos < 0 or gate_pos < 0 or ownership_pos > gate_pos:
              raise SystemExit('ownership check is not before readiness gate')
          if s.count('const activeDocs =') != 1:
              raise SystemExit('activeDocs declaration count is not one')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/tenders/[id]/finalize-pdf/route.ts
          git commit -m "fix: resolve supplied PDF source ownership before readiness"
          git push origin HEAD:${{ github.head_ref }}
