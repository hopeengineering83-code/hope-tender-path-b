name: Temporary install repository-derived screenshot coverage

on:
  pull_request:
    branches: [integration/controlled-recovery]
    paths:
      - ".github/workflows/temporary-install-route-coverage.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-route-coverage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Install route coverage contract
        shell: python
        run: |
          from pathlib import Path

          path = Path("scripts/capture-production-pages.mjs")
          source = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global source
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              source = source.replace(old, new, 1)

          replace_once(
              'import path from "node:path";\n',
              'import path from "node:path";\nimport { coverageForManifest, discoverPageManifest } from "./screenshot-route-manifest.mjs";\n',
              "route manifest import",
          )

          old_routes = '''const publicRoutes = ["/", "/login", "/forgot-password", "/offline"];
          const authenticatedSeeds = [
            "/dashboard",
            "/dashboard/tenders",
            "/dashboard/tenders/new",
            "/dashboard/company",
            "/dashboard/company/documents",
            "/dashboard/company/readiness",
            "/dashboard/company/plan-b-import",
            "/dashboard/company/review",
            "/dashboard/company/review-board",
            "/dashboard/analysis",
            "/dashboard/matching",
            "/dashboard/history",
            "/dashboard/analytics",
            "/dashboard/export",
            "/dashboard/settings",
            "/dashboard/admin",
          ];'''
          new_routes = '''const routeManifest = await discoverPageManifest({
            appRoot: path.resolve("app"),
            fixtures: {
              primaryTenderId: process.env.SCREENSHOT_PRIMARY_TENDER_ID || "11111111-1111-4111-8111-111111111111",
              primaryDocumentId: process.env.SCREENSHOT_PRIMARY_DOCUMENT_ID || "55555555-5555-4555-8555-555555555555",
              primaryFileId: process.env.SCREENSHOT_PRIMARY_FILE_ID || "66666666-6666-4666-8666-666666666666",
            },
          });
          if (routeManifest.length === 0) throw new Error("No app page routes were discovered from app/**/page.*");

          const publicRoutes = Array.from(new Set(routeManifest
            .filter((entry) => !entry.authenticated && entry.representativeRoute)
            .map((entry) => entry.representativeRoute)))
            .sort((a, b) => a === "/" ? -1 : b === "/" ? 1 : a.localeCompare(b));
          const authenticatedSeeds = Array.from(new Set(routeManifest
            .filter((entry) => entry.authenticated && entry.representativeRoute)
            .map((entry) => entry.representativeRoute)))
            .sort();'''
          replace_once(old_routes, new_routes, "derived route seeds")

          replace_once(
              '  while (queue.length > 0 && seen.size < 120) {',
              '  const routeLimit = Math.max(240, routeManifest.length * 6);\n  while (queue.length > 0 && seen.size < routeLimit) {',
              "route crawl limit",
          )

          replace_once(
              'await fs.mkdir(outputRoot, { recursive: true });\n\nconst browser = await chromium.launch({ headless: true });',
              'await fs.mkdir(outputRoot, { recursive: true });\nawait fs.writeFile(path.join(outputRoot, "route-manifest.json"), JSON.stringify({ sourceSha, routes: routeManifest }, null, 2));\n\nconst browser = await chromium.launch({ headless: true });',
              "route manifest artifact",
          )

          replace_once(
              'const criticalFindings = allRecords.filter((record) =>',
              'const routeCoverage = coverageForManifest({ routeManifest, allRecords, viewports, baseUrl });\nconst routeCoverageFindings = routeCoverage.filter((entry) => !entry.covered);\nconst expectedCoverageCount = routeManifest.length * viewports.length;\nconst coveredCoverageCount = expectedCoverageCount - routeCoverageFindings.length;\nconst routeCoveragePercent = expectedCoverageCount === 0 ? 0 : Number(((coveredCoverageCount / expectedCoverageCount) * 100).toFixed(2));\n\nconst criticalFindings = allRecords.filter((record) =>',
              "coverage calculation",
          )

          replace_once(
              '  totalScreenshots: allRecords.length,\n  routeCountByViewport:',
              '  totalScreenshots: allRecords.length,\n  discoveredPagePatterns: routeManifest.length,\n  expectedPatternViewportCoverage: expectedCoverageCount,\n  coveredPatternViewportCoverage: coveredCoverageCount,\n  routeCoveragePercent,\n  routeCountByViewport:',
              "summary coverage totals",
          )

          replace_once(
              '  findingCounts: {\n    critical:',
              '  findingCounts: {\n    routeCoverage: routeCoverageFindings.length,\n    critical:',
              "summary coverage findings",
          )

          replace_once(
              '  pages: allRecords,\n};',
              '  routeManifest,\n  routeCoverage,\n  pages: allRecords,\n};',
              "summary manifest detail",
          )

          replace_once(
              '  counts: summary.findingCounts,\n  critical:',
              '  discoveredPagePatterns: routeManifest.length,\n  routeCoveragePercent,\n  counts: summary.findingCounts,\n  uncoveredRoutes: routeCoverageFindings,\n  critical:',
              "audit summary coverage",
          )

          old_html = '<p>Mode: ${escapeHtml(evidenceMode)}. Source SHA: ${escapeHtml(sourceSha)}. Generated ${summary.generatedAt}. Total screenshots: ${summary.totalScreenshots}. Critical: ${criticalFindings.length}. Overflow: ${overflowFindings.length}. Warnings: ${warningFindings.length}.</p>'
          new_html = '<p>Mode: ${escapeHtml(evidenceMode)}. Source SHA: ${escapeHtml(sourceSha)}. Generated ${summary.generatedAt}. Repository page patterns: ${routeManifest.length}. Route/viewport coverage: ${coveredCoverageCount}/${expectedCoverageCount} (${routeCoveragePercent}%). Total screenshots: ${summary.totalScreenshots}. Missing route coverage: ${routeCoverageFindings.length}. Critical: ${criticalFindings.length}. Overflow: ${overflowFindings.length}. Warnings: ${warningFindings.length}.</p>'
          replace_once(old_html, new_html, "HTML coverage summary")

          replace_once(
              'console.log(`Captured ${allRecords.length} screenshots into ${outputRoot}`);\nconsole.log(`Critical findings: ${criticalFindings.length}; horizontal overflow: ${overflowFindings.length}; warnings: ${warningFindings.length}`);\nif (criticalFindings.length > 0 || overflowFindings.length > 0) process.exitCode = 1;',
              'console.log(`Discovered ${routeManifest.length} repository page patterns`);\nconsole.log(`Captured ${allRecords.length} screenshots into ${outputRoot}`);\nconsole.log(`Route/viewport coverage: ${coveredCoverageCount}/${expectedCoverageCount} (${routeCoveragePercent}%)`);\nconsole.log(`Missing route coverage: ${routeCoverageFindings.length}; critical findings: ${criticalFindings.length}; horizontal overflow: ${overflowFindings.length}; warnings: ${warningFindings.length}`);\nif (routeCoverageFindings.length > 0 || criticalFindings.length > 0 || overflowFindings.length > 0 || warningFindings.length > 0) process.exitCode = 1;',
              "fail-closed evidence gate",
          )

          path.write_text(source, encoding="utf-8")

      - name: Validate patched scripts
        run: |
          node --check scripts/screenshot-route-manifest.mjs
          node --check scripts/capture-production-pages.mjs
          git diff --check

      - name: Commit exact coverage repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/capture-production-pages.mjs
          git commit -m "test: require complete repository route screenshot coverage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
