name: Apply PDF foreign ID guard

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/cross-tenant-supplied-id-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply nested document ownership guard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/tenders/[id]/finalize-pdf/route.ts')
          s = p.read_text()
          anchor = '''    const activeDocs = tender.generatedDocuments.filter((d: any) => isFinalExportCandidateDocument(d));'''
          insertion = '''    const activeDocs = tender.generatedDocuments.filter((d: any) => isFinalExportCandidateDocument(d));
              // Explicit document IDs are scoped to the already owner-filtered tender.
              // Return the same non-enumerating 404 for nonexistent and foreign IDs.
              if (docId && !activeDocs.some((document: any) => document.id === docId)) {
                return err("Source document not found", 404, { code: "PDF_SOURCE_NOT_FOUND" });
              }'''
          if anchor not in s:
              raise SystemExit('activeDocs anchor not found')
          if 'PDF_SOURCE_NOT_FOUND' not in s:
              s = s.replace(anchor, insertion, 1)
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/tenders/[id]/finalize-pdf/route.ts
          git commit -m "fix: hide foreign PDF source document IDs"
          git push origin HEAD:${{ github.head_ref }}
