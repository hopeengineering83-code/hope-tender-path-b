name: Export release snapshot source

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: release-snapshot-source
          path: lib/engine/tender-release-snapshot.ts
          if-no-files-found: error
          retention-days: 1
