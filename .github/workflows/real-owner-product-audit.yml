name: Real owner-account product audit

on:
  push:
    branches:
      - audit/real-owner-product-workflow-20260724
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: real-owner-product-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      AUDIT_BASE_URL: https://hope-tender-path-9cs3akkgn-hopeengineering83-codes-projects.vercel.app
      REAL_APP_EMAIL: ${{ secrets.SCREENSHOT_TEST_EMAIL || secrets.REAL_APP_EMAIL || secrets.APP_LOGIN_EMAIL || secrets.OWNER_EMAIL || secrets.ADMIN_EMAIL || secrets.E2E_REAL_EMAIL || secrets.E2E_TEST_EMAIL || secrets.SMOKE_TEST_EMAIL || secrets.TEST_EMAIL || secrets.LOGIN_EMAIL || secrets.EMAIL }}
      REAL_APP_PASSWORD: ${{ secrets.SCREENSHOT_TEST_PASSWORD || secrets.REAL_APP_PASSWORD || secrets.APP_LOGIN_PASSWORD || secrets.OWNER_PASSWORD || secrets.ADMIN_PASSWORD || secrets.E2E_REAL_PASSWORD || secrets.E2E_TEST_PASSWORD || secrets.SMOKE_TEST_PASSWORD || secrets.TEST_PASSWORD || secrets.LOGIN_PASSWORD || secrets.PASSWORD }}
      VERCEL_BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET || secrets.VERCEL_PROTECTION_BYPASS_SECRET || secrets.VERCEL_BYPASS_SECRET }}
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout exact audit branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit real owner account on latest PR 1175 preview
        id: audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p real-app-audit
          if [ -z "${REAL_APP_EMAIL:-}" ] || [ -z "${REAL_APP_PASSWORD:-}" ]; then
            echo "The repository login secrets were unavailable. Expected SCREENSHOT_TEST_EMAIL and SCREENSHOT_TEST_PASSWORD." | tee real-app-audit/run-error.txt
            exit 2
          fi
          node scripts/audit-real-owner-app.mjs 2>&1 | tee real-app-audit/run.log

      - name: Upload full real-account audit package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-owner-product-audit-${{ github.sha }}
          path: real-app-audit/
          if-no-files-found: warn
          retention-days: 7

      - name: Post non-secret audit summary to PR 1175
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -f real-app-audit/audit-summary.md ]; then
            {
              echo "## Real owner-account audit — ${GITHUB_SHA}"
              echo
              echo "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              cat real-app-audit/audit-summary.md
            } > /tmp/audit-comment.md
          else
            {
              echo "## Real owner-account audit could not complete — ${GITHUB_SHA}"
              echo
              echo "Workflow: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "Outcome: ${AUDIT_OUTCOME}"
              echo
              if [ -f real-app-audit/run-error.txt ]; then cat real-app-audit/run-error.txt; else echo "See the workflow log and uploaded audit artifact for the non-secret failure reason."; fi
            } > /tmp/audit-comment.md
          fi
          gh api "repos/${GITHUB_REPOSITORY}/issues/1175/comments" -f body="$(cat /tmp/audit-comment.md)"

      - name: Fail job when audit failed
        if: steps.audit.outcome != 'success'
        run: exit 1
