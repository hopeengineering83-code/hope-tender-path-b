name: Sanitize real-account audit outputs

on:
  pull_request:
    branches:
      - release/consolidated-recovery-20260717
  push:
    branches:
      - audit/real-owner-product-workflow-20260724
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

concurrency:
  group: sanitize-real-owner-audit
  cancel-in-progress: false

jobs:
  sanitize:
    runs-on: ubuntu-24.04
    steps:
      - name: Sanitize audit comments on PR 1175
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          replacement='## Security cleanup completed

A temporary real-account audit diagnostic was removed because it could contain sensitive login URL data. The credential must be rotated before further testing. No credential is retained in this comment.'
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1175/comments?per_page=100" \
            --jq '.[] | select((.body // "") | contains("Real owner-account")) | .id' \
            | while read -r id; do
                [ -n "$id" ] || continue
                gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$replacement" >/dev/null
              done

      - name: Delete real-account audit artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for id in 8605889080 8605954063 8606252216 8606371648; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}" >/dev/null 2>&1 || true
          done

      - name: Confirm no matching diagnostic comment remains
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1175/comments?per_page=100" \
            --jq '[.[] | select((.body // "") | contains("Browser login did not reach the dashboard"))] | length' \
            | awk '{s+=$1} END {print s+0}')
          test "$count" -eq 0
