name: Preserve invalid tender cleanup manifest

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/tender-delete-storage-manifest-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Preserve original manifest for operator recovery
        run: |
          python - <<'PY'
          from pathlib import Path

          helper = Path('lib/tender/tender-storage-cleanup-task.ts')
          s = helper.read_text()
          overwrite = '''        metadata: JSON.stringify({
                    version: 1,
                    status: "INVALID",
                    failureCode: "INVALID_CLEANUP_MANIFEST",
                    invalidAt: now.toISOString(),
                  }),
          '''
          if overwrite not in s:
              raise SystemExit('invalid manifest metadata overwrite not found')
          s = s.replace(overwrite, '', 1)
          description = '        description: "Tender storage cleanup task is invalid and requires operator review",'
          protected = '''        // Preserve the original internal bytes. Even malformed JSON may
                  // contain the only recoverable storage pointers for operator repair.
                  description: "Tender storage cleanup task is invalid and requires operator review",'''
          if description not in s:
              raise SystemExit('invalid manifest description anchor not found')
          s = s.replace(description, protected, 1)
          helper.write_text(s)

          test = Path('tests/tender-storage-cleanup-task-current.test.ts')
          t = test.read_text()
          import_old = '''  TENDER_STORAGE_CLEANUP_COMPLETED,
            TENDER_STORAGE_CLEANUP_PENDING,'''
          import_new = '''  TENDER_STORAGE_CLEANUP_COMPLETED,
            TENDER_STORAGE_CLEANUP_INVALID,
            TENDER_STORAGE_CLEANUP_PENDING,'''
          if import_old not in t:
              raise SystemExit('invalid constant import anchor not found')
          t = t.replace(import_old, import_new, 1)

          harness_old = '''        action = args.data.action;
                metadata = args.data.metadata;
                return { count: 1 };'''
          harness_new = '''        action = args.data.action;
                if (typeof args.data.metadata === "string") metadata = args.data.metadata;
                return { count: 1 };'''
          if harness_old not in t:
              raise SystemExit('processor harness updateMany anchor not found')
          t = t.replace(harness_old, harness_new, 1)

          state_old = '''    state: () => ({ action, metadata: JSON.parse(metadata) as Record<string, any> }),'''
          state_new = '''    state: () => ({
                  action,
                  metadataRaw: metadata,
                  metadata: (() => {
                    try { return JSON.parse(metadata) as Record<string, any>; }
                    catch { return null; }
                  })(),
                }),'''
          if state_old not in t:
              raise SystemExit('processor state anchor not found')
          t = t.replace(state_old, state_new, 1)

          anchor = '  it("claims, deletes every object, and marks the task completed", async () => {'
          case = '''  it("marks an invalid manifest for review without destroying its original bytes", async () => {
              const original = "not-json: blob://recover-this-object";
              const h = processorHarness({ metadata: original });
              const result = await processTenderStorageCleanupTask({
                prisma: h.prisma as any,
                storage: h.storage as any,
                taskId: "task-1",
                now: new Date("2026-07-12T18:00:00.000Z"),
              });

              assert.deepEqual(result, {
                found: true,
                claimed: false,
                completed: false,
                cleaned: 0,
                remaining: 0,
                failures: 1,
              });
              assert.equal(h.state().action, TENDER_STORAGE_CLEANUP_INVALID);
              assert.equal(h.state().metadataRaw, original);
              assert.equal(h.state().metadata, null);
              assert.ok(!h.events.some((event) => event.startsWith("storage:")));
            });

          '''
          if anchor not in t:
              raise SystemExit('task processing test anchor not found')
          if 'without destroying its original bytes' not in t:
              t = t.replace(anchor, case + anchor, 1)
          test.write_text(t)
          PY
      - name: Commit preservation fix
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/tender/tender-storage-cleanup-task.ts tests/tender-storage-cleanup-task-current.test.ts
          git commit -m "fix: preserve invalid cleanup manifests for recovery"
          git push origin HEAD:${{ github.head_ref }}
