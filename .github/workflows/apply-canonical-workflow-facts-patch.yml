name: Apply canonical workflow facts patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/release-snapshot-final-facts-parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply exact patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/engine/canonical-workflow-decision.ts')
          s = p.read_text()
          old = '''  // ─── Tender Details (metadata) ──────────────────────────────────────────
            // METADATA IS NO LONGER A HARD BLOCKER per the unified runtime model —
            // snapshot.metadata.gateValid is always true. We mirror that here so the
            // canonical decision never blocks on metadata. (If metadata regains
            // blocker status in the future, this is the single place to change.)
            const criticalTenderDetailsValid = true;
          '''
          new = '''  // ─── Tender Details authority ─────────────────────────────────────────
            // Pre-generation workflow stages use the canonical DRAFT authority signal.
            // Final-only source/audit authority is deliberately not applied here; it is
            // already enforced by snapshot.finalZipEligible at the export boundary.
            const criticalTenderDetailsValid = !snapshot.metadata.hasGenerationBlocker;
          '''
          if old not in s:
              raise SystemExit('expected hard-coded Tender Details block not found')
          s = s.replace(old, new, 1)
          if 'const criticalTenderDetailsValid = true' in s:
              raise SystemExit('hard-coded Tender Details validity remains')
          if 'const finalExportAllowed = snapshot.finalZipEligible' not in s:
              raise SystemExit('final export authority wiring missing')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/engine/canonical-workflow-decision.ts
          git commit -m "fix: derive canonical workflow Tender Facts authority"
          git push origin HEAD:${{ github.head_ref }}
