name: Scope tender cleanup response source pin

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/tender-delete-storage-manifest-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Restrict task ID secrecy assertion to HTTP response
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/performance-storage-observability-hardening.test.ts')
          s = p.read_text()
          old = '''    assert.doesNotMatch(deleteRegion, /\.deleteFile\(\{/);
              assert.doesNotMatch(deleteRegion, /storageCleanupTaskId\s*[,}]/);'''
          new = '''    assert.doesNotMatch(deleteRegion, /\.deleteFile\(\{/);
              const response = deleteRegion.match(
                /return NextResponse\\.json\\(\\{ success: true, correlationId, storageCleanupPending \\}\\);/,
              )?.[0] ?? "";
              assert.match(response, /storageCleanupPending/);
              assert.doesNotMatch(response, /storageCleanupTaskId|storagePath/);'''
          if old not in s:
              raise SystemExit('cleanup response assertion anchor not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit source-pin update
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/performance-storage-observability-hardening.test.ts
          git commit -m "test: scope cleanup secrecy to HTTP response"
          git push origin HEAD:${{ github.head_ref }}
