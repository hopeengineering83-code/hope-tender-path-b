name: Apply analysis requirement count patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/analysis-requirement-count-truth'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Apply exact patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/engine/analysis-orchestrator.ts')
          s = p.read_text()
          import_anchor = 'import { logger } from "../observability";'
          import_line = 'import { getExtractedRequirementCount } from "./analysis-result-metrics";'
          if import_line not in s:
              if import_anchor not in s:
                  raise SystemExit('import anchor not found')
              s = s.replace(import_anchor, import_anchor + '\n' + import_line, 1)
          old_count = '  const requirementCount = analysisMeta?.result?.requirements?.length ?? 0;'
          new_count = '  const requirementCount = getExtractedRequirementCount(analysisMeta?.result);'
          if old_count not in s:
              raise SystemExit('progress requirement count anchor not found')
          s = s.replace(old_count, new_count, 1)
          old_return = '    requirementCount: analysisMeta?.chunkResults.length ?? 0,'
          new_return = '    requirementCount,'
          if old_return not in s:
              raise SystemExit('incorrect return requirement count anchor not found')
          s = s.replace(old_return, new_return, 1)
          if 'requirementCount: analysisMeta?.chunkResults.length' in s:
              raise SystemExit('chunk count still exposed as requirement count')
          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/engine/analysis-orchestrator.ts
          git commit -m "fix: report merged requirement count truthfully"
          git push origin HEAD:${{ github.head_ref }}
