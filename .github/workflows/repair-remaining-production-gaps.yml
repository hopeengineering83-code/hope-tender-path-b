name: Repair Remaining Production Gaps

on:
  push:
    branches:
      - release/consolidated-recovery-20260717
    paths:
      - scripts/repair_remaining_production_gaps.py
      - .github/workflows/repair-remaining-production-gaps.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repair-remaining-production-gaps
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/consolidated-recovery-20260717
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Apply deterministic repair set
        run: python scripts/repair_remaining_production_gaps.py

      - name: Validate patch formatting
        run: git diff --check

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run focused regression tests
        run: npx tsx --test tests/remaining-production-gaps-regression.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit validated repairs
        run: |
          if git diff --quiet; then
            echo "No repair changes were required."
            exit 0
          fi
          git config user.name "Hope Recovery Automation"
          git config user.email "recovery@hope-tender.local"
          git add \
            app/api/company/plan-b-import/finalize/route.ts \
            app/api/tenders/[id]/workflow-center/route.ts \
            app/dashboard/tenders/[id]/page.tsx \
            app/dashboard/tenders/page.tsx \
            components/ai-analyze-panel.tsx \
            components/analysis-quality-panel.tsx \
            components/delete-tender-button.tsx \
            lib/ai-jobs/analysis-job-service.ts \
            lib/ai.ts \
            lib/engine/ai-multi-perspective-matcher.ts \
            lib/engine/main-engine-ai-rematch.ts \
            lib/engine/run-tender-engine.ts \
            lib/engine/tender-analysis-content.ts \
            lib/engine/tender-release-snapshot.ts \
            lib/extract-text.ts \
            lib/plan-b-deduplicate.ts \
            lib/plan-b-vault-finalize.ts \
            lib/tender/canonical-source-files.ts \
            tests/remaining-production-gaps-regression.test.ts
          git commit -m "fix(recovery): resolve production workflow, duplicates, engine, and deletion gaps"
          git push origin HEAD:release/consolidated-recovery-20260717
