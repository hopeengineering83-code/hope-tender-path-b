name: Control Tower CI

on:
  pull_request:
    branches:
      - automation/control-plane
      - fix/github-control-tower
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: control-tower-ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validate-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validate workflow syntax with actionlint
        id: actionlint
        shell: bash
        run: |
          set -o pipefail
          docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 2>&1 | tee actionlint.log

      - name: Upload actionlint diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-tower-actionlint-${{ github.run_id }}
          path: actionlint.log
          if-no-files-found: error
          retention-days: 7

      - name: Validate provider registry
        run: |
          set -euo pipefail
          jq empty .github/agents/providers.json
          test "$(jq -r '.schema_version' .github/agents/providers.json)" = "2"
          test "$(jq -r '.default_provider' .github/agents/providers.json)" = "glm"
          test "$(jq -r '.providers["chatgpt-code"].capacity' .github/agents/providers.json)" = "2"
          test "$(jq -r '.future_provider_contract.must_not_claim_automatic_delivery_without_callback' .github/agents/providers.json)" = "true"
          test "$(jq -r '.rules.never_merge_main' .github/agents/providers.json)" = "true"
          test "$(jq -r '.rules.never_deploy_production' .github/agents/providers.json)" = "true"
          test "$(jq -r '.rules.never_run_production_migrations' .github/agents/providers.json)" = "true"
          test -f .github/agents/worker-roster.md
          test -f .github/agents/current-worker-prompts.md

      - name: Reject obsolete file-backed control state
        run: |
          set -euo pipefail
          test ! -e .github/release-control/integration-branch.txt
          if [ -d .github/release-control/findings ] && find .github/release-control/findings -type f -name '*.json' -print -quit | grep -q .; then
            echo 'File-backed findings are obsolete; use durable GitHub Issues.'
            exit 1
          fi
          if grep -R -nE 'release-control/findings/|integration-branch\.txt' \
            .github/agents .github/release-control/README.md; then
            echo 'Contracts still reference obsolete file-backed authority.'
            exit 1
          fi

      - name: Reject merge, approval, and production deployment paths
        run: |
          set -euo pipefail
          failed=0
          while IFS= read -r workflow; do
            case "$workflow" in
              .github/workflows/control-tower-ci.yml|.github/workflows/release-gate.yml)
                continue
                ;;
            esac
            if grep -nE 'enablePullRequestAutoMerge|gh pr merge|gh pr review.*--approve|vercel( deploy)? .*--prod' "$workflow"; then
              echo "Forbidden merge, approval, or production deployment path found in $workflow."
              failed=1
            fi
          done < <(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) | sort)
          test "$failed" -eq 0

      - name: Reject CI-only automatic acceptance
        run: |
          set -euo pipefail
          # Green CI must never mint approval or integration authority.
          if grep -nE 'APPROVED_HEAD_SHA|ready-for-integrator' .github/workflows/repair-coordinator.yml; then
            echo 'Repair coordinator must not create approval or integration markers from green CI alone.'
            exit 1
          fi
          grep -q 'VALIDATED_HEAD_SHA' .github/workflows/repair-coordinator.yml
          grep -q 'awaiting-independent-audit' .github/workflows/repair-coordinator.yml
          # Integration requires an authorized independent audit tied to the exact head.
          grep -q 'CONTROL_TOWER_AUDIT' .github/workflows/integration-controller.yml
          grep -q 'Reviewer-Role' .github/workflows/integration-controller.yml
          grep -q 'Reviewed-Head-SHA' .github/workflows/integration-controller.yml
          grep -q 'Missing authorized exact-head acceptance comment' .github/workflows/integration-controller.yml
          grep -q 'unresolved actionable review thread' .github/workflows/integration-controller.yml

      - name: Require safe exact-head worker validation
        run: |
          set -euo pipefail
          wf=.github/workflows/worker-validation.yml
          test -f "$wf"
          # Safe trigger: pull_request (never pull_request_target) for the worker base.
          grep -qE '^[[:space:]]*pull_request:' "$wf"
          if grep -qE 'pull_request_target[[:space:]]*:' "$wf"; then echo 'worker validation must not use the pull_request_target trigger.'; exit 1; fi
          grep -q 'integration/controlled-recovery' "$wf"
          # Disposable PostgreSQL with RUN_DB_INTEGRATION and fail-closed classification.
          grep -q 'image: postgres:16' "$wf"
          grep -q 'RUN_DB_INTEGRATION' "$wf"
          grep -q 'NOT_CONFIGURED' "$wf"
          grep -q 'SKIPPED_BLOCKER' "$wf"
          # Required build/test surface. The test surface is declared in the
          # required-suite manifest and executed by the fail-closed runner.
          grep -q 'npm ci' "$wf"
          grep -q 'prisma validate' "$wf"
          grep -q 'prisma generate' "$wf"
          grep -q 'npm run typecheck' "$wf"
          grep -q 'npm run lint' "$wf"
          grep -q 'run-required-suites.sh' "$wf"
          grep -q 'npm run build' "$wf"
          test -f .github/release-control/required-suites.json
          test -f .github/release-control/run-required-suites.sh
          test -f .github/release-control/independent-auditors.json
          test -f .github/release-control/required-checks.json
          jq empty .github/release-control/required-suites.json
          jq empty .github/release-control/independent-auditors.json
          jq empty .github/release-control/required-checks.json
          # Trusted harness: the runner+manifest execute from a trusted default-branch
          # checkout, and authenticated E2E users are seeded with CI-only credentials.
          grep -q '_trusted/.github/release-control/run-required-suites.sh' "$wf"
          grep -q 'scripts/seed-e2e-user.mjs' "$wf"
          # Privilege separation: an untrusted execute job runs worker code, a
          # separate publish-evidence job holds checks:write and runs none.
          grep -q 'execute:' "$wf"
          grep -q 'publish-evidence:' "$wf"
          grep -q 'checks: write' "$wf"
          # Least privilege: no write to contents/pull-requests/issues anywhere
          # (anchored to real permission-key lines so comments cannot trip it).
          if grep -qE '^[[:space:]]*(pull-requests|issues|contents):[[:space:]]*write[[:space:]]*$' "$wf"; then echo 'worker validation must not request write scopes beyond checks:write.'; exit 1; fi
          # Exact-head invalidation and no production database secret / deploy / merge.
          grep -q 'head moved during validation' "$wf"
          if grep -qE 'secrets\.[A-Z_]*DATABASE' "$wf"; then echo 'worker validation must not reference a production database secret.'; exit 1; fi
          if grep -qE 'gh pr merge|gh pr review.*--approve|vercel .*--prod' "$wf"; then echo 'worker validation must not merge, approve, or deploy.'; exit 1; fi

      - name: Require immutable lane mapping bound to the real fixed pool
        run: |
          set -euo pipefail
          map=.github/release-control/lane-mapping.json
          manifest=.github/release-control/required-suites.json
          wf=.github/workflows/worker-validation.yml
          ctrl=.github/workflows/integration-controller.yml
          test -f "$map"
          jq empty "$map"
          test "$(jq -r '.expected_base' "$map")" = 'integration/controlled-recovery'
          # The 8 coding lanes must exist in BOTH the mapping and the suite manifest,
          # each with a real (non-null) authorized branch mapped to its exact issue.
          declare -A ISSUES=( [GLM-A1]=1134 [GLM-A2]=1135 [GLM-X1]=1136 [CHATGPT-C1]=1137 [CHATGPT-C2]=1138 [JULES-T1]=1143 [JULES-U1]=1144 [JULES-S2]=1145 )
          for lane in "${!ISSUES[@]}"; do
            test "$(jq -r --arg l "$lane" '.lanes | has($l)' "$map")" = 'true'
            test "$(jq -r --arg l "$lane" '.lanes | has($l)' "$manifest")" = 'true'
            test "$(jq -r --arg l "$lane" '.lanes[$l].issue' "$map")" = "${ISSUES[$lane]}"
            br="$(jq -r --arg l "$lane" '.lanes[$l].branch' "$map")"
            test -n "$br" && test "$br" != 'null'
          done
          # CODEX-D1 is the single Codex chat: read-only, no branch, no manifest suite,
          # until an exact-SHA START_AUTHORIZATION.
          test "$(jq -r '.lanes["CODEX-D1"].issue' "$map")" = '1156'
          test "$(jq -r '.lanes["CODEX-D1"].requires_start_authorization' "$map")" = 'true'
          test "$(jq -r '.lanes["CODEX-D1"].branch' "$map")" = 'null'
          test "$(jq -r '.lanes["CODEX-D1"].status' "$map")" = 'read-only'
          test "$(jq -r '.lanes | has("CODEX-D1")' "$manifest")" = 'false'
          # The cross-cutting critical findings are DEPENDENCIES, not lanes, and must
          # never be assigned to a simple worker lane.
          for dep in 1149 1151 1152 1153 1154 1155; do
            test "$(jq -r --arg d "$dep" '.dependencies | has($d)' "$map")" = 'true'
            test "$(jq -r --arg d "$dep" '.dependencies[$d].is_lane' "$map")" = 'false'
          done
          for notlane in AI-SAFETY AI-RUNTIME TENANCY OPERATIONS PRODUCT-TRUTH; do
            test "$(jq -r --arg l "$notlane" '.lanes | has($l)' "$map")" = 'false'
            test "$(jq -r --arg l "$notlane" '.lanes | has($l)' "$manifest")" = 'false'
          done
          # Lane is derived from issue+branch, then the label is verified (both places).
          grep -qF 'def.branch === pr.head.ref' "$wf"
          grep -qF 'derived lane' "$wf"
          grep -qF "def.branch === pr.head.ref" "$ctrl"
          # Integration policy is bound to ONE pinned trusted control SHA (no mutable reload).
          grep -qF 'controlSha = br.commit.sha' "$ctrl"
          grep -qF "path: '.github/release-control/lane-mapping.json', ref: controlSha" "$ctrl"
          grep -qF "path: '.github/release-control/independent-auditors.json', ref: controlSha" "$ctrl"
          grep -qF "path: '.github/release-control/required-checks.json', ref: controlSha" "$ctrl"

      - name: Require activation truth
        run: |
          set -euo pipefail
          grep -q 'not an active autonomous control plane' .github/release-control/README.md
          grep -q 'workflows exist on the default branch' .github/agents/integrator-contract.md

      - name: Run control-plane simulations
        id: simulations
        shell: bash
        run: |
          set -o pipefail
          {
            set -euo pipefail
            for area in activation dispatch gates; do
              dir=".github/release-control/tests/$area"
              test -d "$dir" || { echo "Missing simulation directory: $dir"; exit 1; }
              mapfile -t tests < <(find "$dir" -maxdepth 1 -type f -name '*.sh' | sort)
              test "${#tests[@]}" -gt 0 || { echo "No executable simulations in $dir"; exit 1; }
              for test_file in "${tests[@]}"; do
                echo "Running $test_file"
                bash -x "$test_file"
              done
            done
          } 2>&1 | tee control-tower-simulations.log

      - name: Upload simulation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: control-tower-simulations-${{ github.run_id }}
          path: control-tower-simulations.log
          if-no-files-found: error
          retention-days: 7

      - name: Prove bootstrap cannot target main
        run: |
          set -euo pipefail
          test "${{ github.base_ref }}" != 'main' || {
            echo 'Control Tower bootstrap PR must not target main.'
            exit 1
          }
