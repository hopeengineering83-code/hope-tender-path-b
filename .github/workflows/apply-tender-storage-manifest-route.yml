name: Apply tender storage cleanup route

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/tender-delete-storage-manifest-current'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace post-delete best-effort cleanup with durable task processing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/api/tenders/[id]/route.ts')
          s = p.read_text()

          import_anchor = 'import { executeTenderDeletion } from "../../../../lib/tender/delete-tender";'
          import_block = '''import { executeTenderDeletion } from "../../../../lib/tender/delete-tender";
          import { processTenderStorageCleanupTask } from "../../../../lib/tender/tender-storage-cleanup-task";'''
          if 'processTenderStorageCleanupTask' not in s:
              if import_anchor not in s:
                  raise SystemExit('tender deletion import anchor not found')
              s = s.replace(import_anchor, import_block, 1)

          start_marker = '''    // Read storagePaths BEFORE the transaction deletes the TenderFile rows,'''
          end_marker = '''    await logAction({'''
          start = s.find(start_marker, s.find('export async function DELETE'))
          end = s.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('old cleanup block markers not found')

          replacement = '''    const deletionResult = await prisma.$transaction(
                async (tx) => executeTenderDeletion(
                  tx,
                  tenderId,
                  correlationId,
                  actor.id,
                ),
                { timeout: 30000, isolationLevel: "Serializable" },
              );

              // The cleanup pointer was committed inside the deletion transaction.
              // Attempt it immediately for responsiveness, but never lose retry state:
              // failed objects remain in the durable AuditLog manifest for the cron.
              let storageCleanupPending = false;
              if (deletionResult.storageCleanupTaskId) {
                try {
                  const cleanup = await processTenderStorageCleanupTask({
                    prisma,
                    storage: getStorageAdapter(),
                    taskId: deletionResult.storageCleanupTaskId,
                  });
                  storageCleanupPending = !cleanup.completed;
                } catch (cleanupError) {
                  storageCleanupPending = true;
                  logger.warn("[tender-delete] immediate storage cleanup deferred", {
                    tenderId,
                    correlationId,
                    errorClass: cleanupError instanceof Error
                      ? cleanupError.constructor.name
                      : "UnknownError",
                  });
                }
              }

          '''
          s = s[:start] + replacement + s[end:]

          old_response = '    return NextResponse.json({ success: true, correlationId });'
          new_response = '    return NextResponse.json({ success: true, correlationId, storageCleanupPending });'
          if old_response not in s:
              raise SystemExit('success response anchor not found')
          s = s.replace(old_response, new_response, 1)

          delete_region = s[s.find('export async function DELETE'):]
          if 'filesForCleanup' in delete_region:
              raise SystemExit('ephemeral cleanup array remains')
          if '.deleteFile({' in delete_region:
              raise SystemExit('direct best-effort storage delete remains')
          if 'executeTenderDeletion(\n' not in delete_region or 'actor.id' not in delete_region:
              raise SystemExit('actor-bound deletion call missing')
          p.write_text(s)
          PY
      - name: Commit route patch
        run: |
          if git diff --quiet; then
            echo "No patch required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/tenders/[id]/route.ts
          git commit -m "fix: persist tender storage cleanup before deletion"
          git push origin HEAD:${{ github.head_ref }}
