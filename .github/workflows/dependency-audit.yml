name: Dependency security audit

on:
  pull_request:
    branches:
      - integration/production-engine-2026-06
      - release/production-engine-2026-06
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-dependencies:
    name: Production dependency advisories
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install lockfile dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Capture production dependency audit
        id: audit
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > npm-audit.json
          status=$?
          echo "audit_exit=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Enforce no high or critical production advisories
        run: |
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit.json', 'utf8'));
          const counts = audit.metadata?.vulnerabilities ?? {};
          console.log(JSON.stringify({ vulnerabilities: counts }, null, 2));
          if ((counts.high ?? 0) > 0 || (counts.critical ?? 0) > 0) {
            console.error(`Blocking release: ${counts.high ?? 0} high and ${counts.critical ?? 0} critical production advisories.`);
            process.exit(1);
          }
          NODE

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-production-audit
          path: npm-audit.json
          if-no-files-found: error
          retention-days: 7
