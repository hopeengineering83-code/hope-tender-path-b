name: Integration Controller

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    branches:
      - integration/controlled-recovery
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: Worker PR number to validate and integrate
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  actions: read

concurrency:
  group: integration-controlled-recovery
  cancel-in-progress: false

jobs:
  preflight:
    if: >-
      (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'integration-approved') ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.validate.outputs.pr_number }}
      head_sha: ${{ steps.validate.outputs.head_sha }}
      integration_branch: ${{ steps.validate.outputs.integration_branch }}
    steps:
      - name: Validate immutable manager-accepted PR
        id: validate
        uses: actions/github-script@v7
        env:
          INPUT_PR: ${{ inputs.pr_number }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const prNumber = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : Number(process.env.INPUT_PR);
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
            if (pr.state !== 'open') throw new Error('PR is not open.');
            if (pr.base.ref !== 'integration/controlled-recovery') throw new Error('Worker PR must target integration/controlled-recovery.');
            if (pr.head.repo.full_name !== `${owner}/${repo}`) throw new Error('Fork PRs are not eligible.');
            const head = pr.head.sha;

            // Pin ONE trusted control SHA (the default branch's current commit) for the
            // ENTIRE preflight. The lane mapping, independent-auditor allow-list, and
            // required-check allow-list are ALL read at this exact ref, so policy cannot
            // change between validation, audit, and integration. The same SHA the worker
            // validation harness pinned governs acceptance; a moving default branch after
            // acceptance cannot silently reload weaker policy.
            const defBranch = context.payload.repository?.default_branch || 'main';
            let controlSha;
            try {
              const { data: br } = await github.rest.repos.getBranch({ owner, repo, branch: defBranch });
              controlSha = br.commit.sha;
            } catch (e) { throw new Error('Trusted control SHA (default branch commit) could not be resolved (fail closed).'); }

            const actor = context.eventName === 'pull_request' ? context.payload.sender.login : context.actor;
            const { data: actorLevel } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: actor });
            if (!['admin', 'maintain', 'write'].includes(actorLevel.permission)) throw new Error('Integration actor lacks write permission.');

            // Reviews — a requested-changes review or ANY unresolved actionable
            // review thread blocks integration. All enumerations are fully
            // paginated so a decision is never made on a truncated first page.
            const reviews = await github.paginate(github.rest.pulls.listReviews, { owner, repo, pull_number: prNumber, per_page: 100 });
            const latestReviews = new Map();
            for (const review of reviews) latestReviews.set(review.user.login, review.state);
            if ([...latestReviews.values()].includes('CHANGES_REQUESTED')) throw new Error('Requested-changes review exists.');
            let after = null, unresolvedThreads = 0;
            for (;;) {
              const q = await github.graphql(
                `query($owner:String!,$repo:String!,$number:Int!,$after:String){
                   repository(owner:$owner,name:$repo){ pullRequest(number:$number){
                     reviewThreads(first:100, after:$after){ nodes { isResolved isOutdated } pageInfo { hasNextPage endCursor } }
                   } } }`,
                { owner, repo, number: prNumber, after });
              const rt = q.repository.pullRequest.reviewThreads;
              unresolvedThreads += (rt.nodes || []).filter(thread => !thread.isResolved && !thread.isOutdated).length;
              if (!rt.pageInfo.hasNextPage) break;
              after = rt.pageInfo.endCursor;
            }
            if (unresolvedThreads) throw new Error(`${unresolvedThreads} unresolved actionable review thread(s) remain.`);

            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: prNumber, per_page: 100 });
            const forbidden = files.filter(file => file.filename.startsWith('.github/') || file.filename === 'vercel.json');
            if (forbidden.length) throw new Error(`Forbidden worker files: ${forbidden.map(file => file.filename).join(', ')}`);
            const migrations = files.filter(file => file.filename.startsWith('prisma/migrations/'));
            if (migrations.length && !/MIGRATION_DECLARED:\s*YES/i.test(pr.body || '')) throw new Error('Migration not declared.');

            // Immutable finding -> lane mapping. The PR's single lane label must be
            // mapped; its base must equal the mapped expected_base; and every changed
            // file must fall within the lane's permitted paths. A worker cannot widen
            // its lane or select a weaker one — the mapping is the authority.
            let laneMap;
            try {
              const { data: lm } = await github.rest.repos.getContent({ owner, repo, path: '.github/release-control/lane-mapping.json', ref: controlSha });
              laneMap = JSON.parse(Buffer.from(lm.content, 'base64').toString('utf8'));
            } catch (e) { throw new Error('lane-mapping.json is missing/unreadable at the trusted control SHA (fail closed).'); }
            // Derive the lane from the immutable ISSUE + exact BRANCH authority FIRST,
            // then require the label to match — identical to worker validation, so a
            // worker cannot select a weaker/unrelated recognized lane at integration.
            const mapLanes = laneMap.lanes || {};
            const derived = Object.entries(mapLanes).filter(([, def]) => def.branch && def.branch === pr.head.ref);
            if (derived.length !== 1) throw new Error(`Worker head branch '${pr.head.ref}' is not mapped to exactly one lane in the immutable mapping.`);
            const [derivedLane, laneDef] = derived[0];
            if (laneDef.requires_start_authorization) throw new Error(`Lane '${derivedLane}' is read-only and not eligible for integration without an exact-SHA START_AUTHORIZATION.`);
            const laneLabels = (pr.labels || []).map(l => l.name).filter(n => n.startsWith('lane:')).map(n => n.slice('lane:'.length));
            if (laneLabels.length !== 1) throw new Error('Worker PR must carry exactly one lane label.');
            if (laneLabels[0] !== derivedLane) throw new Error(`Lane label '${laneLabels[0]}' does not match the branch-derived lane '${derivedLane}'.`);
            const closes = (pr.body || '').match(/closes\s+#(\d+)/i);
            if (closes && laneDef.issue && Number(closes[1]) !== Number(laneDef.issue)) throw new Error(`PR Closes #${closes[1]} but branch maps to lane '${derivedLane}' (issue #${laneDef.issue}).`);
            if (pr.base.ref !== (laneMap.expected_base || 'integration/controlled-recovery')) throw new Error('Worker PR base does not match the lane mapping expected base.');
            const permitted = laneDef.permitted_paths || [];
            const outside = files.filter(file => !permitted.some(p => file.filename.startsWith(p)));
            if (outside.length) throw new Error(`Changed files outside lane '${laneLabels[0]}' permitted paths: ${outside.slice(0, 5).map(file => file.filename).join(', ')}`);

            // Independent-auditor allow-list, loaded from the trusted control-plane
            // config. A missing/empty list fails closed — no acceptance can be
            // authorized until a genuinely independent identity is provisioned.
            let independentLogins = [], independentApps = [];
            try {
              const { data: cfg } = await github.rest.repos.getContent({ owner, repo, path: '.github/release-control/independent-auditors.json', ref: controlSha });
              const parsed = JSON.parse(Buffer.from(cfg.content, 'base64').toString('utf8'));
              independentLogins = (parsed.independent_auditor_logins || []).map(s => String(s).toLowerCase());
              independentApps = (parsed.independent_auditor_app_slugs || []).map(s => String(s).toLowerCase());
            } catch (e) {
              core.warning('independent-auditors.json is missing/unreadable; no auditor identity can be authorized (fail closed).');
            }

            // Authorized INDEPENDENT audit tied to the EXACT head. Green CI alone is
            // never enough — integration requires a CONTROL_TOWER_AUDIT block:
            //   CONTROL_TOWER_AUDIT
            //   Decision: ACCEPT
            //   Reviewed-Head-SHA: <exact head>
            //   Reviewer-Role: independent
            // The auditor identity must be on the allow-list (a distinct human
            // collaborator, or a verifiable trusted GitHub App), must NOT be the PR
            // author, and a same-account marker is never independent. An audit whose
            // Reviewed-Head-SHA does not equal the current head is stale and rejected,
            // so any head movement after the audit invalidates acceptance. Comments
            // are fully paginated.
            const fieldOf = (lines, key) => {
              const found = lines.find(line => line.toLowerCase().startsWith(`${key.toLowerCase()}:`));
              return found ? found.slice(found.indexOf(':') + 1).trim() : null;
            };
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            let acceptedBy = null;
            for (const comment of [...comments].reverse()) {
              const lines = (comment.body || '').split(/\r?\n/).map(line => line.trim());
              if (!lines.includes('CONTROL_TOWER_AUDIT')) continue;
              if (fieldOf(lines, 'Decision') !== 'ACCEPT') continue;
              if ((fieldOf(lines, 'Reviewer-Role') || '').toLowerCase() !== 'independent') continue;
              if (fieldOf(lines, 'Reviewed-Head-SHA') !== head) continue;
              const login = (comment.user?.login || '').toLowerCase();
              if (!login || login === (pr.user?.login || '').toLowerCase()) continue; // author self-audit is never independent
              if (comment.user?.type === 'Bot') {
                const slug = login.replace(/\[bot\]$/, '');
                if (independentApps.includes(slug)) { acceptedBy = comment.user.login; break; }
                continue;
              }
              if (!independentLogins.includes(login)) continue; // human auditor must be allow-listed
              try {
                const { data: level } = await github.rest.repos.getCollaboratorPermissionLevel({ owner, repo, username: comment.user.login });
                if (['admin', 'maintain', 'write'].includes(level.permission)) { acceptedBy = comment.user.login; break; }
              } catch {
                // Ignore audits from actors who are no longer collaborators.
              }
            }
            if (!acceptedBy) throw new Error(`Missing authorized exact-head acceptance comment: an INDEPENDENT CONTROL_TOWER_AUDIT (Decision: ACCEPT, Reviewed-Head-SHA: ${head}, Reviewer-Role: independent) from an allow-listed independent identity that is not the PR author is required. Green CI alone is not approval.`);

            // Required-check allow-list from the trusted control-plane config. Named
            // check runs are the repository's real status model; a legacy combined
            // commit status is NOT required. ONLY the allow-listed required checks
            // grant or deny authority — unrelated informational, neutral, cancelled,
            // or stale third-party suites are not mandatory and cannot by themselves
            // block integration. A required check that is missing or not successful
            // fails closed. Check runs are fully paginated.
            let requiredChecks = [];
            try {
              const { data: rc } = await github.rest.repos.getContent({ owner, repo, path: '.github/release-control/required-checks.json', ref: controlSha });
              requiredChecks = JSON.parse(Buffer.from(rc.content, 'base64').toString('utf8')).required_checks || [];
            } catch (e) {
              throw new Error('required-checks.json is missing/unreadable; the required-check policy cannot be established (fail closed).');
            }
            if (requiredChecks.length === 0) throw new Error('No required checks are configured; integration cannot be authorized (fail closed).');
            const runs = await github.paginate(github.rest.checks.listForRef, { owner, repo, ref: head, per_page: 100 });
            const TRUSTED_APP_SLUG = 'github-actions';
            for (const name of requiredChecks) {
              // Only runs produced by the trusted GitHub Actions app count — a
              // required check emitted by an untrusted app cannot grant authority.
              const trusted = runs.filter(run => run.name === name && run.app?.slug === TRUSTED_APP_SLUG);
              if (trusted.length === 0) throw new Error(`Missing required exact-head check '${name}' from the trusted app.`);
              // Select the LATEST completed run so a failed first attempt followed by
              // a successful rerun is not permanently blocked by the stale failure.
              const completed = trusted.filter(run => run.status === 'completed');
              if (completed.length === 0) throw new Error(`Required exact-head check '${name}' has no completed trusted run.`);
              completed.sort((a, b) => new Date(b.completed_at || 0) - new Date(a.completed_at || 0));
              const latest = completed[0];
              // Anything other than success — skipped, neutral, cancelled, stale,
              // timed_out, action_required, or failure — blocks integration.
              if (latest.conclusion !== 'success') {
                throw new Error(`Latest trusted '${name}' run (${latest.id}) concluded '${latest.conclusion}'; integration is blocked.`);
              }
              core.notice(`Required check '${name}' satisfied by trusted run ${latest.id} (${latest.external_id || 'no-external-id'}).`);
            }

            const currentHead = (await github.rest.pulls.get({ owner, repo, pull_number: prNumber })).data.head.sha;
            if (currentHead !== head) throw new Error('PR head moved during preflight.');

            core.notice(`Independent audit by @${acceptedBy} accepted exact head ${head} for lane '${derivedLane}' under pinned trusted control SHA ${controlSha}`);
            core.setOutput('pr_number', String(prNumber));
            core.setOutput('head_sha', head);
            core.setOutput('integration_branch', 'integration/controlled-recovery');

  integrate-atomically:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.preflight.outputs.integration_branch }}
          fetch-depth: 0
      - name: Build candidate and fast-forward atomically
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.preflight.outputs.pr_number }}
          ACCEPTED_HEAD: ${{ needs.preflight.outputs.head_sha }}
          INTEGRATION_BRANCH: ${{ needs.preflight.outputs.integration_branch }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          START_SHA=$(git rev-parse HEAD)
          test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$ACCEPTED_HEAD"
          git fetch origin "$ACCEPTED_HEAD"
          git switch -c "candidate-${GITHUB_RUN_ID}" "$START_SHA"
          for sha in $(gh pr view "$PR_NUMBER" --json commits --jq '.commits[].oid'); do
            git cherry-pick "$sha" || {
              git cherry-pick --abort || true
              git reset --hard "$START_SHA"
              exit 1
            }
          done
          test "$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)" = "$ACCEPTED_HEAD"
          git push origin "HEAD:refs/heads/$INTEGRATION_BRANCH"
      - name: Record incorporation
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number('${{ needs.preflight.outputs.pr_number }}'),
              body: `INCORPORATED exact head \`${{ needs.preflight.outputs.head_sha }}\` into \`${{ needs.preflight.outputs.integration_branch }}\`. No merge to main or production deployment was performed.`
            });

  release-gate:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action == 'synchronize' &&
      github.event.pull_request.head.ref == 'integration/controlled-recovery' &&
      github.event.pull_request.base.ref == 'main'
    uses: ./.github/workflows/release-gate.yml
    with:
      ref: ${{ github.event.pull_request.head.sha }}
      integration-mode: true
    secrets: inherit
